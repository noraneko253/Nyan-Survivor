<style>

<canvas id="c"></canvas>

<!-- 管理者モード パスワードダイアログ -->
<div id="adminDialog" style="
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  display:none; align-items:center; justify-content:center; z-index:9999;
">
  <div style="
    background:#120028; border:1.5px solid #8844cc; border-radius:14px;
    padding:24px 28px; width:260px; text-align:center; color:#ddaaff;
    font-family:monospace; box-shadow:0 0 30px rgba(180,80,255,0.5);

    <div style="font-size:18px; font-weight:bold; margin-bottom:14px;">🔐 管理者パスワード</div>

      placeholder="パスワードを入力"

        width:100%; box-sizing:border-box;
        background:#220044; border:1px solid #6633aa; border-radius:8px;
        color:#fff; font-family:monospace; font-size:14px;
        padding:8px 12px; outline:none; margin-bottom:10px;
      "
    />
    <div id="adminPWError" style="color:#ff4444; font-size:12px; height:16px; margin-bottom:8px;"></div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button id="adminPWOk" style="
        background:#442288; color:#fff; border:none; border-radius:8px;
        padding:8px 20px; font-family:monospace; font-size:13px; cursor:pointer;
      ">✅ 確認</button>
      <button id="adminPWCancel" style="
        background:#551111; color:#fff; border:none; border-radius:8px;
        padding:8px 20px; font-family:monospace; font-size:13px; cursor:pointer;
      ">❌ キャンセル</button>
    </div>
  </div>
</div>

// ===== SKILL STATE =====
let skillCooldown = 0;
let skillMaxCD = 60;
let cutinAnim = null; // { progress, charId, skillName, skillNameEn, color, shadowColor }

function activateSkill() {
  if (skillCooldown > 0 || state !== 'playing') return;
  const c = player.charDef;
  const sk = CHAR_SKILLS[c.id];
  if (!sk) return;
  skillCooldown = sk.cooldown;
  skillMaxCD = sk.cooldown;
  // Per-char voice SFX
  if (c.id === 'kuro') playKuroSkillSFX();
  else if (c.id === 'tora') playSkillSFX();
  else playCharSkillSFX(c.id);
  // Start cutin
  cutinAnim = { progress: 0, charId: c.id, skillName: sk.name, skillNameEn: sk.nameEn, color: sk.color, shadowColor: sk.shadowColor, applied: false };
}

function updateSkill(dt) {
  if (skillCooldown > 0) skillCooldown -= dt;
  if (cutinAnim) {
    cutinAnim.progress += dt * 1.4;
    // Apply skill at peak of animation
    if (!cutinAnim.applied && cutinAnim.progress > 0.6) {
      cutinAnim.applied = true;
      const sk = CHAR_SKILLS[player.charDef.id];
      if (sk) sk.activate(player);
    }
    if (cutinAnim.progress >= 1.6) cutinAnim = null;
  }
  // Rush update
  if (player.skillRush && false) { // tora now uses cannon skill - no rush
    const sr = player.skillRush;
    sr.timer -= dt;
    sr.angle += dt * 18;
    sr.step++;
    if (sr.step % 3 === 0) {
      const a = sr.angle;
      player.x += Math.cos(a) * 22; player.y += Math.sin(a) * 22;
      for (const e of enemies) {
        if (dist(player.x, player.y, e.x, e.y) < e.r + 30) {
          e.takeDmg(80 * player.atkMul, 0.2, player.x - Math.cos(a), player.y - Math.sin(a));
        }
      }
    }
    if (sr.timer <= 0) delete player.skillRush;
  }
  // Shield reflect
  if (player.skillShield > 0) {
    player.skillShield -= dt;
    const sr2 = (80 + Math.sin(gameTime * 10) * 10);
    for (const e of enemies) {
      if (dist(player.x, player.y, e.x, e.y) < sr2 + e.r)
        e.takeDmg(25 * player.atkMul, 0.12, player.x, player.y);
    }
    if (player.skillShield <= 0) player.skillShield = 0;
  }
  // Dark Dimension (kuro new skill)
  if (player.darkDimension) {
    const dd = player.darkDimension;
    dd.timer -= dt;
    if (dd.phase === 'pull') {
      // Pull all enemies toward player
      for (const e of enemies) {
        const dx = player.x - e.x, dy = player.y - e.y;
        const d = Math.sqrt(dx*dx+dy*dy)||1;
        const pullStrength = Math.max(0, (350-d)/350) * 600;
        e.x += dx/d * pullStrength * dt;
        e.y += dy/d * pullStrength * dt;
        // Damage tick
        if (d < 280) e.takeDmg(8 * player.atkMul * dt * 60, 0.02, player.x, player.y);
      }
      // Visual: black hole effect
      if (Math.floor(dd.timer * 12) % 2 === 0) {
        fxList.push({ type: 'ring', x: player.x, y: player.y, r: 280, maxR: 0, life: 0.2, color: '#3300ff' });
      }
      if (dd.timer <= 0 && !dd.exploded) {
        dd.exploded = true;
        dd.phase = 'explode';
        dd.timer = 0.6;
        // MASSIVE explosion
        const blastR = 400;
        for (const e of enemies) {
          const d = Math.sqrt((e.x-player.x)**2 + (e.y-player.y)**2)||1;
          if (d < blastR) {
            const dmg = (200 + player.atkMul * 180) * (1 - d/blastR*0.6);
            e.takeDmg(dmg, 0.3, player.x - (e.x-player.x), player.y - (e.y-player.y));
          }
        }
        for (let ri = 0; ri < 5; ri++) {
          fxList.push({ type: 'explosion', x: player.x, y: player.y, r: 0, maxR: blastR - ri*30, life: 0.7, color: ri%2===0?'#4400ff':'#0000cc' });
        }
        fxList.push({ type: 'text', x: player.x, y: player.y-80, text: '暗黒炸裂！', life: 1.5, color: '#8800ff', vy: -50, big: true });
      }
    }
    if (dd.timer <= 0) delete player.darkDimension;
  }

  // Shadow army
  if (player.shadows) {
    player.shadows = player.shadows.filter(s => s.life > 0);
    for (const sh of player.shadows) {
      sh.life -= dt;
      sh.angle += dt * 1.5;
      const target = nearestEnemy(sh.x, sh.y, 280);
      if (target) {
        const dx = target.x - sh.x, dy = target.y - sh.y;
        const d = Math.sqrt(dx*dx+dy*dy)||1;
        sh.x += dx/d * 120 * dt; sh.y += dy/d * 120 * dt;
        sh.facing = dx > 0 ? 1 : -1;
      } else {
        const ax = player.x + Math.cos(sh.angle)*sh.orbitR;
        const ay = player.y + Math.sin(sh.angle)*sh.orbitR;
        sh.x += (ax-sh.x)*dt*4; sh.y += (ay-sh.y)*dt*4;
      }
      sh.timer -= dt;
      if (sh.timer <= 0) {
        sh.timer = 0.4;
        for (const e of enemies) {
          if (dist(sh.x, sh.y, e.x, e.y) < e.r + 18)
            e.takeDmg(22 * player.atkMul, 0.1, sh.x, sh.y);
        }
      }
    }
    if (player.shadows.length === 0) delete player.shadows;
  }
}

function drawCutin() {
  if (!cutinAnim) return;
  const p = cutinAnim.progress; // 0→1.6
  // Phase: 0-0.3 slide in, 0.3-1.0 hold, 1.0-1.6 fade out
  let slideX, alpha;
  if (p < 0.3) {
    const t2 = p / 0.3;
    const ease = 1 - Math.pow(1 - t2, 3);
    slideX = lerp(W + 100, 0, ease);
    alpha = ease;
  } else if (p < 1.0) {
    slideX = 0; alpha = 1;
  } else {
    const t2 = (p - 1.0) / 0.6;
    slideX = lerp(0, -W - 100, t2 * t2);
    alpha = 1 - t2;
  }
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  // Dark overlay strip
  const stripH = 200;
  const gy = H/2 - stripH/2;
  const grad = ctx.createLinearGradient(0, 0, 0, stripH);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.2, 'rgba(0,0,0,0.85)');
  grad.addColorStop(0.8, 'rgba(0,0,0,0.85)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(slideX, gy, W, stripH);
  // Colored glow line
  ctx.fillStyle = cutinAnim.color;
  ctx.shadowBlur = 30; ctx.shadowColor = cutinAnim.shadowColor;
  ctx.fillRect(slideX, H/2 - 4, W, 8);
  ctx.shadowBlur = 0;
  // Character image
  const cImg = imgs[cutinAnim.charId];
  if (cImg) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(slideX + W*0.7, H/2);
    // Silhouette glow
    ctx.shadowBlur = 40; ctx.shadowColor = cutinAnim.color;
    ctx.drawImage(cImg, -60, -80, 120, 150);
    ctx.restore();
  }
  // Skill name
  ctx.save();
  ctx.translate(slideX + 80, H/2 - 20);
  ctx.shadowBlur = 25; ctx.shadowColor = cutinAnim.color;
  ctx.fillStyle = cutinAnim.color;
  ctx.font = 'bold 42px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(cutinAnim.skillNameEn, 0, 0);
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px monospace';
  ctx.fillText(cutinAnim.skillName, 2, 46);
  ctx.restore();
  ctx.restore();
}

function drawDarkDimension() {
  if (!player || !player.darkDimension) return;
  const dd = player.darkDimension;
  const sx = player.x - cam.x, sy = player.y - cam.y;
  const t = gameTime;
  if (dd.phase === 'pull') {
    // Black hole distortion rings (inward)
    for (let ri = 0; ri < 4; ri++) {
      const r = 280 - ri * 50 + ((t * 120 + ri * 40) % 200 - 100);
      if (r < 0) continue;
      ctx.save();
      ctx.globalAlpha = 0.35 - ri * 0.06;
      ctx.strokeStyle = ri % 2 === 0 ? '#3300ff' : '#6600cc';
      ctx.lineWidth = 3 - ri * 0.5;
      ctx.shadowBlur = 15; ctx.shadowColor = '#3300ff';
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    // Dark center vortex
    const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120);
    grd.addColorStop(0, 'rgba(0,0,40,0.85)');
    grd.addColorStop(0.6, 'rgba(20,0,80,0.5)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.globalAlpha = 0.7;
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(sx, sy, 120, 0, Math.PI * 2); ctx.fill();
    // Rotating stars/particles being sucked in
    for (let pi = 0; pi < 8; pi++) {
      const pa = t * 6 + pi * Math.PI * 2 / 8;
      const pr = 60 + Math.sin(t * 5 + pi) * 30;
      const px2 = sx + Math.cos(pa) * pr, py2 = sy + Math.sin(pa) * pr;
      ctx.globalAlpha = 0.8; ctx.fillStyle = '#8866ff';
      ctx.beginPath(); ctx.arc(px2, py2, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawShadows() {
  if (!player || !player.shadows) return;
  for (const sh of player.shadows) {
    const sx = sh.x - cam.x, sy = sh.y - cam.y;
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.2 * Math.sin(gameTime*8 + sh.angle);
    ctx.filter = 'hue-rotate(270deg) brightness(0.5)';
    drawCatSprite(sx, sy, 20, player.charDef, sh.facing);
    ctx.restore();
    // Attack trail
    ctx.save(); ctx.globalAlpha = 0.25;
    const grd = ctx.createRadialGradient(sx,sy,0,sx,sy,22);
    grd.addColorStop(0,'rgba(150,0,255,0.5)'); grd.addColorStop(1,'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(sx,sy,22,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawSkillShield() {
  if (!player || !player.skillShield || player.skillShield <= 0) return;
  const sx = player.x - cam.x, sy = player.y - cam.y;
  const t = gameTime;
  const r = 85 + Math.sin(t*10)*8;
  ctx.save();
  // Hexagon shield
  ctx.globalAlpha = 0.35 + 0.15*Math.sin(t*8);
  ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 4;
  ctx.shadowBlur = 20; ctx.shadowColor = '#2244ff';
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(t*1.5);
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2; if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath(); ctx.stroke();
  ctx.restore();
  // Inner glow
  ctx.globalAlpha = 0.15;
  const grd = ctx.createRadialGradient(sx,sy,20,sx,sy,r);
  grd.addColorStop(0,'rgba(100,180,255,0.4)'); grd.addColorStop(1,'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== SKILL HUD =====
function drawSkillHUD() {
  if (!player) return;
  const sk = CHAR_SKILLS[player.charDef.id];
  if (!sk) return;

  const cx2 = 46, cy2 = H - 46;   // center of the circular gauge
  const outerR = 38, innerR = 26;
  const cdRatio = clamp(skillCooldown / skillMaxCD, 0, 1); // 1=full CD, 0=ready
  const readyRatio = 1 - cdRatio;                           // 1=ready, 0=empty

  ctx.save();

  // ---- Outer dark ring ----
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.beginPath(); ctx.arc(cx2, cy2, outerR + 3, 0, Math.PI * 2); ctx.fill();

  // ---- Background track ----
  ctx.strokeStyle = '#221133'; ctx.lineWidth = outerR - innerR;
  ctx.beginPath(); ctx.arc(cx2, cy2, (outerR + innerR) / 2, 0, Math.PI * 2); ctx.stroke();

  // ---- Charge arc (fills clockwise from top) ----
  const startA = -Math.PI / 2;          // 12 o'clock
  const endA   = startA + readyRatio * Math.PI * 2;
  const arcR   = (outerR + innerR) / 2;

  if (readyRatio > 0) {
    // Gradient along arc — use a conic-ish simulation with solid color + glow
    ctx.save();
    ctx.strokeStyle = cdRatio > 0 ? sk.color : '#ffffff';
    ctx.lineWidth = outerR - innerR;
    ctx.shadowBlur = cdRatio === 0 ? 18 : 8;
    ctx.shadowColor = sk.color;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.9 + 0.1 * Math.sin(gameTime * 6);
    ctx.beginPath(); ctx.arc(cx2, cy2, arcR, startA, endA); ctx.stroke();
    ctx.restore();
  }

  // ---- Portrait inside circle ----
  ctx.save();
  ctx.beginPath(); ctx.arc(cx2, cy2, innerR - 1, 0, Math.PI * 2); ctx.clip();
  if (cdRatio > 0) ctx.globalAlpha = 0.5; // dim when on cooldown
  const cImg = imgs[player.charDef.id];
  if (cImg) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(cImg, cx2 - innerR + 1, cy2 - innerR + 1, (innerR - 1) * 2, (innerR - 1) * 2);
  }
  ctx.restore();

  // ---- Inner border ----
  ctx.strokeStyle = cdRatio === 0 ? sk.color : '#443355';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx2, cy2, innerR - 1, 0, Math.PI * 2); ctx.stroke();

  // ---- Ready flash / ripple ----
  if (cdRatio === 0) {
    const ripple = (Math.sin(gameTime * 5) + 1) / 2;
    ctx.save(); ctx.globalAlpha = ripple * 0.35;
    ctx.strokeStyle = sk.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx2, cy2, outerR + 4 + ripple * 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // (Q! label removed per user request)
  }

  // ---- [Q] 必殺技 label above (bigger) ----
  ctx.fillStyle = cdRatio === 0 ? '#ddbbff' : '#6655aa';
  ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.shadowBlur = cdRatio === 0 ? 8 : 0; ctx.shadowColor = '#aa44ff';
  ctx.fillText('[Q] 必殺技', cx2, cy2 - outerR - 4);

  ctx.restore();
}

let audioCtx = null;
let bgmGain = null;
let sfxGain = null;
let bgmPlaying = false;
let bgmNodes = [];
let currentMusic = 'field';
let _homeBGMKey = 'title'; // Persists across screen changes — only changed by user explicitly

function playBGM(style) {
  if (!audioCtx || bgmPlaying && currentMusic === style) return;
  stopBGM();
  currentMusic = style;
  bgmPlaying = true;
  bgmMelodyIdx = 0; bgmBassIdx = 0; bgmBeat = 0;
  scheduleBGM(style);
}

// Play the home/menu BGM (uses _homeBGMKey, not 'title' hardcoded)
function playHomeBGM() {
  try { ensureAudio(); playBGM(_homeBGMKey); } catch(e) {}
}

// Return to home screen — restore home BGM only if not in map BGM context
function goToTitle() {
  state = 'title';
  if (!currentMusic || currentMusic === 'field' || currentMusic === 'night' ||
      currentMusic === 'grave' || currentMusic === 'hell' || currentMusic === 'snow' ||
      currentMusic === 'ocean' || currentMusic === 'corridor' || currentMusic === 'hell') {
    playHomeBGM();
  }
  // If already playing a home BGM style, keep it — don't restart
  const homeStyles = BGM_HOME_OPTIONS ? BGM_HOME_OPTIONS.map(o=>o.key) : ['title'];
  if (!homeStyles.includes(currentMusic)) playHomeBGM();
  challengeMode = false;
}

function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    bgmGain = audioCtx.createGain(); bgmGain.gain.value = 0.18;
    sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.35;
    bgmGain.connect(audioCtx.destination);
    sfxGain.connect(audioCtx.destination);
  } catch(e) { audioCtx = null; }
}

function ensureAudio() {
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

let bgmTimer = null;
let bgmMelodyIdx = 0, bgmBassIdx = 0;
let bgmBeat = 0;

function playBGM(style) {
  if (!audioCtx || bgmPlaying && currentMusic === style) return;
  stopBGM();
  currentMusic = style;
  bgmPlaying = true;
  bgmMelodyIdx = 0; bgmBassIdx = 0; bgmBeat = 0;
  scheduleBGM(style);
}

function stopBGM() {
  bgmPlaying = false;
  clearTimeout(bgmTimer);
  for (const n of bgmNodes) { try { n.stop(); } catch(e){} }
  bgmNodes = [];
}

function scheduleBGM(style) {
  if (!bgmPlaying || !audioCtx) return;
  const pat = BGM_PATTERNS[style] || BGM_EXTRA[style] || BGM_PATTERNS_HELL[style] || BGM_PATTERNS.field;
  const beatLen = 60 / pat.bpm;
  // Schedule melody note
  const mn = pat.melody[bgmMelodyIdx % pat.melody.length];
  const mFreq = NOTE[mn.n] || 440;
  scheduleTone(mFreq, mn.d * beatLen * 0.85, bgmGain, 'square', 0.08);
  // Schedule bass note every 2 beats
  if (bgmBeat % 2 === 0) {
    const bn = pat.bass[(bgmBeat/2) % pat.bass.length];
    const bFreq = NOTE[bn.n] || 220;
    scheduleTone(bFreq, bn.d * beatLen * 0.9, bgmGain, 'sawtooth', 0.055);
  }
  bgmMelodyIdx++;
  bgmBeat++;
  const nextDelay = mn.d * beatLen * 1000;
  bgmTimer = setTimeout(() => scheduleBGM(style), nextDelay);
}

function scheduleTone(freq, dur, gainNode, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur * 0.9);
  osc.connect(g); g.connect(gainNode);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
  bgmNodes.push(osc);
  // Clean up old nodes
  if (bgmNodes.length > 24) bgmNodes.splice(0, bgmNodes.length - 12);
}

// SFX functions
function playSFX(type) {
  if (!audioCtx) return;
  ensureAudio();
  switch(type) {
    case 'hit':       playSFXHit();       break;
    case 'enemydie':  playSFXEnemyDie();  break;
    case 'levelup':   playSFXLevelUp();   break;
    case 'bossapp':   playSFXBossApp();   break;
    case 'gemcoll':   playSFXGemColl();   break;
    case 'hurt':      playSFXHurt();      break;
    case 'click': {
      // やわらかいUI音：sineベース、低音量・短め
      const o=audioCtx.createOscillator(); const g2=audioCtx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(520,audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(380,audioCtx.currentTime+0.055);
      g2.gain.setValueAtTime(0.055,audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.07);
      o.connect(g2); g2.connect(sfxGain);
      o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime+0.08);
      break;
    }
    case 'buy': {
      // Coin purchase jingle: ascending 3-note
      [[440,0],[550,0.07],[880,0.14]].forEach(([freq,t])=>{
        const o=audioCtx.createOscillator(); const g2=audioCtx.createGain();
        o.type='triangle'; o.frequency.value=freq;
        g2.gain.setValueAtTime(0.15,audioCtx.currentTime+t);
        g2.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+t+0.12);
        o.connect(g2); g2.connect(sfxGain);
        o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.14);
      });
      break;
    }
    case 'deny': {
      // Can't afford: low buzz
      const o=audioCtx.createOscillator(); const g2=audioCtx.createGain();
      o.type='sawtooth'; o.frequency.value=120;
      g2.gain.setValueAtTime(0.1,audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.15);
      o.connect(g2); g2.connect(sfxGain);
      o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime+0.18);
      break;
    }
    case 'tab': {
      // Tab switch: short soft tick
      const o=audioCtx.createOscillator(); const g2=audioCtx.createGain();
      o.type='sine'; o.frequency.value=660;
      g2.gain.setValueAtTime(0.08,audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.05);
      o.connect(g2); g2.connect(sfxGain);
      o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime+0.06);
      break;
    }
  }
}

function playKuroSkillSFX() {
  if (!audioCtx) return;
  ensureAudio();
  // Deep bass drop + rising pitch + explosion
  const times = [[80,0],[60,0.05],[40,0.12],[30,0.22],[20,0.35],[130,0.55],[220,0.65],[330,0.75],[500,0.85],[800,0.95]];
  times.forEach(([freq, t]) => {
    const o = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o.type = t < 0.5 ? 'sawtooth' : 'square';
    o.frequency.value = freq;
    const vol = t < 0.5 ? 0.3 : 0.2;
    g2.gain.setValueAtTime(vol, audioCtx.currentTime + t);
    g2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.18);
    o.connect(g2); g2.connect(sfxGain);
    o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
  });
  // Final blast - low rumble
  const b = audioCtx.createOscillator(); const bg = audioCtx.createGain();
  b.type = 'sawtooth'; b.frequency.value = 55;
  bg.gain.setValueAtTime(0.4, audioCtx.currentTime + 0.9);
  bg.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
  b.connect(bg); bg.connect(sfxGain);
  b.start(audioCtx.currentTime + 0.9); b.stop(audioCtx.currentTime + 1.6);
}

// ===== PER-CHARACTER SKILL VOICE SFX =====
function playCharSkillSFX(charId) {
  if (!audioCtx) return;
  ensureAudio();
  const patterns = {
    shiro: [[440,0],[550,0.06],[660,0.12],[880,0.2],[1100,0.28]], // bright high sparkle
    kutsushita: [[110,0],[150,0.05],[200,0.12],[110,0.2],[80,0.3]], // heavy defensive
    tora: [[200,0],[350,0.04],[600,0.08],[900,0.12],[600,0.18],[900,0.24]], // rapid fire
    mike: [[300,0],[450,0.05],[600,0.1],[750,0.15],[900,0.2],[600,0.25],[450,0.3]], // triple
    kuro: null, // handled by playKuroSkillSFX
  };
  const pat = patterns[charId];
  if (!pat) return;
  pat.forEach(([freq, t]) => {
    const o = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o.type = charId === 'kutsushita' ? 'sawtooth' : charId === 'tora' ? 'square' : 'triangle';
    o.frequency.value = freq;
    g2.gain.setValueAtTime(0.2, audioCtx.currentTime + t);
    g2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.15);
    o.connect(g2); g2.connect(sfxGain);
    o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.18);
  });
  // Voice-like formant for each char (brief vowel shape)
  const o2 = audioCtx.createOscillator(); const g3 = audioCtx.createGain();
  const formants = { shiro: 1200, kutsushita: 400, tora: 800, mike: 1000 };
  o2.type = 'sine'; o2.frequency.value = formants[charId] || 800;
  g3.gain.setValueAtTime(0.1, audioCtx.currentTime);
  g3.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
  o2.connect(g3); g3.connect(sfxGain);
  o2.start(); o2.stop(audioCtx.currentTime + 0.32);
}

function drawGuideScreen() {
  const bg2 = ctx.createLinearGradient(0,0,0,H);
  bg2.addColorStop(0,'#05000d'); bg2.addColorStop(1,'#0c001a');
  ctx.fillStyle = bg2; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.fillStyle=`rgba(200,160,255,${0.06+0.05*Math.sin(s.twinkle||0)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  // Header bar
  ctx.fillStyle='rgba(18,4,36,0.97)'; ctx.fillRect(0,0,W,46);
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=14; ctx.shadowColor='#cc44ff';
  ctx.fillStyle='#eeddff'; ctx.font='bold 19px monospace';
  ctx.fillText('📖 各種ガイド', W/2, 23); ctx.restore();
  // Back button
  const bkH=(mousePos.x>=W-122&&mousePos.x<=W-8&&mousePos.y>=8&&mousePos.y<=38);
  ctx.save(); ctx.fillStyle=bkH?'rgba(100,60,140,0.95)':'rgba(50,20,80,0.88)';
  rr(ctx,W-122,8,114,30,15); ctx.fill();
  ctx.strokeStyle=bkH?'#cc88ff':'#664488'; ctx.lineWidth=1.2;
  rr(ctx,W-122,8,114,30,15); ctx.stroke();
  ctx.fillStyle='#ddbbff'; ctx.font='bold 12px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(guideFrom==='paused'?'← ポーズへ':'← タイトルへ', W-65, 23);
  ctx.restore();
  // Tab bar
  const tabs3=[{id:'weapon',label:'⚔️ 武器',color:'#7744ff'},{id:'evolved',label:'🌟 合成',color:'#ffaa00'},{id:'enemy',label:'👾 敵',color:'#ff5577'},{id:'cats',label:'🐱 ネコ',color:'#ff88cc'}];
  const tabBarY=46, tabW3=Math.floor(W/tabs3.length);
  ctx.fillStyle='rgba(10,0,25,0.97)'; ctx.fillRect(0,tabBarY,W,34);
  tabs3.forEach((tab,i)=>{
    const tx=i*tabW3, active=guideState.tab===tab.id;
    if(active){
      const g=ctx.createLinearGradient(tx,tabBarY,tx,tabBarY+34);
      g.addColorStop(0,tab.color+'55'); g.addColorStop(1,tab.color+'22');

function drawStageSelect() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);

    ctx.fillStyle = 'rgba(200,180,255,0.18)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  // Title
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowBlur = 20; ctx.shadowColor = '#ff66cc';
  ctx.fillStyle = '#ffddff'; ctx.font = 'bold 30px monospace';

  const cardW = 210, cardH = 300, gap = 22;
  const totalW = STAGES.length*cardW + (STAGES.length-1)*gap;
  const maxScroll = Math.max(0, totalW - W + 40);
  stageScrollX = Math.max(-maxScroll/2, Math.min(maxScroll/2, stageScrollX));
  const startX = W/2 - totalW/2 + stageScrollX;

  // Scroll arrows if content overflows
  if (totalW > W - 40) {
    ctx.save();
    ctx.fillStyle = 'rgba(100,50,160,0.7)'; ctx.shadowBlur = 8; ctx.shadowColor = '#aa66ff';
    if (stageScrollX < maxScroll/2) {
      rr(ctx, W-46, H/2-24, 36, 48, 18); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('▶', W-28, H/2);
    }
    if (stageScrollX > -maxScroll/2) {
      rr(ctx, 10, H/2-24, 36, 48, 18); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('◀', 28, H/2);
    }
    ctx.restore();
  }

  STAGES.forEach((st, i) => {
    const cx2 = startX + i*(cardW+gap), cy2 = 80;
    const active = i === selectedStage;
    const hover = lastMX >= cx2-4 && lastMX < cx2+cardW+4 && lastMY >= cy2-4 && lastMY < cy2+cardH+4;

    // Hover scale
    if (hover && !active) {
      ctx.save();
      ctx.translate(cx2+cardW/2, cy2+cardH/2);
      ctx.scale(1.04, 1.04);
      ctx.translate(-(cx2+cardW/2), -(cy2+cardH/2));
    }
    // Card shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ctx, cx2+5, cy2+5, cardW, cardH, 16); ctx.fill();
    const cg = ctx.createLinearGradient(cx2,cy2,cx2,cy2+cardH);
    cg.addColorStop(0, active ? '#3a0065' : hover ? '#2a0050' : '#1e0040');
    cg.addColorStop(1, active ? '#220040' : '#120025');
    ctx.fillStyle = cg; rr(ctx,cx2,cy2,cardW,cardH,16); ctx.fill();
    ctx.strokeStyle = active ? '#ffaaff' : hover ? '#cc88ff' : '#664488';
    ctx.lineWidth = active ? 3 : hover ? 2.2 : 1.5;
    if(hover && !active){ ctx.shadowBlur=18; ctx.shadowColor='#aa66ff'; }
    rr(ctx,cx2,cy2,cardW,cardH,16); ctx.stroke();
    ctx.shadowBlur=0;
    if(hover && !active) ctx.restore();

    // Stage thumbnail (mini background preview)
    ctx.save();
    ctx.beginPath(); rr(ctx,cx2+8,cy2+8,cardW-16,100,10); ctx.clip();
    // Draw mini BG
    const bgC = st.bgColors;
    ctx.fillStyle = bgC[0]; ctx.fillRect(cx2+8,cy2+8,cardW-16,100);
    for (let r2=0;r2<4;r2++) for(let c3=0;c3<4;c3++) {
      if((r2+c3)%2===0){ctx.fillStyle=bgC[1]||bgC[0]; ctx.fillRect(cx2+8+c3*((cardW-16)/4),cy2+8+r2*25,(cardW-16)/4,25);}
    }
    if (st.skyGrad) {
      const sg = ctx.createLinearGradient(0,cy2+8,0,cy2+108);
      st.skyGrad.forEach((col,idx)=>sg.addColorStop(idx/(st.skyGrad.length-1),col));
      ctx.globalAlpha = 0.6; ctx.fillStyle = sg; ctx.fillRect(cx2+8,cy2+8,cardW-16,100); ctx.globalAlpha=1;
    }
    // Mini stage icon
    ctx.font = '36px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(st.name.split(' ')[0], cx2+cardW/2, cy2+58);
    ctx.restore();

    // Stage name
    ctx.save(); ctx.shadowBlur = active ? 14 : 0; ctx.shadowColor='#ff88cc';
    ctx.fillStyle = active ? '#ffffff' : '#ccaaff';
    ctx.font = `${active?'bold ':''} 16px monospace`; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(st.name.substring(2), cx2+cardW/2, cy2+118); ctx.restore();

    // Description
    ctx.fillStyle = '#aaaacc'; ctx.font = '12px monospace';
    ctx.textAlign='center'; ctx.textBaseline='top';
    // Word wrap
    // Wrap description to fit card width
    ctx.font = '11px monospace';
    const descWords = st.desc;
    // Break every 11 chars max for the card width
    const descChars = 11;
    const descLines = [];
    let remaining = descWords;
    while (remaining.length > 0) {
      descLines.push(remaining.substring(0, descChars));
      remaining = remaining.substring(descChars);
    }
    descLines.forEach((dl, dli) => ctx.fillText(dl, cx2+cardW/2, cy2+144+dli*16));

    // Enemy type icons (unique per stage, no duplicates)
    const stageEnemyIcons = {
      day:      '🦇🫧👻🧟',
      night:    '🦇👻😈💀',
      grave:    '🧟💀🦇😈',
      hell:     '🔥😈💀🪨',
      snow:     '🐇❄️🐟🌊',
      ocean:    '🫧⚡🦀🦑',
      corridor: '⚔️📚🪞💫',
    };
    ctx.font = '14px serif'; ctx.textAlign='center';
    ctx.fillText(stageEnemyIcons[st.id]||'', cx2+cardW/2, cy2+200);

    // Selected badge
    if (active) {
      ctx.save(); ctx.fillStyle='#ff88cc';
      rr(ctx,cx2+cardW/2-35,cy2+cardH-48,70,24,12); ctx.fill();
      ctx.fillStyle='white'; ctx.font='bold 12px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✓ せんたく中', cx2+cardW/2, cy2+cardH-36); ctx.restore();
    }
  });

  // Buttons row
  const btnX = W/2-185, btnY = H-110;
  // Buttons row: decide + challenge
  // ── Horizontal scrollbar ──
  if (maxScroll > 0) {
    const sbW = Math.min(W-80, 400);
    const sbX = W/2 - sbW/2, sbY = H-140;
    // Track
    ctx.save(); ctx.fillStyle='rgba(60,30,80,0.5)';
    rr(ctx, sbX, sbY, sbW, 8, 4); ctx.fill();
    // Thumb
    const thumbRatio = Math.min(1, (W-40)/totalW);
    const thumbW = Math.max(30, sbW*thumbRatio);
    const scrollPct = (stageScrollX + maxScroll/2) / maxScroll;
    const thumbX = sbX + (sbW-thumbW)*Math.max(0,Math.min(1,scrollPct));
    ctx.fillStyle='#aa66ff';
    rr(ctx, thumbX, sbY, thumbW, 8, 4); ctx.fill();
    ctx.restore();
  }

  const btnsY = H-110;
  ctx.save(); ctx.shadowBlur=20; ctx.shadowColor='#ff44aa';
  ctx.fillStyle=`hsl(320,70%,${40+10*Math.sin(titleT*3)}%)`;
  rr(ctx,W/2-190,btnsY,230,44,22); ctx.fill();
  ctx.strokeStyle='#ff88cc'; ctx.lineWidth=2; rr(ctx,W/2-190,btnsY,230,44,22); ctx.stroke();
  ctx.fillStyle='white'; ctx.font='bold 14px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('✨ これでけってい！', W/2-75, btnsY+22); ctx.restore();
  // Challenge mode button (right of decide)
  ctx.save(); ctx.fillStyle='rgba(80,0,0,0.9)';
  rr(ctx, W/2+50, btnsY, 140, 44, 22); ctx.fill();
  ctx.strokeStyle='#ff4444'; ctx.lineWidth=2; rr(ctx,W/2+50,btnsY,140,44,22); ctx.stroke();
  ctx.fillStyle='#ffaaaa'; ctx.font='bold 13px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🌊 無限ウェーブ', W/2+120, btnsY+22); ctx.restore();
  // Back to char select button
  ctx.save(); ctx.fillStyle='rgba(80,40,100,0.85)';
  rr(ctx, W/2-80, H-58, 160, 28, 14); ctx.fill();
  ctx.strokeStyle='#884499'; ctx.lineWidth=1.2; rr(ctx, W/2-80, H-58, 160, 28, 14); ctx.stroke();
  ctx.fillStyle='#ccaadd'; ctx.font='13px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('← キャラせんたくへ', W/2, H-44); ctx.restore();
}

// ===== WEAPON EVOLUTION CHECK =====
function checkEvolutions() {
  const results = [];
  for (const evo of WEAPON_EVOLUTIONS) {
    const w1 = activeWeapons.find(w => w.type === evo.needs[0] && w.level >= 5);
    const w2 = activeWeapons.find(w => w.type === evo.needs[1] && w.level >= 5);
    if (w1 && w2 && !activeWeapons.find(w => w.type === evo.result)) {
      results.push({
        id: 'evo_' + evo.result,
        name: '⚗️ 武器進化: ' + evo.name,
        icon: evo.icon,
        desc: `${WEAPON_NAMES[evo.needs[0]]}+${WEAPON_NAMES[evo.needs[1]]} が合体！`,
        apply: (p, gameCtx) => {
          // Remove source weapons
          evolvedFrom.add(evo.needs[0]);
          evolvedFrom.add(evo.needs[1]);
          const idx1 = activeWeapons.findIndex(w=>w.type===evo.needs[0]);
          const idx2 = activeWeapons.findIndex(w=>w.type===evo.needs[1]);
          if (idx1>=0) activeWeapons.splice(idx1,1);
          const idx2b = activeWeapons.findIndex(w=>w.type===evo.needs[1]);
          if (idx2b>=0) activeWeapons.splice(idx2b,1);
          gameCtx.addWeapon(evo.result);
          fxList.push({type:'text',x:p.x,y:p.y-60,text:'⚗️ 武器進化！'+evo.name,life:2.5,color:'#ffcc00',vy:-30,big:true});
        }
      });
    }
  }
  return results;
}

// Evolved weapon update functions
function updateHolyOrbit(w, dt, dm, rng, cnt) {
  w.angle += (2.2 + w.level*0.3)*dt;
  const r = (85+w.level*10)*rng;
  const balls = 4+w.level+cnt;
  const size = 16+w.level*2;
  for (let i=0;i<balls;i++){
    const a = w.angle+(i/balls)*Math.PI*2;
    const bx = player.x+Math.cos(a)*r, by=player.y+Math.sin(a)*r;
    for (const e of enemies){
      if(dist(bx,by,e.x,e.y)<size+e.r){
        if(e.takeDmg((13+w.level*3)*dm,0.1,bx,by)){
          fxList.push({type:'pop',x:e.x,y:e.y,r:15,life:0.3,color:'#ffee44'});
        }
      }
    }
  }
}

function updateFrostLightning(w, dt, dm, rm) {
  const cd = Math.max(0.25,(0.9-w.level*0.1)*rm);
  if(w.timer<=0){
    w.timer=cd;
    const first=nearestEnemy(player.x,player.y,380);
    if(!first)return;
    const chains=6+w.level*2;
    const targets=[first];
    for(let i=1;i<chains;i++){
      const last=targets[targets.length-1];
      let best=null,bd=200;
      for(const e of enemies){if(targets.includes(e))continue;const d2=dist(last.x,last.y,e.x,e.y);if(d2<bd){bd=d2;best=e;}}
      if(!best)break; targets.push(best);
    }
    for(const t of targets){t.takeDmg((20+w.level*3)*dm,0.1,t.x-1,t.y); t.slowTimer=(t.slowTimer||0)+2.5;}
    fxList.push({type:'lightning',targets:targets.map(t=>({x:t.x,y:t.y})),life:0.4,ox:player.x,oy:player.y,iceColor:true});
  }
}

function updateFireTornado(w, dt, dm, rm, rng) {
  const cd=Math.max(1.0,(3.0-w.level*0.4)*rm);
  if(w.timer<=0){
    w.timer=cd;
    const count=2+Math.floor(w.level/2);
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2;
      tornados.push({
        x:player.x+Math.cos(a)*80,y:player.y+Math.sin(a)*80,
        vx:Math.cos(a+Math.PI/2)*80,vy:Math.sin(a+Math.PI/2)*80,
        r:(70+w.level*15)*rng,dmg:(19+w.level*3)*dm,
        life:5.5+w.level*0.5,tickTimer:0,angle:0,fire:true
      });
    }
  }
}

function updateMegaPaw(w, dt, dm, rm, rng, cnt) {
  const cd=Math.max(0.6,(2.2-w.level*0.25)*rm);
  if(w.timer<=0){
    w.timer=cd;
    const target=nearestEnemy(player.x,player.y,380*rng);
    // Aim toward nearest, else move direction, else facing
    let a0;
    if (target) { a0 = Math.atan2(target.y - player.y, target.x - player.x); }
    else if (player.moveAngle !== undefined) { a0 = player.moveAngle; }
    else { a0 = player.facing > 0 ? 0 : Math.PI; }
    const count=2+cnt+Math.floor(w.level/2);
    for(let b=0;b<count;b++){
      const a=a0+(b-(count-1)/2)*0.3;
      projs.push({
        x:player.x,y:player.y,startX:player.x,startY:player.y,
        vx:Math.cos(a)*300,vy:Math.sin(a)*300,
        dmg:(33+w.level*5)*dm,size:20+w.level*4,
        maxDist:(320+w.level*50)*rng,life:12,maxLife:12,
        pierce:99,type:'megapaw',hitSet:new Set(),hitSetReturn:new Set(),returning:false
      });
    }
    // (handled inside updateMegaPaw's own fxList push)
  }
}

const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = 800, H = 600;
C.width = W; C.height = H;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  C.style.width = W * s + 'px';
  C.style.height = H * s + 'px';
  // スマホでは余白なしで表示
  if (innerWidth < 640) {
    const sw = innerWidth / W, sh = innerHeight / H;
    const scale = Math.min(sw, sh);
    C.style.width  = W * scale + 'px';
    C.style.height = H * scale + 'px';
  }
}
addEventListener('resize', resize); resize();

function cx(e) {
  const r = C.getBoundingClientRect();
  return (e.clientX - r.left) * W / r.width;
}
function cy(e) {
  const r = C.getBoundingClientRect();
  return (e.clientY - r.top) * H / r.height;
}

// ズーム変換されたゲーム座標（playing時はHUD座標はそのままでOK）
// HUDはzoom外なので通常のcx/cyをそのまま使う

// ===== INPUT =====
const K = {};
let clickPos = null;
let mousePos = { x: 0, y: 0 };
let touch = { down: false, startX: 0, startY: 0, curX: 0, curY: 0 };

addEventListener('keydown', e => { K[e.code] = K[e.key] = 1; onKeyDown(e.code || e.key); });
addEventListener('keyup',   e => { K[e.code] = K[e.key] = 0; });
C.addEventListener('wheel', e => {
  if (state === 'playing' || state === 'paused') {
    // 回廊はズーム無効
    const stg = STAGES[selectedStage] || STAGES[0];
    if (stg && stg.isCorridor) { e.preventDefault(); return; }
    const zoomDelta = e.deltaY > 0 ? -0.06 : 0.06;
    cam.zoom = Math.max(0.4, Math.min(2.5, (cam.zoom || 1.0) + zoomDelta));
    e.preventDefault();
  } else if (state === 'stageselect') {
    stageScrollX += e.deltaY * 0.4;
    e.preventDefault();
  } else if (state === 'shop') {
    shopView.scroll = Math.max(0, Math.min(shopView.maxScroll||0, shopView.scroll + e.deltaY * 0.5));
    e.preventDefault();
  } else if (state === 'guide') {
    guideState.scroll = Math.max(0, Math.min(guideState.maxScroll, guideState.scroll + e.deltaY * 0.5));
  } else if (state === 'bossTrialSelect') {
    if (bossTrialState==='weaponSelect') bossTrialScrollWpn = Math.max(0, bossTrialScrollWpn + e.deltaY * 0.5);
    else bossTrialScrollBoss = Math.max(0, bossTrialScrollBoss + e.deltaY * 0.5);
  } else if (state === 'achievements') {
    achScroll = Math.max(0, Math.min(achMaxScroll, achScroll + e.deltaY * 0.5));
  } else if (state === 'howtoplay') {
    howtoScroll = Math.max(0, Math.min(howtoMaxScroll, howtoScroll + e.deltaY * 0.5));
    e.preventDefault();
  } else if (state === 'updatelog') {
    _logScroll = Math.max(0, Math.min(_logMaxScroll, _logScroll + e.deltaY * 0.5));
    e.preventDefault();
  }
}, { passive: false });
C.addEventListener('mousemove', e => {
  mousePos.x = cx(e); mousePos.y = cy(e);
  lastMX = cx(e); lastMY = cy(e);
  if (state === 'title') updateTitleHover(mousePos.x, mousePos.y);
  if (state === 'settings') handleSettingsPointerMove(cx(e), cy(e));
});
C.addEventListener('mousedown', e => { clickPos = { x: cx(e), y: cy(e) };
  if (state === 'settings') { if (!handleSettingsPointerDown(cx(e), cy(e))) onClick(cx(e), cy(e)); }
  else onClick(cx(e), cy(e));
});
document.addEventListener('mouseup', () => { if (state === 'settings') handleSettingsPointerUp(); });
C.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = C.getBoundingClientRect();
  const t0 = e.touches[0];
  const tx = (t0.clientX - r.left) * W / r.width;
  const ty = (t0.clientY - r.top)  * H / r.height;

  touch.down = true;
  touch.startX = tx; touch.startY = ty;
  touch.curX  = tx; touch.curY  = ty;
  touch._prevX = tx; touch._prevY = ty;
  touch._velX  = 0;  touch._velY  = 0;
  touch._swipeMoved = false;

  if (state === 'title') updateTitleHover(tx, ty);

  // ── スマホ専用：ゲーム中タップ検出 ───────────────────────────────────
  if (state === 'playing') {
    // 管理者バーボタンを最初にチェック
    if (_adminMode && handleAdminBarClick(tx, ty)) return;
    // 必殺技ボタン（左下の円、cx2=46, cy2=H-46, r=41）
    const skillDx = tx - 46, skillDy = ty - (H - 46);
    if (Math.sqrt(skillDx*skillDx + skillDy*skillDy) < 50) {
      activateSkill();
      return; // ジョイスティック操作に干渉させない
    }
    // ポーズボタン（[P]ボタン：右上）
    if (tx >= W - 90 && tx <= W - 4 && ty >= 4 && ty <= 34) {
      togglePause();
      return;
    }
    // レベルアップ・チェスト等は通常onClickで処理
  }

  // 設定スライダードラッグ
  if (state === 'settings') {
    if (!handleSettingsPointerDown(tx, ty)) onClick(tx, ty);
    return;
  }

  onClick(tx, ty);
}, { passive: false });

// タッチ移動：スワイプスクロール（スマホ専用）
C.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = C.getBoundingClientRect();
  const t0 = e.touches[0];
  const nx = (t0.clientX - r.left) * W / r.width;
  const ny = (t0.clientY - r.top)  * H / r.height;
  const dx = nx - touch.curX, dy = ny - touch.curY;

  // スワイプ量が一定以上なら移動判定
  if (Math.abs(nx - touch.startX) > 8 || Math.abs(ny - touch.startY) > 8) {
    touch._swipeMoved = true;
  }

  touch._velX = nx - touch._prevX;
  touch._velY = ny - touch._prevY;
  touch._prevX = touch.curX;
  touch._prevY = touch.curY;
  touch.curX = nx; touch.curY = ny;

  // ── スマホ専用スワイプスクロール ────────────────────────────────────
  if (touch._swipeMoved) {
    if (state === 'guide')        { guideState.scroll    = Math.max(0, Math.min(guideState.maxScroll,   guideState.scroll    - dy)); }
    if (state === 'shop')         { shopView.scroll       = Math.max(0, Math.min(shopView.maxScroll||0,  shopView.scroll      - dy)); }
    if (state === 'achievements') { achScroll             = Math.max(0, Math.min(achMaxScroll,           achScroll            - dy)); }
    if (state === 'howtoplay')    { howtoScroll           = Math.max(0, Math.min(howtoMaxScroll,         howtoScroll          - dy)); }
    if (state === 'updatelog')    { _logScroll            = Math.max(0, Math.min(_logMaxScroll,          _logScroll           - dy)); }
    if (state === 'stageselect')  { stageScrollX         += dx; }
    if (state === 'bossTrialSelect') {
      if (bossTrialState==='weaponSelect') bossTrialScrollWpn = Math.max(0, bossTrialScrollWpn - dy);
      else bossTrialScrollBoss = Math.max(0, bossTrialScrollBoss - dy);
    }
  }

  if (state === 'settings') handleSettingsPointerMove(nx, ny);
}, { passive: false });

C.addEventListener('touchend', e => {
  e.preventDefault();
  touch.down = false;
  if (state === 'settings') handleSettingsPointerUp();
  touch._swipeMoved = false;
}, { passive: false });

function removeBlackBg(img, threshold) {
  // Draw to offscreen canvas and remove pure-black pixels
  const oc = document.createElement('canvas');
  oc.width = img.naturalWidth; oc.height = img.naturalHeight;
  const ox = oc.getContext('2d');
  ox.drawImage(img, 0, 0);
  const data = ox.getImageData(0, 0, oc.width, oc.height);
  const d = data.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];
    // Make pure black (all channels below threshold) fully transparent
    if (r < threshold && g < threshold && b < threshold) {
      d[i+3] = 0;
    }
  }
  ox.putImageData(data, 0, 0);
  // Convert processed canvas to a new Image
  const processed = new Image();
  processed.src = oc.toDataURL('image/png');
  return processed;
}

for (const [k, v] of Object.entries(IMG_B64)) {
  const raw = new Image();
  raw.onload = () => {
    // threshold=16: removes pure black only, keeps dark cat body colors (R>=16)
    const processed = removeBlackBg(raw, 16);
    imgs[k] = processed;
    // Wait for processed image to finish loading, then increment counter
    const checkDone = () => { imgsLoaded++; };
    if (processed.complete && processed.naturalWidth > 0) {
      checkDone();
    } else {
      processed.onload = checkDone;
      processed.onerror = checkDone; // still count on error
    }
  };
  raw.src = v;
}

// ===== MATH UTILS =====
function dist(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  return Math.sqrt(dx * dx + dy * dy);
}
function angle(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function randRange(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }

// ===== DRAW UTILS =====
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

}

// Usage: uiBtn(x, y, w, h, label, { fill, stroke, textColor, radius, font, icon, glow })
// Returns true if mouse is hovering (for click detection)
function uiBtn(x, y, w, h, label, opts = {}) {
  const isH = lastMX >= x && lastMX <= x+w && lastMY >= y && lastMY <= y+h;
  const rad  = opts.radius ?? 18;
  const fill  = opts.fill   ?? 'rgba(30,15,55,0.92)';
  const stroke = opts.stroke ?? '#7744aa';
  const tColor = opts.textColor ?? '#ccaadd';
  const fnt   = opts.font   ?? 'bold 13px monospace';
  const glow  = opts.glow   ?? stroke;

  ctx.save();
  // Hover: slight scale + brightness
  if (isH) {
    ctx.translate(x + w/2, y + h/2);
    ctx.scale(1.04, 1.04);
    ctx.translate(-(x + w/2), -(y + h/2));
    ctx.shadowBlur = 18; ctx.shadowColor = glow;
  }
  // Fill
  ctx.fillStyle = isH
    ? (opts.fillHover ?? fill.replace(/[\d.]+\)$/, m => Math.min(1, parseFloat(m)+0.12)+')'))
    : fill;
  rr(ctx, x, y, w, h, rad); ctx.fill();
  // Stroke
  ctx.strokeStyle = isH ? '#ffffff' : stroke;
  ctx.lineWidth = isH ? 2.2 : 1.6;
  rr(ctx, x, y, w, h, rad); ctx.stroke();
  ctx.shadowBlur = 0;
  // Label
  ctx.fillStyle = isH ? '#ffffff' : tColor;
  ctx.font = (isH ? 'bold ' : '') + fnt.replace(/^bold /, '');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w/2, y + h/2);
  ctx.restore();
  return isH;
}

function gemTypeForEnemy(e) {
  if (e.boss)       return 'gold';
  // Gem enemies have fixed drop type
  const _def = getEnemyDef(e.type);
  if (_def && _def.gemDrop) return _def.gemDrop;
  if (e.type === 'icetroll') return 'medium'; // blue gem
  if (e.type === 'demon')    return Math.random() < 0.7 ? 'large' : 'medium';
  if (e.type === 'skeleton') return Math.random() < 0.6 ? 'large' : 'medium';
  if (e.type === 'zombie')   return Math.random() < 0.5 ? 'medium' : (Math.random() < 0.1 ? 'large' : 'small');
  if (e.type === 'ghost')    return Math.random() < 0.6 ? 'medium' : 'small';
  if (Math.random() < 0.04)  return 'heart'; // rare heart drop from any
  return 'small'; // bat, slime
}

function getEnemyDef(type) {
  return ENEMY_DEFS[type] || HELL_ENEMY_DEFS[type] || ENEMY_DEFS.bat;
}

function createEnemy(type, x, y, wave) {
  const d = getEnemyDef(type);
  const diffMod = DIFFICULTIES[difficultyLevel] || DIFFICULTIES[1];
  const min = gameTime / 60;
  const _dm2 = DIFFICULTIES[difficultyLevel] || DIFFICULTIES[1];
  const hp = (d.baseHp + d.hpPerMin * min * (wave ? 1.5 : 1)) * _dm2.hpMod;
  return {
    x, y, type,
    r: d.r, maxHp: hp, hp,
    spd: d.spd + min * 0.04, exp: d.exp,
    color: d.color, dmg: Math.round(d.dmg * _dm2.atkMod * 1.6),
    invincible: 0, flashLife: 0,
    knockX: 0, knockY: 0, boss: false,
    slowTimer: 0,
    takeDmg(amount, iframes, fromX, fromY) {
      if (this.invincible > 0) return false;
      this.hp -= amount;
      this.invincible = iframes || 0;
      this.flashLife = 0.12;
      if (fromX !== undefined) {
        const dx = this.x - fromX, dy = this.y - fromY;
        const d2 = Math.sqrt(dx * dx + dy * dy) || 1;
        // No knockback for bosses (too powerful to flinch)
        if (!this.boss) {
          this.knockX = (dx / d2) * 80;
          this.knockY = (dy / d2) * 80;
        }
      }
      return true;
    }
  };
}

// ===== SPAWN SYSTEM =====
function isBossOnField(){return enemies.some(e=>e.boss);}
// ぷりん殿下 is a "small boss" — only suppress waves for mid-boss / final boss
function isMajorBossOnField(){return enemies.some(e=>e.boss && (e.isFinalBoss || e.isMidBoss || e.type==='ironbull' || e.type==='ironpig' || (e.boss && e.type!=='boss' && e.type!=='hellboss')));}
function spawnSummon(type,x,y){const d=getEnemyDef(type);if(!d)return null;const diff=DIFFICULTIES[difficultyLevel]||DIFFICULTIES[1],min=Math.min(gameTime/60,10),hp=(d.baseHp+d.hpPerMin*min)*diff.hpMod;return{x,y,type,r:d.r,maxHp:hp,hp,spd:d.spd+min*0.02,exp:0,color:d.color,dmg:Math.round(d.dmg*diff.atkMod),invincible:0,flashLife:0,knockX:0,knockY:0,boss:false,slowTimer:0,takeDmg(amount,iframes,fromX,fromY){if(this.invincible>0)return false;this.hp-=amount;this.invincible=iframes||0;this.flashLife=0.08;if(fromX!==undefined){const dx=this.x-fromX,dy=this.y-fromY,d2=Math.sqrt(dx*dx+dy*dy)||1;this.knockX=(dx/d2)*40;this.knockY=(dy/d2)*40;}return true;}};}

function updateSpawn(dt) {
  const min = gameTime / 60;
  // ────────────────────────────────────────
  // ONE-ON-ONE: suppress all regular spawns while a MAJOR boss is on field
  // (ぷりん殿下 is a small boss — regular enemies keep spawning)
  if (isMajorBossOnField()) {
    // Still update timers so waves don't pile up when boss is defeated
    waveSystem.normalTimer = Math.max(waveSystem.normalTimer, 1.5);
    waveSystem.waveTimer = Math.max(waveSystem.waveTimer, 5.0);
    if (waveSystem.announcing > 0) waveSystem.announcing -= dt;
    return; // no spawns
  }
  // ────────────────────────────────────────
  // Normal trickle
  const normalRate = Math.max(0.22, 2.2 - min * 0.45);
  waveSystem.normalTimer -= dt;
  if (waveSystem.normalTimer <= 0) {
    waveSystem.normalTimer = normalRate;
    if (waveSystem.batchRemaining <= 0 && enemies.length < 90) {
      const count = 1 + Math.floor(min * 0.25);
      for (let i = 0; i < count; i++) spawnEnemy(false);
    }
  }

  // Wave countdown
  if (waveSystem.batchRemaining <= 0) {
    waveSystem.waveTimer -= dt;
    if (waveSystem.waveTimer <= 5 && waveSystem.announcing <= 0) {
      waveSystem.announcing = 5;
    }
    if (waveSystem.waveTimer <= 0) {
      waveSystem.waveNumber++;
      const wn = waveSystem.waveNumber;
      waveSystem.batchRemaining = 16 + wn * 7;
      waveSystem.batchTimer = 0;
      waveSystem.waveTimer = Math.max(20, waveSystem.waveCooldown - wn * 2);
      waveSystem.announcing = 0;
      waveSystem.waveFlash = 1.5;
      fxList.push({ type: 'text', x: player.x, y: player.y - 60, text: `⚠️ WAVE ${wn}！`, life: 2.5, color: '#ff4444', vy: -30, big: true });
      playSFX('bossapp');
    }
  } else {
    waveSystem.batchTimer -= dt;
    if (waveSystem.batchTimer <= 0 && enemies.length < 140) {
      waveSystem.batchTimer = 0.1;
      waveSystem.batchRemaining--;
      spawnEnemy(true);
    }
  }

  if (waveSystem.announcing > 0) waveSystem.announcing -= dt;
  if (waveSystem.waveFlash > 0) waveSystem.waveFlash -= dt;
}

// ===== WEAPON FACTORY =====
function createWeapon(type) {
  return { type, level: 1, timer: 0, angle: 0, auraTimer: 0 };
}

// ===== WEAPON UPDATE DISPATCH =====
function updateWeapons(dt) {
  const dm = player.atkMul, rm = player.rateMul;
  // ── 弾数UPの「N発目に2連射」カウンター ──
  // countBuff 1→4発に1回, 2→3発に1回, 3→2発に1回
  const _cntIntervals = [0, 4, 3, 2]; // index=countBuff
  const _cntInterval = _cntIntervals[Math.min(player.countBuff||0, 3)];
  const cnt = 0; // 武器ごとにshotCtrをチェックして+1
  // Clamp rangeMul per-weapon to prevent extreme sizes
  const RNG_CAPS = { orbit:2.0, shield:2.0, rapid:2.2, triple:2.2, aura:2.0, whip:2.0,
    lightning:2.0, garlic:2.0, fireball:2.0, ice:2.2, boomerang:2.2, holywater:1.8,
    tornado:1.8, holyorbit:2.0, frostlightning:2.0, firetornado:2.0, megapaw:2.0, shadowaura:2.0 };
  const rng = Math.min(player.rangeMul, 2.5);
  for (const w of activeWeapons) {
    w.timer -= dt;
    switch (w.type) {
      case 'orbit':     updateOrbit(w, dt, dm, rng, cnt); break;
      case 'shield':    updateShield(w, dt, dm, rng, cnt); break;
      case 'rapid':     updateRapid(w, dt, dm, rm, rng, cnt); break;
      case 'triple':    updateTriple(w, dt, dm, rm, rng, cnt); break;
      case 'aura':      updateAura(w, dt, dm, rng, rm); break;
      case 'shadowaura': updateShadowAura(w, dt, dm, rm, rng, cnt); break;
      case 'whip':      updateWhip(w, dt, dm, rm, rng, cnt); break;
      case 'lightning': updateLightning(w, dt, dm, rm); break;
      case 'garlic':    updateGarlic(w, dt, dm, rng); break;
      case 'fireball':  updateFireball(w, dt, dm, rm, rng, cnt); break;
      case 'ice':       updateIce(w, dt, dm, rm, rng, cnt); break;
      case 'boomerang': updateBoomerang(w, dt, dm, rm, rng, cnt); break;
      case 'holywater': updateHolyWater(w, dt, dm, rm, rng); break;
      case 'tornado':   updateTornado(w, dt, dm, rm, rng); break;
      case 'holyorbit':     updateHolyOrbit(w, dt, dm, rng, cnt); break;
      case 'frostlightning':updateFrostLightning(w, dt, dm, rm); break;
      case 'firetornado':   updateFireTornado(w, dt, dm, rm, rng); break;
      case 'megapaw':       updateMegaPaw(w, dt, dm, rm, rng, cnt); break;
    }
  }
}

// ---- ORBIT ----
function updateOrbit(w, dt, dm, rng, cnt) {
  w.angle += (2.5 + w.level * 0.4) * dt;
  const r = (65 + w.level * 8) * rng;
  // Lv1:2球 Lv2:3球 Lv3:4球 Lv4:6球 Lv5:8球（説明文通り）
  const baseBalls = w.level <= 2 ? 2 + (w.level - 1)
                  : w.level === 3 ? 4
                  : w.level === 4 ? 6 : 8;
  const balls = baseBalls + cnt;
  const size = 10 + w.level * 1.5;
  w._tick = ((w._tick || 0) + 1) % 2;
  if (w._tick !== 0) return;
  const dmg2 = (5 + w.level * 1.5) * dm * 2;
  for (let i = 0; i < balls; i++) {
    const a = w.angle + (i / balls) * Math.PI * 2;
    const bx = player.x + Math.cos(a) * r, by = player.y + Math.sin(a) * r;
    for (const e of enemies) {
      if (dist(bx, by, e.x, e.y) < size + e.r) {
        e.takeDmg(dmg2, 0.1, bx, by);
      }
    }
  }
}

// ---- SHIELD ----
function updateShield(w, dt, dm, rng, cnt) {
  w.angle += (1.6 + w.level * 0.25) * dt;
  const r = (50 + w.level * 10) * rng;
  // Lv1:3枚 Lv2:4枚 Lv3:5枚 Lv4:7枚 Lv5:9枚（説明文通り）
  const baseShields = w.level <= 2 ? 3 + (w.level - 1)
                    : w.level === 3 ? 5
                    : w.level === 4 ? 7 : 9;
  const shields = baseShields + cnt;
  const size = 14 + w.level * 2;
  for (let i = 0; i < shields; i++) {
    const a = w.angle + (i / shields) * Math.PI * 2;
    const bx = player.x + Math.cos(a) * r, by = player.y + Math.sin(a) * r;
    for (const e of enemies) {
      if (dist(bx, by, e.x, e.y) < size + e.r) {
        e.takeDmg((9 + w.level * 2.5) * dm, 0.15, bx, by);
      }
    }
  }
}

// ---- RAPID FIRE ----
function updateRapid(w, dt, dm, rm, rng, cnt) {
  const cd = Math.max(0.09, (0.30 - w.level * 0.03) * rm);
  if (w.timer <= 0) {
    w.timer = cd;
    const target = nearestEnemy(player.x, player.y, 360 * rng);
    if (!target) return;
    const a0 = angle(player.x, player.y, target.x, target.y);
    // N発目かどうか判定（countBuff≥1のとき）
    if (player.countBuff > 0) {
      player._shotCtr = ((player._shotCtr || 0) + 1) % _cntInterval;
    }
    const isFourth = player.countBuff > 0 && player._shotCtr === 0;
    const bullets = isFourth ? 2 : 1;
    for (let b = 0; b < bullets; b++) {
      const a = a0 + (b - (bullets - 1) / 2) * 0.15;
      spawnProj(player.x, player.y, Math.cos(a) * 500, Math.sin(a) * 500,
        (6 + w.level * 1.5) * dm, 6, 1.3 * rng, player.pierce, 'rapid');
    }
  }
}

// ---- TRIPLE SHOT ----
function updateTriple(w, dt, dm, rm, rng, cnt) {
  const cd = Math.max(0.2, (0.65 - w.level * 0.05) * rm);
  if (w.timer <= 0) {
    w.timer = cd;
    const target = nearestEnemy(player.x, player.y, 400 * rng);
    const a0 = target ? angle(player.x, player.y, target.x, target.y) : 0;
    // N発目ダブル（countBuff使用時はRapidと共有カウンター）
    const isFourth = player.countBuff > 0 && (player._shotCtr || 0) === 0;
    const bullets = 3 + (isFourth ? 1 : 0);
    for (let b = 0; b < bullets; b++) {
      const a = a0 + (b - (bullets - 1) / 2) * 0.38;
      spawnProj(player.x, player.y, Math.cos(a) * 380, Math.sin(a) * 380,
        (7 + w.level) * dm, 7, 1.6 * rng, player.pierce, 'triple');
    }
  }
}

// ---- AURA ----
function updateAura(w, dt, dm, rng, rm) {
  w.auraTimer -= dt;
  const cd = Math.max(0.3, (1.8 - w.level * 0.2) * rm);
  const range = (100 + w.level * 20) * rng;
  player._auraBaseR = range; // track for shadowaura to inherit
  if (w.auraTimer <= 0) {
    w.auraTimer = cd;
    for (const e of enemies) {
      if (dist(player.x, player.y, e.x, e.y) < range + e.r)
        e.takeDmg((12 + w.level * 3) * dm, 0.05, player.x, player.y);
    }
    fxList.push({ type: 'ring', x: player.x, y: player.y, r: 0, maxR: range, life: 0.6, color: '#8844ff' });
  }
}

// ---- WHIP ----
// ─── Shadow Aura (aura + garlic evolved) ───
function updateShadowAura(w, dt, dm, rm, rng, cnt) {
  const baseR = Math.max(90, (player._auraBaseR || 80)) + w.level * 18;
  const r = baseR * rng;
  // オーラダメージ大幅強化（旧: 18+lv*4 → 新: 38+lv*10）
  const dmgPerSec = (38 + w.level * 10) * dm;
  for (const e of enemies) {
    if (e.invincible > 0) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    if (Math.sqrt(dx*dx+dy*dy) <= r + e.r) {
      // ダメージ倍率0.7→1.0に変更（毎フレームフルダメージ）
      if (e.takeDmg(dmgPerSec * dt, 0)) e.slowTimer = (e.slowTimer||0) + dt * 1.2;
    }
  }
  if (!w._abyssTimer) w._abyssTimer = 0;
  w._abyssTimer -= dt;
  if (w._abyssTimer <= 0) {
    w._abyssTimer = Math.max(2.0, 4.5 - w.level * 0.5);
    const holesN = 1 + Math.floor(w.level * 0.4);
    for (let hi = 0; hi < holesN; hi++) {
      const _ha = Math.random() * Math.PI * 2;
      const _hr = 40 + Math.random() * r * 0.85;
      const _hx = player.x + Math.cos(_ha) * _hr;
      const _hy = player.y + Math.sin(_ha) * _hr;
      fxList.push({type:'abyssHole', x:_hx, y:_hy, r:0, maxR:52,
        life:3.5, maxLife:3.5, pullForce:60, dmgPerSec:dmgPerSec*0.5, bid:'shadowaura'});
      fxList.push({type:'ring',x:_hx,y:_hy,r:0,maxR:80,life:0.6,color:'#330055'});
      // ── 触手弾は削除（オーラ吸引のみ） ──
    }
  }
}

function drawShadowAura(w) {
  const baseR = Math.max(90, (player._auraBaseR || 80)) + w.level * 18;
  const r = baseR * player.rangeMul;
  const sx = player.x - cam.x, sy = player.y - cam.y;
  ctx.save();
  const pulse = 1 + 0.06 * Math.sin(gameTime * 4);
  const pulse2 = 1 + 0.10 * Math.sin(gameTime * 2.2 + 1);
  // Outer darkness fog
  const grd = ctx.createRadialGradient(sx,sy,r*0.25,sx,sy,r*pulse*1.05);
  grd.addColorStop(0,'rgba(50,0,100,0)');
  grd.addColorStop(0.45,'rgba(90,0,160,0.15)');
  grd.addColorStop(0.75,'rgba(140,0,200,0.22)');
  grd.addColorStop(1,'rgba(30,0,60,0)');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(sx,sy,r*pulse*1.05,0,Math.PI*2); ctx.fill();
  // Spinning dark rune ring
  ctx.globalAlpha=0.35;
  ctx.strokeStyle='#8800ff'; ctx.lineWidth=2;
  ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.arc(sx,sy,r*0.92*pulse2,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='#5500aa'; ctx.lineWidth=1.5;
  ctx.setLineDash([4,8]);
  ctx.beginPath(); ctx.arc(sx,sy,r*0.72*pulse,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  // Orbiting void orbs
  ctx.globalAlpha=0.75;
  const orbCount = 5 + w.level;
  for(let oi=0;oi<orbCount;oi++){
    const oa=(oi/orbCount)*Math.PI*2+gameTime*1.1*(oi%2===0?1:-0.7);
    const orR=r*(0.5+0.15*Math.sin(gameTime*2.5+oi));
    const ox=sx+Math.cos(oa)*orR, oy=sy+Math.sin(oa)*orR;
    const orbGrd=ctx.createRadialGradient(ox,oy,0,ox,oy,8+w.level);
    orbGrd.addColorStop(0,'rgba(200,150,255,0.95)');
    orbGrd.addColorStop(0.5,'rgba(120,0,220,0.7)');
    orbGrd.addColorStop(1,'rgba(40,0,80,0)');
    ctx.fillStyle=orbGrd;
    ctx.beginPath(); ctx.arc(ox,oy,8+w.level,0,Math.PI*2); ctx.fill();
  }
  // Dark tendrils
  ctx.globalAlpha=0.4;
  for(let ti=0;ti<6;ti++){
    const ta=gameTime*0.8+ti*(Math.PI/3);
    const tLen=r*0.65*(0.8+0.2*Math.sin(gameTime*3+ti));
    const grd2=ctx.createLinearGradient(sx,sy,sx+Math.cos(ta)*tLen,sy+Math.sin(ta)*tLen);
    grd2.addColorStop(0,'rgba(150,0,255,0.7)');
    grd2.addColorStop(0.6,'rgba(80,0,160,0.3)');
    grd2.addColorStop(1,'rgba(30,0,80,0)');
    ctx.strokeStyle=grd2; ctx.lineWidth=3+w.level*0.5;
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.quadraticCurveTo(
      sx+Math.cos(ta+0.4)*tLen*0.5+Math.sin(gameTime*4+ti)*20,
      sy+Math.sin(ta+0.4)*tLen*0.5+Math.cos(gameTime*4+ti)*20,
      sx+Math.cos(ta)*tLen, sy+Math.sin(ta)*tLen);
    ctx.stroke();
  }
  // Abyss holes visual
  ctx.globalAlpha=1;
  for(const f of fxList){
    if(f.type!=='abyssHole'||f.bid!=='shadowaura') continue;
    const hx=f.x-cam.x, hy=f.y-cam.y, hR=f.r||1;
    const hP=1+0.12*Math.sin(gameTime*8);
    const hGrd=ctx.createRadialGradient(hx,hy,0,hx,hy,hR*hP*1.2);
    hGrd.addColorStop(0,'rgba(0,0,0,1)');
    hGrd.addColorStop(0.4,'rgba(40,0,80,0.95)');
    hGrd.addColorStop(0.7,'rgba(100,0,160,0.6)');
    hGrd.addColorStop(1,'rgba(60,0,120,0)');
    ctx.fillStyle=hGrd;
    ctx.beginPath(); ctx.ellipse(hx,hy,hR*hP,hR*hP*0.45,0,0,Math.PI*2); ctx.fill();
    for(let ri=0;ri<3;ri++){
      const rA=gameTime*2.5*(ri%2===0?1:-1)+ri*1.2;
      ctx.globalAlpha=0.45-ri*0.1; ctx.strokeStyle=ri===0?'#cc00ff':'#7700cc'; ctx.lineWidth=2-ri*0.3;
      ctx.save(); ctx.translate(hx,hy); ctx.rotate(rA);
      ctx.beginPath(); ctx.ellipse(0,0,hR*(0.7+ri*0.15),hR*(0.7+ri*0.15)*0.4,0,0,Math.PI*2);
      ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
    }
    for(let sp=0;sp<5;sp++){
      const sa=gameTime*3+sp*(Math.PI*2/5);
      ctx.fillStyle='rgba(180,0,255,0.85)';
      ctx.beginPath(); ctx.arc(hx+Math.cos(sa)*hR,hy+Math.sin(sa)*hR*0.45,3,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function updateWhip(w, dt, dm, rm, rng, cnt) {
  const cd = Math.max(0.3, (0.9 - w.level * 0.08) * rm);
  if (w.timer <= 0) {
    w.timer = cd;
    const rngVal = (120 + w.level * 20) * rng;
    // Aim toward nearest enemy first, then fall back to move direction, then facing
    const nearE = nearestEnemy(player.x, player.y, rngVal * 1.6);
    let atkAngle;
    if (nearE) {
      atkAngle = Math.atan2(nearE.y - player.y, nearE.x - player.x);
    } else if (player.moveAngle !== undefined) {
      atkAngle = player.moveAngle;
    } else {
      atkAngle = player.facing > 0 ? 0 : Math.PI;
    }
    const cosA = Math.cos(atkAngle), sinA = Math.sin(atkAngle);
    const lengthHalf = rngVal;
    const widthHalf  = 65 + w.level * 14;
    for (const e of enemies) {
      const ex = e.x - player.x, ey = e.y - player.y;
      const fwd  = ex * cosA + ey * sinA;
      const side = Math.abs(-ex * sinA + ey * cosA);
      if (fwd > -10 && fwd < lengthHalf && side < widthHalf)
        e.takeDmg((10 + w.level * 2) * dm, 0.2, player.x, player.y);
    }
    fxList.push({ type: 'whip', x: player.x, y: player.y, angle: atkAngle, life: 0.38, rng: rngVal });
  }
}

// ---- LIGHTNING ----
function updateLightning(w, dt, dm, rm) {
  const cd = Math.max(0.3, (1.0 - w.level * 0.1) * rm);
  if (w.timer <= 0) {
    w.timer = cd;
    const first = nearestEnemy(player.x, player.y, 320);
    if (!first) return;
    const chains = 3 + w.level;
    const targets = [first];
    for (let i = 1; i < chains; i++) {
      const last = targets[targets.length - 1];
      let best = null, bd = 160;
      for (const e of enemies) {
        if (targets.includes(e)) continue;
        const d2 = dist(last.x, last.y, e.x, e.y);
        if (d2 < bd) { bd = d2; best = e; }
      }
      if (!best) break;
      targets.push(best);
    }
    for (const t of targets) t.takeDmg((13 + w.level * 3) * dm, 0.1, t.x - 1, t.y);
    fxList.push({ type: 'lightning', targets: targets.map(t => ({ x: t.x, y: t.y })),
      life: 0.3, ox: player.x, oy: player.y });
  }
}

// ---- GARLIC (Catnip Aura) ----
function updateGarlic(w, dt, dm, rng) {
  const range = (80 + w.level * 15) * rng;
  w.auraTimer -= dt;
  if (w.auraTimer <= 0) {
    w.auraTimer = 0.45;
    const rSq = (range + 50) * (range + 50); // pre-check with squared dist
    for (const e of enemies) {
      const ddx = player.x - e.x, ddy = player.y - e.y;
      if (ddx*ddx + ddy*ddy < rSq) {
        if (dist(player.x, player.y, e.x, e.y) < range + e.r) {
          e.takeDmg(2 * dm, 0.05, player.x, player.y);
          // Soft repulsion (weaker than default 80 knockback)
          const gKnock = 22;
          const gDx = e.x - player.x, gDy = e.y - player.y;
          const gD = Math.sqrt(gDx*gDx + gDy*gDy) || 1;
          if (!e.boss) { e.knockX = (gDx/gD) * gKnock;
          e.knockY = (gDy/gD) * gKnock; }
        }
      }
    }
  }
}

  }
}

// ---- HOLY WATER ----
function updateHolyWater(w, dt, dm, rm, rng) {
  const cd = Math.max(1.0, (3.5 - w.level * 0.35) * rm);
  if (w.timer <= 0) {
    w.timer = cd;
    const target = nearestEnemy(player.x, player.y, 400);
