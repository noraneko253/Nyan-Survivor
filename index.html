// ── Wisp fireball model (elder wissp) ──
function drawWispFireball(px, py, size, colorHue) {
  ctx.save();
  ctx.translate(px, py);
  const t2 = gameTime;
  if (colorHue === 'blue') {
    // ── Pale blue FLAME appearance (ghost fire / hitodama) ──────────────────
    // Outer pale glow
    const gr = ctx.createRadialGradient(0,0,0, 0,0,size*1.8);
    gr.addColorStop(0,'rgba(200,235,255,0.9)');
    gr.addColorStop(0.35,'rgba(120,190,255,0.65)');
    gr.addColorStop(0.65,'rgba(80,150,240,0.3)');
    gr.addColorStop(1,'rgba(60,120,200,0)');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(0,0,size*1.8,0,Math.PI*2); ctx.fill();
    // Flame body — elongated teardrop pointing upward
    ctx.shadowBlur=16; ctx.shadowColor='rgba(160,210,255,0.9)';
    const fg=ctx.createLinearGradient(0,size*0.4,0,-size*1.3);
    fg.addColorStop(0,'rgba(180,225,255,0.95)');
    fg.addColorStop(0.4,'rgba(120,185,255,0.85)');
    fg.addColorStop(0.75,'rgba(80,150,240,0.6)');
    fg.addColorStop(1,'rgba(60,130,220,0)');
    ctx.fillStyle=fg;
    ctx.beginPath();
    ctx.moveTo(0,-size*1.25);
    ctx.bezierCurveTo(size*0.55,-size*0.8, size*0.65,size*0.1, 0,size*0.45);
    ctx.bezierCurveTo(-size*0.65,size*0.1, -size*0.55,-size*0.8, 0,-size*1.25);
    ctx.closePath(); ctx.fill();
    // Flickering inner core
    const flicker=0.85+Math.sin(t2*18+px)*0.15;
    ctx.globalAlpha=flicker;
    ctx.fillStyle='rgba(230,245,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(0,-size*0.1, size*0.38, size*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    // Orbiting sparkles
    for(let i=0;i<3;i++){
      const ta=t2*4+i*(Math.PI*2/3);
      const tr=size*0.9;
      ctx.globalAlpha=0.45;
      ctx.fillStyle='rgba(200,235,255,0.9)';
      ctx.beginPath(); ctx.arc(Math.cos(ta)*tr,Math.sin(ta)*tr*0.5-size*0.1,size*0.2,0,Math.PI*2); ctx.fill();
    }
  } else {
    // Green wisp (default)
    const gr2 = ctx.createRadialGradient(0,0,0,0,0,size);
    gr2.addColorStop(0,'rgba(100,230,180,0.9)');
    gr2.addColorStop(0.4,'rgba(50,180,120,0.7)');
    gr2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr2;
    ctx.beginPath(); ctx.arc(0,0,size*1.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#44ffaa';
    ctx.shadowBlur=12; ctx.shadowColor='#22dd88';
    ctx.beginPath(); ctx.arc(0,0,size,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(-size*0.2,-size*0.2,size*0.3,0,Math.PI*2); ctx.fill();
    for(let i=0;i<4;i++){
      const ta=t2*3+i*(Math.PI/2);
      ctx.globalAlpha=0.5; ctx.fillStyle='#88ffcc';
      ctx.beginPath(); ctx.arc(Math.cos(ta)*size*0.8,Math.sin(ta)*size*0.8,size*0.25,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

// ── Snowball model (yeti) ──
function drawSnowball(px, py, size) {
  ctx.save(); ctx.translate(px, py);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0,size*0.9,size*0.8,size*0.25,0,0,Math.PI*2); ctx.fill();
  // Main ball
  const gr = ctx.createRadialGradient(-size*0.3,-size*0.3,0,0,0,size);
  gr.addColorStop(0,'rgba(255,255,255,0.95)');
  gr.addColorStop(0.6,'rgba(220,235,255,0.9)');
  gr.addColorStop(1,'rgba(180,210,240,0.8)');
  ctx.fillStyle=gr;
  ctx.shadowBlur=8; ctx.shadowColor='rgba(180,220,255,0.6)';
  ctx.beginPath(); ctx.arc(0,0,size,0,Math.PI*2); ctx.fill();
  // Snow texture bumps
  for(let i=0;i<6;i++){
    const ba2=(i/6)*Math.PI*2+0.3;
    const br=size*0.5;
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(Math.cos(ba2)*br,Math.sin(ba2)*br,size*0.2,0,Math.PI*2); ctx.fill();
  }
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(-size*0.3,-size*0.35,size*0.28,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── Gold coin model (kraken) ──
function drawGoldCoin(px, py, size, angle) {
  ctx.save(); ctx.translate(px, py); ctx.rotate(angle);
  // Coin body (ellipse to simulate perspective spin)
  const spinW = Math.abs(Math.cos(angle*3+gameTime*8))*size+size*0.1;
  ctx.fillStyle = '#cc9900';
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = size*0.15;
  ctx.shadowBlur = 6; ctx.shadowColor = '#ffaa00';
  ctx.beginPath(); ctx.ellipse(0,0,spinW,size,0,0,Math.PI*2);
  ctx.fill(); ctx.stroke();

  if(spinW > size*0.4) {
    ctx.fillStyle = '#ffee44';
    ctx.font = `bold ${size}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('¥', 0, 0);
  }
  ctx.restore();
}

// ── Rock model (ironbull) ──
function drawRock(px, py, size, angle) {
  ctx.save(); ctx.translate(px, py); ctx.rotate(angle + gameTime*4);
  ctx.fillStyle='#886655'; ctx.strokeStyle='#664433'; ctx.lineWidth=1.5;
  // Irregular rock shape
  ctx.beginPath();
  const pts=[[size,0],[size*0.7,-size*0.8],[0,-size],[size*-0.6,-size*0.7],
             [-size,-size*0.2],[-size*0.8,size*0.6],[0,size],[size*0.5,size*0.8]];
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(const[x2,y2] of pts.slice(1)) ctx.lineTo(x2,y2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Highlights
  ctx.fillStyle='rgba(180,160,130,0.5)';
  ctx.beginPath(); ctx.ellipse(size*0.2,-size*0.3,size*0.25,size*0.18,-0.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── Bubble model (crab general) ──
let floatingBubbles = [];

function spawnBubble(x, y, dmg) {
  floatingBubbles.push({
    x, y,
    vx: (Math.random()-0.5)*60,
    vy: (Math.random()-0.5)*60,
    life: 4+Math.random()*2,
    maxLife: 6,
    size: 18+Math.random()*10,
    wobble: Math.random()*Math.PI*2,
    dmg: dmg,
    hitCooldown: 0,
  });
}

function updateBubbles(dt) {
  for(let i=floatingBubbles.length-1;i>=0;i--){
    const b=floatingBubbles[i];
    b.life-=dt;
    if(b.life<=0){floatingBubbles.splice(i,1);continue;}
    b.wobble+=dt*1.5;
    b.x+=Math.sin(b.wobble)*30*dt + b.vx*dt;
    b.y+=Math.cos(b.wobble*0.7)*20*dt + b.vy*dt;
    b.vx*=0.98; b.vy*=0.98;
    b.hitCooldown=Math.max(0,b.hitCooldown-dt);
    // Damage player
    if(player&&player.invincible<=0&&b.hitCooldown<=0){
      const dx=b.x-player.x,dy=b.y-player.y;
      if(Math.sqrt(dx*dx+dy*dy)<b.size+18){
        player.hp-=b.dmg;player.invincible=0.5;player.flashLife=0.2;
        b.hitCooldown=1.0;
      }
    }
  }
}

// ── Fire pillar model (flameking) ──
function drawFirePillar(px, py, r, h, progress, colorA, colorB) {
  // progress 0→1 (rise up); colorA/colorB override fire colors for tentacle variant
  const isTentacle = !!colorA;
  const sx=px-cam.x, sy=py-cam.y;
  const drawH = h * progress;
  ctx.save();
  // Base glow
  const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,r*1.5);
  if(isTentacle){
    gr.addColorStop(0,'rgba(40,100,180,0.8)');
    gr.addColorStop(0.5,'rgba(20,60,120,0.4)');
    gr.addColorStop(1,'rgba(10,30,80,0)');
  } else {
    gr.addColorStop(0,'rgba(255,120,0,0.8)');
    gr.addColorStop(0.5,'rgba(255,60,0,0.4)');
    gr.addColorStop(1,'rgba(255,0,0,0)');
  }
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.ellipse(sx,sy,r*1.5,r*0.5,0,0,Math.PI*2); ctx.fill();
  // Main pillar
  const pg=ctx.createLinearGradient(sx,sy,sx,sy-drawH);
  if(isTentacle){
    pg.addColorStop(0,'rgba(80,160,220,0.9)');
    pg.addColorStop(0.3,'rgba(30,80,160,0.85)');
    pg.addColorStop(0.7,'rgba(10,40,100,0.7)');
    pg.addColorStop(1,'rgba(5,20,60,0)');
  } else {
    pg.addColorStop(0,'rgba(255,200,0,0.9)');
    pg.addColorStop(0.3,'rgba(255,100,0,0.85)');
    pg.addColorStop(0.7,'rgba(255,50,0,0.7)');
    pg.addColorStop(1,'rgba(200,20,0,0)');
  }
  ctx.fillStyle=pg;
  ctx.shadowBlur=20; ctx.shadowColor=isTentacle?'#224488':'#ff4400';
  ctx.beginPath();
  ctx.moveTo(sx-r*0.8,sy);
  ctx.quadraticCurveTo(sx-r*1.2,sy-drawH*0.5,sx,sy-drawH);
  ctx.quadraticCurveTo(sx+r*1.2,sy-drawH*0.5,sx+r*0.8,sy);
  ctx.closePath(); ctx.fill();
  // Inner bright core
  const ig=ctx.createLinearGradient(sx,sy,sx,sy-drawH*0.8);
  ig.addColorStop(0,isTentacle?'rgba(160,220,255,0.9)':'rgba(255,255,200,0.9)');
  ig.addColorStop(1,isTentacle?'rgba(80,160,220,0)':'rgba(255,200,0,0)');
  ctx.fillStyle=ig;
  ctx.beginPath();
  ctx.moveTo(sx-r*0.3,sy);
  ctx.lineTo(sx,sy-drawH*0.85);
  ctx.lineTo(sx+r*0.3,sy);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

let lavaPools = [];
function spawnLavaPool(wx, wy, radius) {

}
function updateLavaPools(dt) {

function drawLavaPools() {
  for(const lp of lavaPools){
    const sx=lp.x-cam.x,sy=lp.y-cam.y;
    const maxL = lp.maxLife || 5;
    const alpha=(lp.life/maxL)*0.88;
    const pulse=1+0.08*Math.sin(lp.pulse||0);
    ctx.save(); ctx.globalAlpha=alpha;
    if(lp.isCaramel){
      // ── Caramel sauce pool ──────────────────────────────────────────────
      const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,lp.r*pulse*1.1);
      gr.addColorStop(0,'rgba(255,200,50,0.95)');
      gr.addColorStop(0.4,'rgba(200,100,0,0.85)');
      gr.addColorStop(0.8,'rgba(130,50,0,0.5)');
      gr.addColorStop(1,'rgba(80,20,0,0)');

      ctx.beginPath(); ctx.ellipse(sx,sy,lp.r*pulse,lp.r*pulse*0.45,0,0,Math.PI*2); ctx.fill();
      // Syrup drip lines
      ctx.strokeStyle='rgba(180,80,0,0.5)'; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const la=(i/4)*Math.PI*2+(lp.pulse||0)*0.2;
        ctx.beginPath();
        ctx.moveTo(sx+Math.cos(la)*lp.r*0.2,sy+Math.sin(la)*lp.r*0.12);
        ctx.lineTo(sx+Math.cos(la)*lp.r*0.7,sy+Math.sin(la)*lp.r*0.35);
        ctx.stroke();
      }
      // Bubble shimmer
      ctx.fillStyle='rgba(255,220,100,0.55)';
      for(let i=0;i<3;i++){
        const ba=(i/3)*Math.PI*2+(lp.pulse||0)*0.5;
        ctx.beginPath(); ctx.arc(sx+Math.cos(ba)*lp.r*0.4,sy+Math.sin(ba)*lp.r*0.22,4,0,Math.PI*2); ctx.fill();
      }
    } else {
      // ── Original lava pool ──────────────────────────────────────────────
      const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,lp.r*pulse*1.2);
      gr.addColorStop(0,'rgba(255,200,0,0.9)');
      gr.addColorStop(0.4,'rgba(255,100,0,0.8)');
      gr.addColorStop(0.8,'rgba(200,30,0,0.5)');
      gr.addColorStop(1,'rgba(100,0,0,0)');
      ctx.fillStyle=gr; ctx.shadowBlur=15; ctx.shadowColor='#ff4400';
      ctx.beginPath(); ctx.ellipse(sx,sy,lp.r*pulse,lp.r*pulse*0.5,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(50,0,0,0.6)'; ctx.lineWidth=2;
      for(let i=0;i<5;i++){
        const la=(i/5)*Math.PI*2+(lp.pulse||0)*0.3;
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+Math.cos(la)*lp.r*0.6,sy+Math.sin(la)*lp.r*0.3);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

let tentacles = [];
function spawnTentacle(wx, wy, targetX, targetY, dmg) {
  tentacles.push({x:wx, y:wy, tx:targetX, ty:targetY, progress:0, life:3.5, maxLife:3.5, dmg, hit:false});
}
function updateTentacles(dt) {
  for(let i=tentacles.length-1;i>=0;i--){
    const t2=tentacles[i]; t2.life-=dt;
    t2.progress=Math.min(1, t2.progress+dt*0.35); // slow extension
    if(t2.life<=0){tentacles.splice(i,1);continue;}
    if(!t2.hit&&player&&player.invincible<=0&&t2.progress>0.7){
      const headX=t2.x+(t2.tx-t2.x)*t2.progress;
      const headY=t2.y+(t2.ty-t2.y)*t2.progress;
      const dx=player.x-headX,dy=player.y-headY;
      if(Math.sqrt(dx*dx+dy*dy)<30){t2.hit=true;player.hp-=t2.dmg;player.invincible=0.4;player.flashLife=0.2;}
    }
  }
}
function drawTentacles() {
  for(const t2 of tentacles){
    const sx=t2.x-cam.x,sy=t2.y-cam.y;
    const ex=(t2.x+(t2.tx-t2.x)*t2.progress)-cam.x;
    const ey=(t2.y+(t2.ty-t2.y)*t2.progress)-cam.y;
    const alpha=(t2.life/t2.maxLife)*0.9;
    ctx.save(); ctx.globalAlpha=alpha;
    // Tentacle body (wavy bezier)
    const midX=(sx+ex)/2+(ey-sy)*0.2;
    const midY=(sy+ey)/2+(sx-ex)*0.2;
    ctx.strokeStyle='#225588'; ctx.lineWidth=12; ctx.lineCap='round';
    ctx.shadowBlur=8; ctx.shadowColor='#113366';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(midX,midY,ex,ey); ctx.stroke();
    // Inner lighter stripe
    ctx.strokeStyle='#334488'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(midX,midY,ex,ey); ctx.stroke();
    // Suction cups along tentacle
    const steps=Math.floor(t2.progress*8);
    for(let i=1;i<steps;i++){
      const tt=i/steps;
      const cpx=tt*(tt*ex+(1-tt)*midX)+(1-tt)*(tt*midX+(1-tt)*sx);
      const cpy=tt*(tt*ey+(1-tt)*midY)+(1-tt)*(tt*midY+(1-tt)*sy);
      ctx.fillStyle='rgba(100,150,255,0.6)';
      ctx.beginPath(); ctx.arc(cpx,cpy,4,0,Math.PI*2); ctx.fill();
    }
    // Tip glow
    ctx.fillStyle='rgba(100,180,255,0.8)';
    ctx.shadowBlur=12; ctx.shadowColor='#44aaff';
    ctx.beginPath(); ctx.arc(ex,ey,10,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

let mirrorMageClones = [];
let mirrorMageCloneActive = false;

function spawnMirrorClones(bossE, count) {
  mirrorMageClones = [];

  for(let i=0;i<count;i++){
    const a=(i/count)*Math.PI*2;
    const r=120+Math.random()*80;
    mirrorMageClones.push({
      x:bossE.x+Math.cos(a)*r, y:bossE.y+Math.sin(a)*r,
      vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200,
      hp:60, maxHp:60, alive:true, angle:a, orbitR:r,
      runAngle:Math.random()*Math.PI*2,
      runTimer:0,
    });
  }
}

function updateMirrorClones(dt, bossE) {
  if(!mirrorMageCloneActive) return;
  for(const cl of mirrorMageClones){
    if(!cl.alive) continue;
    // Random roaming movement
    cl.runTimer-=dt;
    if(cl.runTimer<=0){ cl.runTimer=1+Math.random()*1.5; cl.runAngle=Math.random()*Math.PI*2; }
    const spd=150*dt;
    cl.x+=Math.cos(cl.runAngle)*spd;
    cl.y+=Math.sin(cl.runAngle)*spd;
    // Player weapons hit clones
    for(const p of projs){
      if(p.fromBoss||p.hitSet.has(cl)) continue;
      if(Math.sqrt((p.x-cl.x)**2+(p.y-cl.y)**2)<p.size+22){
        cl.hp-=p.dmg; p.hitSet.add(cl);
        fxList.push({type:'ring',x:cl.x,y:cl.y,r:0,maxR:50,life:0.3,color:'#aa88ff'});
        if(cl.hp<=0){cl.alive=false;
          fxList.push({type:'text',x:cl.x,y:cl.y-40,text:'🪞 分身 撃破！',life:1.5,color:'#cc88ff',vy:-18,big:false});}
        break;
      }
    }
  }
  const aliveClones = mirrorMageClones.filter(cl=>cl.alive).length;
  if(aliveClones===0 && mirrorMageClones.length>0) {
    mirrorMageClones=[];
    mirrorMageCloneActive=false;
  }
}

function drawMirrorClones() {
  for(const cl of mirrorMageClones){
    if(!cl.alive) continue;
    const sx=cl.x-cam.x, sy=cl.y-cam.y;
    ctx.save();
    ctx.globalAlpha=0.65+0.1*Math.sin(gameTime*5);
    ctx.shadowBlur=12; ctx.shadowColor='#aa88ff';
    // Draw as a ghost-like version of mirrormage sprite
    const img=stageBossImgs['mirrormage'];
    if(img&&img.complete&&img.naturalWidth>0){
      ctx.filter='hue-rotate(45deg) brightness(0.7) opacity(0.8)';

  }
}

function updateIronbullOverheat(dt) {
  const bull = enemies.find(e=>e.type==='ironbull'&&e.boss);
  if(!bull) { ironbullOverheat=false; return; }
  if(!ironbullOverheat && bull.hp<=bull.maxHp*0.5) {
    ironbullOverheat=true;
    fxList.push({type:'text',x:bull.x,y:bull.y-80,text:'🔥 オーバーヒート！！',life:3,color:'#ff4400',vy:-20,big:true});

    ironbullTrail.push({x:bull.x, y:bull.y, r:30, life:_trLife, maxLife:_trLife});
    // Update trail — hitbox only active in the FIRST 0.6s of each tile's life
    for(let i=ironbullTrail.length-1;i>=0;i--){
      ironbullTrail[i].life -= dt;
      if(ironbullTrail[i].life <= 0){ ironbullTrail.splice(i,1); continue; }
      const _tAge = ironbullTrail[i].maxLife - ironbullTrail[i].life;
      // Damage only while hitbox is "fresh" (first 0.6 seconds)
      if(_tAge < 0.6 && player && player.invincible <= 0){
        const dx=player.x-ironbullTrail[i].x, dy=player.y-ironbullTrail[i].y;
        if(Math.sqrt(dx*dx+dy*dy) < ironbullTrail[i].r+18){

let shadowSnares = [];

function spawnShadowSnares(count, centerX, centerY) {
  shadowSnares = [];
  for(let i=0;i<count;i++){
    const ox=(Math.random()-0.5)*400, oy=(Math.random()-0.5)*400;
    shadowSnares.push({x:centerX+ox, y:centerY+oy, r:60, active:false, timer:0.8, life:5, triggered:false});
  }
}

function updateShadowSnares(dt, bossE) {
  for(let i=shadowSnares.length-1;i>=0;i--){
    const sn=shadowSnares[i];
    sn.timer-=dt; sn.life-=dt;
    if(sn.life<=0){shadowSnares.splice(i,1);continue;}
    if(sn.timer<=0 && !sn.active) sn.active=true;
    if(sn.active && !sn.triggered && player){
      const dx=player.x-sn.x,dy=player.y-sn.y;
      if(Math.sqrt(dx*dx+dy*dy)<sn.r+18){
        sn.triggered=true;
        player._slowDebuff=(player._slowDebuff||0)+0.6;
        fxList.push({type:'text',x:player.x,y:player.y-50,text:'🌀 捕捉！',life:1.5,color:'#334466',vy:-15,big:false});
        // Boss charges at snared player
        if(bossE){
          const ba=Math.atan2(player.y-bossE.y,player.x-bossE.x);
          bossE.knockX=Math.cos(ba)*450; bossE.knockY=Math.sin(ba)*450;
          fxList.push({type:'ring',x:bossE.x,y:bossE.y,r:0,maxR:80,life:0.4,color:'#334466'});
        }
      }
    }
  }
}

function drawShadowSnares() {
  for(const sn of shadowSnares){
    const sx=sn.x-cam.x, sy=sn.y-cam.y;
    const alpha=sn.triggered?0.2:0.7;
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.shadowBlur=8; ctx.shadowColor='#334466';
    if(!sn.active){
      // Telegraph - pulsing ring
      ctx.strokeStyle='rgba(80,80,150,0.5)'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.arc(sx,sy,sn.r,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    } else {
      // Active swirling vortex
      const t2=gameTime;
      for(let i=0;i<3;i++){
        const a=t2*4+i*(Math.PI*2/3);
        ctx.strokeStyle=`rgba(40,40,120,${0.7-i*0.2})`; ctx.lineWidth=3;
        ctx.beginPath();
        for(let j=0;j<20;j++){const jt=j/20,ja=a+jt*Math.PI*4,jr=sn.r*(1-jt);
          const jx=sx+Math.cos(ja)*jr, jy=sy+Math.sin(ja)*jr;
          j===0?ctx.moveTo(jx,jy):ctx.lineTo(jx,jy);}
        ctx.stroke();
      }
      // Dark fill
      ctx.fillStyle='rgba(10,10,50,0.3)';
      ctx.beginPath(); ctx.arc(sx,sy,sn.r*0.6,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

    maouCutin.progress += dt * 0.55;

  }
}

function drawMaouCutin() {
  if (!maouCutin) return;
  const prog = maouCutin.progress;
  let slideX, alpha;
  if (prog < 0.3) { const e = prog/0.3; slideX = lerp(-W-100,0,1-Math.pow(1-e,3)); alpha=e; }
  else if (prog < 3.8) { slideX = 0; alpha = 1; }
  else { const e = Math.min(1,(prog-3.8)/0.7); slideX = lerp(0, W+100, e*e); alpha = Math.max(0,1-e); }
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
  // Dark strip
  ctx.fillStyle = 'rgba(0,0,0,0.82)'; ctx.fillRect(slideX, 8, W, 180);
  // Red glow lines
  ctx.fillStyle = '#ff0000'; ctx.fillRect(slideX, 88-92, W, 6);
  ctx.fillStyle = '#cc0000'; ctx.fillRect(slideX, 88+86, W, 6);
  // Stage final boss sprite in cutin
  const _stgId3 = (STAGES[selectedStage]||STAGES[0]).id;
  const _bossType3 = STAGE_FINAL_BOSS_TYPE[_stgId3] || 'boss';
  const _bossImg3 = stageBossImgs[_bossType3] || newStageImgs[_bossType3] || hellEnemyImgs[_bossType3] || enemyImgs[_bossType3];
  if (_bossImg3 && _bossImg3.complete && _bossImg3.naturalWidth > 0) {
    ctx.save(); ctx.shadowBlur=40; ctx.shadowColor='#ff0000';
    ctx.drawImage(_bossImg3, slideX + W*0.65 - 60, 88-75, 120, 138);
    ctx.restore();
  }
  // Text
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.shadowBlur=20; ctx.shadowColor='#ff0000';
  const _stgBossType2 = (STAGE_FINAL_BOSS_TYPE[(STAGES[selectedStage]||STAGES[0]).id] || 'boss');
  const _bossLore2 = ENEMY_LORE[_stgBossType2];
  const _bossDispName = _bossLore2 ? _bossLore2.name : '👹 ラスボス';
  ctx.fillStyle='#ff3333'; ctx.font='bold 28px "Courier New",monospace';
  ctx.fillText(_bossDispName, slideX+60, 88-32);
  ctx.fillStyle='#ffaaaa'; ctx.font='bold 18px monospace';

  ctx.fillText(`── 第${maouCutin.level}の呪い ──  全敵が強化された！`, slideX+62, 88+32);
  ctx.restore(); ctx.restore();
}

function drawDemonLordBoss(sx, sy, e) {
  const pulse = 1 + 0.1 * Math.sin(gameTime * 3);
  const t3 = gameTime;
  // Massive dark aura
  const grdA = ctx.createRadialGradient(sx, sy, 10, sx, sy, e.r * 3.8 * pulse);
  grdA.addColorStop(0, 'rgba(180,0,255,0.4)');
  grdA.addColorStop(0.4, 'rgba(100,0,200,0.2)');
  grdA.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = 0.85;
  ctx.fillStyle = grdA;
  ctx.beginPath(); ctx.arc(sx, sy, e.r*3.8*pulse, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // Oni body (SVG-drawn)
  const r3 = e.r;
  ctx.save();
  if (e.flashLife > 0) { ctx.shadowBlur = 30; ctx.shadowColor = '#ffffff'; }
  else { ctx.shadowBlur = 25; ctx.shadowColor = '#cc00ff'; }
  // Body
  ctx.fillStyle = '#330022';
  ctx.beginPath(); ctx.ellipse(sx, sy+r3*0.3, r3*0.95, r3*1.1, 0, 0, Math.PI*2); ctx.fill();
  // Head
  ctx.fillStyle = '#1a0011';
  ctx.beginPath(); ctx.ellipse(sx, sy-r3*0.55, r3*0.72, r3*0.7, 0, 0, Math.PI*2); ctx.fill();
  // Left horn
  ctx.fillStyle = '#880000';
  ctx.beginPath();
  ctx.moveTo(sx-r3*0.38, sy-r3*0.9);
  ctx.lineTo(sx-r3*0.6, sy-r3*1.7);
  ctx.lineTo(sx-r3*0.15, sy-r3*0.98);
  ctx.closePath(); ctx.fill();
  // Right horn
  ctx.beginPath();
  ctx.moveTo(sx+r3*0.38, sy-r3*0.9);
  ctx.lineTo(sx+r3*0.6, sy-r3*1.7);
  ctx.lineTo(sx+r3*0.15, sy-r3*0.98);
  ctx.closePath(); ctx.fill();
  // Horn glow
  ctx.strokeStyle='#ff3300'; ctx.lineWidth=2; ctx.shadowColor='#ff0000'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.moveTo(sx-r3*0.38,sy-r3*0.9); ctx.lineTo(sx-r3*0.6,sy-r3*1.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx+r3*0.38,sy-r3*0.9); ctx.lineTo(sx+r3*0.6,sy-r3*1.7); ctx.stroke();
  // Glowing eyes
  ctx.shadowColor='#ff4400'; ctx.shadowBlur=16;
  ctx.fillStyle='#ff3300';
  ctx.beginPath(); ctx.ellipse(sx-r3*0.28,sy-r3*0.6,r3*0.15,r3*0.1,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sx+r3*0.28,sy-r3*0.6,r3*0.15,r3*0.1,0,0,Math.PI*2); ctx.fill();
  // Pupils
  ctx.fillStyle='#ffcc00';
  ctx.beginPath(); ctx.ellipse(sx-r3*0.28,sy-r3*0.6,r3*0.06,r3*0.08,0,0,Math.PI*2); ctx.fill();

  // Mouth / fang
  ctx.strokeStyle='#660000'; ctx.lineWidth=2; ctx.shadowBlur=4;
  ctx.beginPath(); ctx.arc(sx, sy-r3*0.38, r3*0.28, 0.2, Math.PI-0.2); ctx.stroke();
  ctx.fillStyle='#ffffff'; // fangs
  ctx.beginPath(); ctx.moveTo(sx-r3*0.12,sy-r3*0.1); ctx.lineTo(sx-r3*0.18,sy+r3*0.05); ctx.lineTo(sx-r3*0.06,sy-r3*0.1); ctx.closePath(); ctx.fill();

  // Arms
  ctx.strokeStyle='#440033'; ctx.lineWidth=r3*0.22;
  ctx.shadowBlur=8; ctx.shadowColor='#880044';
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(sx-r3*0.85,sy+r3*0.1); ctx.lineTo(sx-r3*1.4,sy+r3*0.8+Math.sin(t3*2)*r3*0.15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx+r3*0.85,sy+r3*0.1); ctx.lineTo(sx+r3*1.4,sy+r3*0.8+Math.sin(t3*2+1)*r3*0.15); ctx.stroke();
  // Crown
  ctx.shadowBlur=18; ctx.shadowColor='#ff4400';
  ctx.font = `${Math.round(r3*0.7)}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👑', sx, sy-r3*1.85+Math.sin(t3*2.5)*4);
  ctx.restore();
  // Name + HP label
  ctx.fillStyle='#ff4466'; ctx.font='bold 13px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=8; ctx.shadowColor='#ff0000';
  ctx.fillText(e.phase2 ? '👹 真魔王' : '👹 魔王', sx, sy - e.r*2.05);

}

let endingT = 0;
let endingScene = 0;
let endingScore = 0;

function startEnding() {
  endingT = 0; endingScene = 0;
  const minutes = String(Math.floor(gameTime/60)).padStart(2,'0');
  const seconds = String(Math.floor(gameTime%60)).padStart(2,'0');
  endingScore = killCount * 100 + Math.floor(gameTime * 10) + (player ? player.level * 500 : 0);
  state = 'ending';
  try { playBGM('title'); } catch(e){}
}

function drawEnding(dt) {
  endingT += dt;
  const sc = endingScene;
  const t2 = endingT;
  // Scene transitions every 4 seconds, 5 scenes total
  if (t2 > 4 && sc < 4) { endingScene++; endingT = 0; return; }
  if (sc >= 5) { state='title'; readyToPlay=false; playBGM('title'); return; }

  // BG gradient per scene
  const bgs = [
    ['#0a0005','#150008'], // red-black (battle aftermath)
    ['#050018','#0a0030'], // dark blue (escape)
    ['#0a2200','#143300'], // green meadow (outside)
    ['#87CEEB','#98FB98'], // sky blue
    ['#0a0020','#000'],    // credits
  ];
  const [bg1,bg2] = bgs[sc] || bgs[0];
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, bg1); grad.addColorStop(1, bg2);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  const fadeIn = Math.min(1, t2 * 2);
  const fadeOut = sc < 4 ? Math.max(0, 1 - (t2 - 3) * 3) : 1;
  const alpha = fadeIn * fadeOut;

  ctx.save(); ctx.globalAlpha = Math.max(0, alpha);

  if (sc === 0) {
    // Scene 1: Victory over demon lord
    if (hellEnemyImgs.hellboss && hellEnemyImgs.hellboss.complete) {
      ctx.save(); ctx.globalAlpha = alpha * 0.4;
      ctx.drawImage(hellEnemyImgs.hellboss, W/2-55, H*0.15, 110, 130);
      // X eyes on defeated boss
      ctx.fillStyle='#ffffff'; ctx.font='bold 36px monospace'; ctx.textAlign='center';
      ctx.fillText('✕', W/2-18, H*0.22+20); ctx.fillText('✕', W/2+18, H*0.22+20);
      ctx.restore();
    }
    ctx.fillStyle='#ffaa44'; ctx.font='bold 30px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=20; ctx.shadowColor='#ffcc00';
    ctx.fillText('👑 魔王を討伐した！', W/2, H*0.6);
    ctx.fillStyle='#ffccaa'; ctx.font='18px monospace';
    ctx.fillText('伝説のネコたちが勝利を収めた！', W/2, H*0.7);

  } else if (sc === 1) {
    // Scene 2: Running toward light
    CHARS.forEach((ch, i) => {
      const bob2 = Math.sin(t2*4+i)*8;
      const runX = W*0.1 + i*W*0.18 + t2*30;
      const runY = H*0.55 + bob2;
      if (imgs[ch.id] && imgs[ch.id].complete) {
        ctx.imageSmoothingEnabled=false;
        ctx.drawImage(imgs[ch.id], runX-24, runY-32, 48, 56);
      }
    });
    // Light portal
    const gLt = ctx.createRadialGradient(W*0.9, H/2, 0, W*0.9, H/2, 180);
    gLt.addColorStop(0,'rgba(255,240,180,0.9)'); gLt.addColorStop(1,'rgba(255,220,100,0)');
    ctx.fillStyle=gLt; ctx.beginPath(); ctx.arc(W*0.9, H/2, 180, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffffcc'; ctx.font='bold 22px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('脱出の光が見える……！', W/2, H*0.8);

  } else if (sc === 2) {
    // Scene 3: Outside in sunny meadow
    const skyG = ctx.createLinearGradient(0,0,0,H);
    skyG.addColorStop(0,'#87CEEB'); skyG.addColorStop(1,'#98FB98');
    ctx.fillStyle=skyG; ctx.fillRect(0,0,W,H);
    // Flowers
    for (let fi=0;fi<20;fi++) {
      ctx.font='16px serif'; ctx.textAlign='center';
      ctx.fillText(fi%2?'🌸':'🌼', (fi*150)%W, H*0.75+(fi*37)%60);
    }
    // Cats celebrating
    CHARS.forEach((ch,i) => {
      const bobC = Math.sin(t2*3+i*1.2)*12;
      const cx2 = 100 + i*140;
      if (imgs[ch.id] && imgs[ch.id].complete) {
        ctx.imageSmoothingEnabled=false;
        ctx.save(); ctx.translate(cx2, H*0.55+bobC);
        ctx.drawImage(imgs[ch.id], -28,-36,56,66);
        ctx.restore();
      }
    });
    ctx.fillStyle='#445500'; ctx.font='bold 22px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=10; ctx.shadowColor='#88ff44';
    ctx.fillText('🌿 草原に帰ってきた！', W/2, H*0.82);

  } else if (sc === 3) {
    // Scene 4: Score
    const scoreStr = endingScore.toLocaleString();
    ctx.fillStyle='#ccddff'; ctx.font='bold 26px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=16; ctx.shadowColor='#4488ff';
    ctx.fillText('✨ クリア！おめでとう！ ✨', W/2, H*0.28);
    const rows = [
      [`⏱ プレイ時間`, `${String(Math.floor(gameTime/60)).padStart(2,'0')}:${String(Math.floor(gameTime%60)).padStart(2,'0')}`],
      [`💀 撃破数`,  `${killCount} 体`],
      [`⭐ レベル`,   `Lv. ${player ? player.level : '?'}`],
      [`💰 コイン`,   `${sessionCoins} 枚`],
      [`🏆 スコア`,   scoreStr],
    ];
    rows.forEach(([label, val], i) => {
      const ry = H*0.42 + i*50;
      ctx.fillStyle='rgba(30,20,60,0.7)'; rr(ctx,W/2-180,ry-16,360,32,8); ctx.fill();
      ctx.fillStyle='#aaaacc'; ctx.font='14px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(label, W/2-165, ry);
      ctx.fillStyle='#ffffff'; ctx.font='bold 16px monospace'; ctx.textAlign='right';
      ctx.fillText(val, W/2+170, ry);
    });
    ctx.fillStyle='#888aaa'; ctx.font='12px monospace'; ctx.textAlign='center';
    ctx.fillText('(タップ/クリックで次へ)', W/2, H*0.92);

  } else if (sc === 4) {
    // Scene 5: Staff roll / credits
    const staffY = H*0.2 - (t2 - 0.5) * 60;
    ctx.fillStyle='#ccaaff'; ctx.font='bold 24px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=10; ctx.shadowColor='#aa66ff';
    ctx.fillText('🐱 ニャンサバイバー 🐱', W/2, staffY);
    ctx.fillStyle='#aa88cc'; ctx.font='16px monospace';
    ctx.fillText('ねこたちの大冒険', W/2, staffY+40);
    ctx.fillText('～魔王討伐伝説～', W/2, staffY+68);
    ctx.fillStyle='#887799'; ctx.font='13px monospace';
    ['制作: ニャンサバ制作委員会', 'BGM: ドット音楽隊', '勇者たちに感謝を…', ''].forEach((l,i) => {
      ctx.fillText(l, W/2, staffY + 130 + i*30);
    });
    CHARS.forEach((ch, i) => {
      const bobF = Math.sin(t2*2+i)*6;
      if (imgs[ch.id] && imgs[ch.id].complete) {
        ctx.imageSmoothingEnabled=false;
        ctx.drawImage(imgs[ch.id], 90+i*130, H*0.7+bobF, 50, 58);
      }
    });
    ctx.fillStyle='#664477'; ctx.font='11px monospace';
    ctx.fillText('また会う日まで…にゃ～ん♪', W/2, H*0.92);
  }
  ctx.restore();

  // Skip hint
  ctx.save(); ctx.globalAlpha=0.45;
  ctx.fillStyle='#554477'; ctx.font='10px monospace'; ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillText('スキップ→クリック', W-10, H-6);
  ctx.restore();
}

// ===== MAIN GAME UPDATE =====
function updateGame(dt) {
  if (state !== 'playing') return;
  gameTime += dt;
  applyAdminEffects();
  updateSpawn(dt);
  updateCorridorForks(dt); // 回廊の分かれ道システム
  checkMaouBuff(dt);
  checkMidBoss();
  updateAchievements(dt);
  checkFinalStageBoss();
  checkStageBossDefeated();
  checkBossTrialDefeated();
  updateBossAttacks(dt);
  updateBeams(dt);updateLightningSword(dt);updateYetiBreath(dt);
  updateBubbles(dt);updateFirePillars(dt);updateLavaPools(dt);updateTentacles(dt);
  updateIronbullOverheat(dt);updateCrabPosHistory(dt);
  const _mmB=enemies.find(e=>e.type==='mastermirror'&&e.boss);if(_mmB)updateMirrorShards(dt,_mmB);
  const _mmageB=enemies.find(e=>e.type==='mirrormage'&&e.boss);if(_mmageB)updateMirrorClones(dt,_mmageB);
  const _swB=enemies.find(e=>e.type==='shadowwolf'&&e.boss);if(_swB)updateShadowSnares(dt,_swB);
  const _sdB=enemies.find(e=>e.type==='snowdragon'&&e.boss);if(_sdB)updateDragonFly(dt,_sdB);
  // Apply blizzard slow debuff
  if (player && player._blizzardTimer > 0) {
    player._blizzardTimer -= dt;
    player._slowDebuff = (player._slowDebuff||0) + 0.015;
  }
  if (player && player._slowDebuff > 0) {
    player._slowDebuff -= dt * 0.5;
    if (player._slowDebuff < 0) player._slowDebuff = 0;
  }
  updateSkill(dt);
  updatePlayer(dt);
  updateWeapons(dt);
  updateSpecialWeapons(dt);
  updateEnemies(dt);
  updateEnemyBullets(dt);
  updateChests(dt);
  updateProjs(dt);
  updateGems(dt);
  updateFX(dt);

  // Boss spawn every 2 minutes
  waveSystem.bossTimer -= dt;
  if (waveSystem.bossTimer <= 0) {
    waveSystem.bossTimer = 240;
    spawnBoss();
    fxList.push({ type: 'text', x: player.x, y: player.y - 70, text: '🍮 ぷりん殿下 出現！', life: 2.5, color: '#ff4444', vy: -25, big: true });
    playSFX('bossapp');
  }

  if (levelUpPending > 0 && state === 'playing') {
    state = 'levelup';
    lvlChoices = pickUpgrades(3);
    levelUpPending--;
  }
}

// ===== MAIN LOOP =====
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  titleT += dt;
  ctx.clearRect(0, 0, W, H);

  switch (state) {
    case 'intro':       updateIntro(dt); drawIntro(); break;
    case 'title':       drawTitle(dt); break;
    case 'stageselect': drawStageSelect(); break;
    case 'difficulty':  drawDifficultyScreen(); break;
    case 'guide':       drawGuideScreen(); break;
    case 'select':      drawSelect();  break;
    case 'playing':     updateGame(dt); if(challengeMode)updateChallenge(dt); drawGame(); break;
    case 'paused':      drawPauseMenu(); break;
    case 'adminPanel':  drawAdminPanel(); break;
    case 'shop':        drawShopScreen(); break;
    case 'levelup':     updateFX(dt); drawLevelUp(); break;
    case 'chest':      updateFX(dt); drawChestScreen(); break;
    case 'blueChest':   updateFX(dt); drawBlueChestScreen(); break;
    case 'updatelog':   drawUpdateLogScreen(); break;
    case 'settings':    drawSettingsScreen(); break;
    case 'doorchoice':  drawDoorChoice(); break;
    case 'doorchoice2': drawDoorChoice2(); break;
    case 'peaceending': updateFX(dt); drawPeaceEnding(dt); break;
    case 'happyending': updateFX(dt); drawHappyEnding(dt); break;
    case 'stageending': updateFX(dt); drawStageEnding(dt); break;
    case 'howtoplay':   drawHowToPlayScreen(); break;
    case 'achievements': drawAchievementsScreen(); break;
    case 'bossTrialSelect':
      if (bossTrialState==='weaponSelect') drawBossTrialWpnSelect();
      else drawBossTrialBossSelect();
      break;
    case 'ending':      updateFX(dt); drawEnding(dt); break;
    case 'gameover':    drawGameOver(); break;
  }
requestAnimationFrame(loop);
}

// ── 設定データ ────────────────────────────────────────────────────────────────
let _settingsBGMVol  = 0.18;  // 0.0 ~ 1.0
let _settingsSFXVol  = 0.35;  // 0.0 ~ 1.0
let _settingsBGMMute = false;
let _settingsSFXMute = false;
let _settingsDragging = null; // 'bgm' | 'sfx' | null

function _applySettingsVolume() {
  try {
    ensureAudio();
    if (bgmGain) bgmGain.gain.value = _settingsBGMMute ? 0 : _settingsBGMVol;
    if (sfxGain) sfxGain.gain.value = _settingsSFXMute ? 0 : _settingsSFXVol;
  } catch(e) {}
}

function saveSettingsData() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    const data = raw ? JSON.parse(raw) : {};
    data.bgmVol  = _settingsBGMVol;
    data.sfxVol  = _settingsSFXVol;
    data.bgmMute = _settingsBGMMute;
    data.sfxMute = _settingsSFXMute;
    data.showFPS   = _settingsShowFPS;
    data.damageNum = _settingsDamageNum;
    data.particle  = _settingsParticle;
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e) {}
}

function loadSettingsData() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.bgmVol  !== undefined) _settingsBGMVol  = data.bgmVol;
    if (data.sfxVol  !== undefined) _settingsSFXVol  = data.sfxVol;
    if (data.bgmMute !== undefined) _settingsBGMMute = data.bgmMute;
    if (data.sfxMute !== undefined) _settingsSFXMute = data.sfxMute;
    if (data.showFPS   !== undefined) _settingsShowFPS   = data.showFPS;
    if (data.damageNum !== undefined) _settingsDamageNum = data.damageNum;
    if (data.particle  !== undefined) _settingsParticle  = data.particle;
    _applySettingsVolume();
  } catch(e) {}
}

// ── 設定スライダー描画ヘルパー ────────────────────────────────────────────
function _drawSlider(label, x, y, sliderW, value, muted, muteLabel) {
  const trackH = 8, knobR = 11;
  const tx = x + sliderW;

  // ラベル
  ctx.fillStyle = '#ccaaff';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);

  // トラック背景
  const gy = y + 24;
  ctx.fillStyle = 'rgba(80,40,120,0.7)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, gy - trackH/2, sliderW, trackH, trackH/2)
                : ctx.rect(x, gy - trackH/2, sliderW, trackH);
  ctx.fill();

  // トラック塗り（mute時はグレー）
  const fillW = value * sliderW;
  ctx.fillStyle = muted ? 'rgba(120,120,120,0.6)' : 'rgba(180,120,255,0.9)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, gy - trackH/2, fillW, trackH, trackH/2)
                : ctx.rect(x, gy - trackH/2, fillW, trackH);
  ctx.fill();

  // ノブ
  const kx = x + fillW;
  const kHov = Math.abs(lastMX - kx) < knobR+4 && Math.abs(lastMY - gy) < knobR+4;
  ctx.shadowBlur = kHov ? 10 : 4;
  ctx.shadowColor = '#aa66ff';
  ctx.fillStyle = muted ? '#888' : (kHov ? '#ffffff' : '#ddbbff');
  ctx.beginPath(); ctx.arc(kx, gy, knobR, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // 値テキスト
  ctx.fillStyle = muted ? '#666' : '#ffeecc';
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(muted ? 'ミュート' : Math.round(value * 100) + '%', x + sliderW + 10, gy);

  // ミュートボタン
  const mbX = x + sliderW + 60, mbY = gy - 12, mbW = 52, mbH = 24;
  const mbHov = lastMX>=mbX&&lastMX<=mbX+mbW&&lastMY>=mbY&&lastMY<=mbY+mbH;
  ctx.fillStyle = muted ? (mbHov?'rgba(255,80,80,0.9)':'rgba(200,60,60,0.8)')
                        : (mbHov?'rgba(80,200,80,0.9)':'rgba(40,140,40,0.7)');
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(mbX, mbY, mbW, mbH, 6) : ctx.rect(mbX, mbY, mbW, mbH);
  ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(muted ? '🔇 OFF' : '🔊 ON', mbX + mbW/2, mbY + mbH/2);

  return { sliderX: x, sliderY: gy, sliderW, trackH, knobR, muteX: mbX, muteY: mbY, muteW: mbW, muteH: mbH };
}

function _showAdminPWDialog() {
  const dlg = document.getElementById('adminDialog');
  const field = document.getElementById('adminPWField');
  const err = document.getElementById('adminPWError');
  if (!dlg || !field) return;
  field.value = '';
  err.textContent = '';
  dlg.style.display = 'flex';
  setTimeout(() => field.focus(), 80);

  document.getElementById('adminPWOk').onclick = () => {
    if (field.value === ADMIN_PASSWORD) {
      _adminMode = true;
      dlg.style.display = 'none';
      fxList.push({type:'text',x:W/2,y:H/2-40,text:'👑 管理者モード ON',life:2.5,color:'#cc44ff',vy:-28,big:true});
      playSFX('buy');
    } else {
      err.textContent = 'パスワードが違います';
      field.value = '';
      field.focus();
    }
  };
  document.getElementById('adminPWCancel').onclick = () => {
    dlg.style.display = 'none';
  };
  field.onkeydown = (e) => {
    if (e.key === 'Enter') document.getElementById('adminPWOk').click();
    if (e.key === 'Escape') document.getElementById('adminPWCancel').click();
    e.stopPropagation(); // ゲームキー入力に干渉しない
  };
}
function _adminAddCoins(n) { shopCoins = Math.min(shopCoins + n, 999999); saveGameData(); }
function _adminResetShop() { ownedPassives = []; saveGameData(); }
function _adminLevelUp() {
  if (state !== 'playing' || !player) return;
  const needed = Math.max(1, player.expNext - player.exp);
  player.exp += needed;
  while (player.exp >= player.expNext) {
    player.exp -= player.expNext;
    player.level++;
    player.expNext = 60 + player.level * 42;
    if (!player._trialMode) levelUpPending++;
    fxList.push({ type: 'text', x: player.x, y: player.y - 50,
      text: '⭐ LEVEL UP!', life: 1.5, color: '#ffff44', vy: -40, big: true });
  }
  if (levelUpPending > 0) {
    levelUpPending--;
    lvlChoices = pickUpgrades(3);
    state = 'levelup';
  }
}
function _adminSpawnChest() {
  if (!player) return;
  chests.push({ x: player.x + 60, y: player.y, bobT: 0, sparkleT: 0, life: 30, open: false });
}
function _adminSpawnEnemy(type) {
  if (!player) return;
  const a = Math.random() * Math.PI * 2;
  const e = createEnemy(type, player.x + Math.cos(a)*250, player.y + Math.sin(a)*250, false);
  if (e) enemies.push(e);
}

function handleAdminBarClick(mx, my) {
  if (!_adminMode || state !== 'playing') return false;
  for (const b of _adminBarBtns) {
    if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) {
      if (b.key==='inv')     { _adminBar.invincible=!_adminBar.invincible; playSFX('click'); }
      if (b.key==='onehit')  { _adminBar.oneHit=!_adminBar.oneHit; playSFX('click'); }
      if (b.key==='lvup')    { _adminLevelUp(); playSFX('levelup'); }
      if (b.key==='skill')   { if(player) skillCooldown=0; playSFX('click'); }
      if (b.key==='chest')   { _adminSpawnChest(); playSFX('buy'); }
      if (b.key==='heal')    { if(player) player.hp=player.maxHp; playSFX('click'); }
      if (b.key==='maxexp')  { if(player){ player.exp=player.maxExp; checkLevelUp(); } playSFX('levelup'); }
      if (b.key==='boss')    { spawnBoss(); playSFX('click'); }
      if (b.key==='sl')      { _adminSpawnEnemy('slime'); playSFX('click'); }
      if (b.key==='sk')      { _adminSpawnEnemy('skeleton'); playSFX('click'); }
      if (b.key==='killall') { for(const e of enemies){ if(!e.isFinalBoss) e.hp=0; } playSFX('click'); }
      return true;
    }
  }
  return false;
}

function applyAdminEffects() {
  if (!_adminMode || !player) return;
  if (_adminBar.invincible) { player.hp = player.maxHp; player.invincible = 99; }
  if (_adminBar.oneHit) {
    for (const e of enemies) {
      if (!e.isFinalBoss && (e.invincible <= 0 || !e.invincible)) { e.hp = 0; }
    }
  }
}

let _settingsUI = null;

function handleSettingsClick(mx, my) {
  if (!_settingsUI) return;
  const { sl1, sl2, tog1, tog2, tog3, fsX, fsY, fsW, fsH,
          rv1X, rv1Y, rv1W, rv1H, rv2X, rv2Y, adX, adY, adW, adH,
          apX, apY, apW, apH } = _settingsUI;

  // 管理者パネルを開くボタン
  if (_adminMode && apX!==undefined && mx>=apX&&mx<=apX+apW&&my>=apY&&my<=apY+apH) {
    playSFX('click'); state='adminPanel'; return;
  }

  // 管理者モードボタン
  if (adX!==undefined && mx>=adX&&mx<=adX+adW&&my>=adY&&my<=adY+adH) {
    toggleAdminMode(); playSFX('click'); return;
  }

  // ミュートボタン
  if (mx>=sl1.muteX&&mx<=sl1.muteX+sl1.muteW&&my>=sl1.muteY&&my<=sl1.muteY+sl1.muteH) {
    _settingsBGMMute=!_settingsBGMMute; _applySettingsVolume(); saveSettingsData(); playSFX('click'); return;
  }
  if (mx>=sl2.muteX&&mx<=sl2.muteX+sl2.muteW&&my>=sl2.muteY&&my<=sl2.muteY+sl2.muteH) {
    _settingsSFXMute=!_settingsSFXMute; _applySettingsVolume(); saveSettingsData(); playSFX('click'); return;
  }
  // トグル
  for (const tog of [tog1,tog2,tog3]) {
    if (mx>=tog.x&&mx<=tog.x+tog.w&&my>=tog.y&&my<=tog.y+tog.h) {
      if (tog.id==='dmgnum')   _settingsDamageNum=!_settingsDamageNum;
      if (tog.id==='particle')  _settingsParticle=!_settingsParticle;
      if (tog.id==='fps')       _settingsShowFPS=!_settingsShowFPS;
      saveSettingsData(); playSFX('click'); return;
    }
  }
  // フルスクリーン
  if (mx>=fsX&&mx<=fsX+fsW&&my>=fsY&&my<=fsY+fsH) {
    playSFX('click');
    try {
      if (!document.fullscreenElement&&!document.webkitFullscreenElement) {
        (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||function(){}).call(document.documentElement);
      } else {
        (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
      }
    } catch(e){}
    return;
  }
  // 音量リセット
  if (mx>=rv1X&&mx<=rv1X+rv1W&&my>=rv1Y&&my<=rv1Y+rv1H) {
    _settingsBGMVol=0.18; _settingsSFXVol=0.35; _settingsBGMMute=false; _settingsSFXMute=false;
    _applySettingsVolume(); saveSettingsData(); playSFX('click'); return;
  }
  // データリセット
  if (mx>=rv2X&&mx<=rv2X+rv1W&&my>=rv2Y&&my<=rv2Y+rv1H) {
    if (_settingsResetConfirm) {
      // 実行
      try { localStorage.removeItem(SAVE_KEY); } catch(e){}
      shopCoins=0; ownedPassives=[]; achievementsUnlocked=[];
      difficultyLevel=1; _titleBGMIdx=0;
      _settingsBGMVol=0.18; _settingsSFXVol=0.35;
      _settingsBGMMute=false; _settingsSFXMute=false;
      _applySettingsVolume();
      _settingsResetConfirm=false;
      playSFX('click'); return;
    } else {
      _settingsResetConfirm=true;
      setTimeout(()=>{ _settingsResetConfirm=false; }, 3000);
      playSFX('click'); return;
    }
  }
  // スライダークリック
  if (my>=sl1.sliderY-sl1.knobR-4&&my<=sl1.sliderY+sl1.knobR+4&&mx>=sl1.sliderX&&mx<=sl1.sliderX+sl1.sliderW) {
    _settingsBGMVol=Math.max(0,Math.min(1,(mx-sl1.sliderX)/sl1.sliderW));
    _settingsBGMMute=false; _applySettingsVolume(); saveSettingsData(); return;
  }
  if (my>=sl2.sliderY-sl2.knobR-4&&my<=sl2.sliderY+sl2.knobR+4&&mx>=sl2.sliderX&&mx<=sl2.sliderX+sl2.sliderW) {
    _settingsSFXVol=Math.max(0,Math.min(1,(mx-sl2.sliderX)/sl2.sliderW));
    _settingsSFXMute=false; _applySettingsVolume(); saveSettingsData(); return;
  }
  // 背景クリックでリセット確認をキャンセル
  _settingsResetConfirm=false;
}

function handleSettingsPointerDown(mx, my) {
  if (!_settingsUI) return false;
  const { sl1, sl2 } = _settingsUI;
  if (my>=sl1.sliderY-sl1.knobR-6&&my<=sl1.sliderY+sl1.knobR+6&&mx>=sl1.sliderX-10&&mx<=sl1.sliderX+sl1.sliderW+10) {
    _settingsDragging='bgm'; return true;
  }
  if (my>=sl2.sliderY-sl2.knobR-6&&my<=sl2.sliderY+sl2.knobR+6&&mx>=sl2.sliderX-10&&mx<=sl2.sliderX+sl2.sliderW+10) {
    _settingsDragging='sfx'; return true;
  }
  return false;
}

function handleSettingsPointerMove(mx, my) {
  if (!_settingsUI||!_settingsDragging) return;
  const { sl1, sl2 } = _settingsUI;
  if (_settingsDragging==='bgm') {
    _settingsBGMVol=Math.max(0,Math.min(1,(mx-sl1.sliderX)/sl1.sliderW));
    _settingsBGMMute=_settingsBGMVol===0; _applySettingsVolume();
  } else if (_settingsDragging==='sfx') {
    _settingsSFXVol=Math.max(0,Math.min(1,(mx-sl2.sliderX)/sl2.sliderW));
    _settingsSFXMute=_settingsSFXVol===0; _applySettingsVolume();
  }
}

function handleSettingsPointerUp() {
  if (_settingsDragging) { saveSettingsData(); _settingsDragging=null; }
}

// FPS表示 (設定でONの場合)
let _fpsLast=0, _fpsVal=0, _fpsCount=0, _fpsSum=0;
// ── Boss Intro Cutin ──────────────────────────────
function startBossCutin(bossType, displayName, col) {
  enemies = enemies.filter(e => e.boss);
  bossCutin = { name: displayName || bossType, color: col || '#ff2244', progress: 0, done: false };
}
function updateBossCutin(dt) {
  if (!bossCutin || bossCutin.done) return;
  bossCutin.progress += dt;
  if (bossCutin.progress >= 3.5) bossCutin.done = true;
}
function drawBossCutin() {
  if (!bossCutin || bossCutin.done) return;
  const prog = bossCutin.progress;
  let slideX, alpha;
  if (prog < 0.25)      { const e=prog/0.25; slideX=lerp(-W-60,0,1-Math.pow(1-e,3)); alpha=e; }
  else if (prog < 2.8)  { slideX=0; alpha=1; }
  else                  { const e=Math.min(1,(prog-2.8)/0.5); slideX=lerp(0,W+60,e*e); alpha=Math.max(0,1-e*2); }
  if (alpha<=0.01) return;
  ctx.save(); ctx.globalAlpha=alpha;
  const barH=H*0.18;
  ctx.fillStyle='rgba(0,0,0,0.95)'; ctx.fillRect(0,0,W,barH); ctx.fillRect(0,H-barH,W,barH);
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(slideX,barH,W,H-barH*2);
  ctx.fillStyle=bossCutin.color; ctx.globalAlpha=alpha*0.85;
  ctx.fillRect(slideX,barH,W,3); ctx.fillRect(slideX,H-barH-3,W,3);
  ctx.globalAlpha=alpha;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 13px monospace'; ctx.fillStyle=bossCutin.color;
  ctx.shadowBlur=12; ctx.shadowColor=bossCutin.color;
  ctx.fillText('⚔  BOSS  APPEARS  ⚔', slideX+W/2, H/2-36);
  const ns=bossCutin.name.length>12?20:26;
  ctx.font='bold '+ns+'px monospace'; ctx.fillStyle='#ffffff';
  ctx.shadowBlur=22; ctx.shadowColor=bossCutin.color;
  ctx.fillText(bossCutin.name, slideX+W/2, H/2+4);
  ctx.font='bold 11px monospace'; ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.shadowBlur=0;
  ctx.fillText('警戒せよ！', slideX+W/2, H/2+36);
  ctx.restore();
}

// ── Autosave Notification ──────────────────────
function triggerAutosaveNotif() { _autosaveNotifTimer = 2.8; }
function drawAutosaveNotif(dt) {
  if (_autosaveNotifTimer <= 0) return;
  _autosaveNotifTimer = Math.max(0, _autosaveNotifTimer - dt);
  const alpha = _autosaveNotifTimer > 0.6 ? Math.min(1, _autosaveNotifTimer) : _autosaveNotifTimer / 0.6;
  if (alpha <= 0.02) return;
  const txt = '💾 オートセーブ完了';
  ctx.save(); ctx.globalAlpha = alpha * 0.9;
  ctx.font = 'bold 12px monospace'; ctx.textAlign = 'right';
  const tw = ctx.measureText(txt).width;
  const nx = W-8, ny = H-22;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  if (ctx.roundRect) ctx.roundRect(nx-tw-14, ny-11, tw+18, 22, 4);
  else ctx.rect(nx-tw-14, ny-11, tw+18, 22);
  ctx.fill();
  ctx.fillStyle = '#88ffcc'; ctx.shadowBlur = 6; ctx.shadowColor = '#44ffaa';
  ctx.textBaseline = 'middle'; ctx.fillText(txt, nx, ny);
  ctx.restore();
}

function _drawFPS(dt) {
  if (!_settingsShowFPS) return;
  _fpsSum+=1/Math.max(dt,0.001); _fpsCount++;
  if (_fpsCount>=30) { _fpsVal=Math.round(_fpsSum/_fpsCount); _fpsSum=0; _fpsCount=0; }
  ctx.save();
  // FPS below EXP bar: hpY=10, hpH=20, gap=5, expH=10, gap=4 → y=49
  const _fy=49, _fx=8;
  ctx.fillStyle='rgba(0,0,0,0.55)';
  if(ctx.roundRect) ctx.roundRect(_fx-2,_fy-2,58,16,3); else ctx.rect(_fx-2,_fy-2,58,16);
  ctx.fill();
  ctx.fillStyle='#00ff88'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('FPS: '+_fpsVal, _fx, _fy);
  ctx.restore();
}

requestAnimationFrame(loop);

// ── Load saved data immediately on start ──────────────────────────────────
loadGameData();
// but we'll try immediately and it'll succeed on auto-play browsers)
// Try BGM immediately (works if browser allows autoplay)
(function tryAutoplay() {
  try { ensureAudio(); playBGM('title'); } catch(e) {}
})();
// Fallback: play on first user interaction
let _bgmStarted = false;
function _startBGMOnce() {
  if (_bgmStarted) return;
  _bgmStarted = true;
  try { ensureAudio(); if (!bgmPlaying) playBGM('title'); } catch(e) {}
}
document.addEventListener('click', _startBGMOnce, { once: false });
document.addEventListener('keydown', _startBGMOnce, { once: false });
document.addEventListener('touchstart', _startBGMOnce, { once: false });


</script>
