// ===== CAT SPRITE =====
function drawCatSprite(x, y, size, c, facing) {
  ctx.save();
  ctx.translate(x, y);
  if (facing < 0) ctx.scale(-1, 1);
  const s = size;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, s * 0.5, s * 0.5, s * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.body;
  ctx.beginPath(); ctx.ellipse(0, s * 0.1, s * 0.42, s * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  if (c.accent && c.accent !== c.body) {
    ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.ellipse(0, s * 0.2, s * 0.22, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = c.body;
  ctx.beginPath(); ctx.arc(0, -s * 0.28, s * 0.38, 0, Math.PI * 2); ctx.fill();
  // ears
  ctx.beginPath(); ctx.moveTo(-s*0.25,-s*0.55); ctx.lineTo(-s*0.12,-s*0.82); ctx.lineTo(s*0.02,-s*0.55); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.02,-s*0.55);  ctx.lineTo(s*0.15,-s*0.82);  ctx.lineTo(s*0.28,-s*0.55); ctx.fill();
  ctx.fillStyle = c.eyeL; ctx.fillRect(-s*0.2,-s*0.36,s*0.13,s*0.13);
  ctx.fillStyle = c.eyeR; ctx.fillRect(s*0.07,-s*0.36,s*0.13,s*0.13);
  ctx.fillStyle = '#ff99aa'; ctx.fillRect(-s*0.03,-s*0.22,s*0.06,s*0.05);
  ctx.fillStyle = c.body;
  ctx.beginPath(); ctx.arc(s*0.55,s*0.15,s*0.15,0,Math.PI*2); ctx.fill();
  ctx.fillRect(s*0.4,s*0.08,s*0.2,s*0.1);
  ctx.restore();
}

// ===== ENEMY DRAWING =====
function drawEnemies() {
  for (const e of enemies) {
    const sx = e.x - cam.x, sy = e.y - cam.y;
    if (sx < -80 || sx > W+80 || sy < -80 || sy > H+80) continue;

    // Skip enemies completely off-screen (wider margin already exists below,
    // but also skip the ctx.save/restore overhead)
    if (e.type === 'boss') {
      // boss always rendered
    } else if (e.flashLife <= 0 && e.slowTimer <= 0) {
      // fast path: no filter needed at all
    }
    ctx.save();
    // Only set filter when truly needed (it's the most expensive canvas op)
    if (e.flashLife > 0) { ctx.filter = 'brightness(2.5)'; }

    if (e.type === 'demonlord') { drawDemonLordBoss(sx, sy, e); }
    else if (e.type === 'boss' || e.type === 'hellboss') {
      if (e.type === 'hellboss') drawHellBossSprite(sx, sy, e);
      else drawBossSprite(sx, sy, e);
    } else if (enemyImgs[e.type] && enemyImgs[e.type].complete) {
      // Draw from SVG sprite
      const img = enemyImgs[e.type];
      const s2 = e.r * 2.2;
      if (e.slowTimer > 0) ctx.filter = (e.flashLife > 0 ? 'brightness(3)' : '') + ' hue-rotate(180deg)';
      ctx.drawImage(img, sx - s2 * 0.5, sy - s2 * 0.6, s2, s2);
    } else if (midBossImgs[e.type] && midBossImgs[e.type].complete) {
      const himg = midBossImgs[e.type];
      ctx.save();
      if (e.flashLife > 0) ctx.filter = 'brightness(3)';
      ctx.drawImage(himg, sx - e.r * 1.1, sy - e.r * 1.3, e.r * 2.2, e.r * 2.5);
      ctx.restore();
    } else if (stageBossImgs[e.type] && stageBossImgs[e.type].complete) {
      const himg = stageBossImgs[e.type];
      ctx.save();
      if (e.flashLife > 0) ctx.filter = 'brightness(3)';
      ctx.drawImage(himg, sx - e.r * 1.2, sy - e.r * 1.4, e.r * 2.4, e.r * 2.8);
      ctx.restore();
    } else if (extraEnemyImgs[e.type] && extraEnemyImgs[e.type].complete) {
      const himg = extraEnemyImgs[e.type];
      ctx.save();
      if (e.flashLife > 0) ctx.filter = 'brightness(3)';
      ctx.drawImage(himg, sx - e.r, sy - e.r * 1.1, e.r * 2, e.r * 2.2);
      ctx.restore();
    } else if (newStageImgs[e.type] && newStageImgs[e.type].complete) {
      const himg = newStageImgs[e.type];
      ctx.save();
      if (e.flashLife > 0) ctx.filter = 'brightness(3)';
      ctx.drawImage(himg, sx - e.r, sy - e.r * 1.1, e.r * 2, e.r * 2.2);
      ctx.restore();
    } else if (hellEnemyImgs[e.type] && hellEnemyImgs[e.type].complete) {
      const himg = hellEnemyImgs[e.type];
      const s2 = e.r * 2.4;
      if (e.slowTimer > 0) ctx.filter = (e.flashLife > 0 ? 'brightness(3)' : '') + ' hue-rotate(200deg)';
      ctx.drawImage(himg, sx - s2 * 0.5, sy - s2 * 0.65, s2, s2);
    } else {
      // Fallback: colored circle
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(sx, sy, e.r, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();

    // HP bar (skip for slime/bat if full HP)
    if (e.hp < e.maxHp || e.r >= 18) {
      const bw = e.r * 2.6, bh = 5;
      const bx = sx - bw / 2, by = sy - e.r - 10;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = '#440000'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = e.boss ? '#ff2244' : '#ff4466';
      ctx.fillRect(bx, by, bw * clamp(e.hp / e.maxHp, 0, 1), bh);
      if (e.slowTimer > 0) {
        ctx.fillStyle = '#aaddff';
        ctx.fillRect(bx, by, bw * clamp(e.hp / e.maxHp, 0, 1), 2);
      }
    }
  }
}

function drawHellBossSprite(sx, sy, e) {
  // Lava pulse
  const pulse = 1 + 0.08 * Math.sin(gameTime * 5);
  ctx.save(); ctx.globalAlpha = 0.3;
  const grd = ctx.createRadialGradient(sx, sy, 10, sx, sy, e.r * 2.5);
  grd.addColorStop(0, '#ff4400'); grd.addColorStop(0.5, '#cc2200'); grd.addColorStop(1, 'rgba(100,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(sx, sy, e.r * 2.5 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (hellEnemyImgs.hellboss && hellEnemyImgs.hellboss.complete) {
    ctx.save(); ctx.shadowBlur = 40; ctx.shadowColor = '#ff2200';
    ctx.drawImage(hellEnemyImgs.hellboss, sx - e.r * 1.2, sy - e.r * 1.4, e.r * 2.4, e.r * 2.7);
    ctx.restore();
  }
  // Flame text
  ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('👑', sx, sy - e.r - 24 + Math.sin(gameTime * 3) * 4);
}

function drawBossSprite(sx, sy, e) {
  // Pulsing glow behind boss
  const pulse = 1 + 0.08 * Math.sin(gameTime * 4);
  ctx.save();
  ctx.globalAlpha = 0.25;
  const grd = ctx.createRadialGradient(sx, sy, 10, sx, sy, e.r * 2);
  grd.addColorStop(0, '#ff0033'); grd.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(sx, sy, e.r * 2 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // SVG boss image
  if (enemyImgs.boss && enemyImgs.boss.complete) {
    ctx.drawImage(enemyImgs.boss, sx - e.r * 1.1, sy - e.r * 1.3, e.r * 2.2, e.r * 2.5);
  } else {
    ctx.fillStyle = '#ff2244';
    ctx.beginPath(); ctx.arc(sx, sy, e.r, 0, Math.PI * 2); ctx.fill();
  }
  // Crown emoji float
  ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('', sx, sy - e.r - 20 + Math.sin(gameTime * 3) * 3);
}

// ===== WEAPON DRAWING =====
function drawWeapons() {
  for (const w of activeWeapons) {
    switch (w.type) {
      case 'orbit':       drawOrbit(w);    break;
      case 'shield':      drawShield(w);   break;
      case 'garlic':      drawGarlic(w);   break;
      case 'aura':        drawAuraRing(w); break;
      case 'shadowaura':  drawShadowAura(w);  break;
      case 'holyorbit':   drawHolyOrbitWeapon(w);  break;
    }
  }
}

function drawOrbit(w) {
  const r = (65 + w.level * 8) * player.rangeMul;
  const baseBalls = w.level <= 2 ? 2 + (w.level - 1)
                  : w.level === 3 ? 4
                  : w.level === 4 ? 6 : 8;
  const balls = baseBalls + player.countBuff;
  const size = 10 + w.level * 1.5;
  for (let i = 0; i < balls; i++) {
    const a = w.angle + (i / balls) * Math.PI * 2;
    const sx = player.x + Math.cos(a) * r - cam.x;
    const sy = player.y + Math.sin(a) * r - cam.y;
    ctx.save(); ctx.globalAlpha = 0.3;
    const grd2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, size * 2.5);
    grd2.addColorStop(0, '#ffdd44'); grd2.addColorStop(1, 'transparent');
    ctx.fillStyle = grd2;
    ctx.beginPath(); ctx.arc(sx, sy, size * 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, size);
    grd.addColorStop(0, '#ffffcc'); grd.addColorStop(0.5, '#ffcc44'); grd.addColorStop(1, 'rgba(255,140,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
  }
}

// ── 聖なる盾陣: golden halo ring + cross-shaped holy shields ─────────────────
function drawHolyOrbitWeapon(w) {
  const r = (80 + w.level * 10) * player.rangeMul;
  const cx = player.x - cam.x, cy = player.y - cam.y;
  const shields = 4 + player.countBuff;

  // Outer halo ring
  ctx.save();
  ctx.globalAlpha = 0.22 + 0.08 * Math.sin(gameTime * 3);
  const hGrd = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r * 1.15);
  hGrd.addColorStop(0, 'rgba(255,240,120,0)');
  hGrd.addColorStop(0.4, 'rgba(255,220,80,0.4)');
  hGrd.addColorStop(0.7, 'rgba(255,200,50,0.3)');
  hGrd.addColorStop(1, 'rgba(255,180,0,0)');
  ctx.fillStyle = hGrd;
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.15, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Rotating cross-shaped holy shields
  for (let i = 0; i < shields; i++) {
    const a = w.angle + (i / shields) * Math.PI * 2;
    const sx = cx + Math.cos(a) * r;
    const sy = cy + Math.sin(a) * r;
    const shSize = 16 + w.level * 2;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(a + Math.PI / 4);
    // Cross arms glow
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffe066';
    // Vertical arm
    const vGrd = ctx.createLinearGradient(0, -shSize, 0, shSize);
    vGrd.addColorStop(0, 'rgba(255,255,200,0)');
    vGrd.addColorStop(0.5, '#ffe566');
    vGrd.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = vGrd;
    ctx.fillRect(-shSize * 0.18, -shSize, shSize * 0.36, shSize * 2);
    // Horizontal arm
    const hGrd2 = ctx.createLinearGradient(-shSize, 0, shSize, 0);
    hGrd2.addColorStop(0, 'rgba(255,255,200,0)');
    hGrd2.addColorStop(0.5, '#ffe566');
    hGrd2.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = hGrd2;
    ctx.fillRect(-shSize, -shSize * 0.18, shSize * 2, shSize * 0.36);
    // Center gem
    const cGrd = ctx.createRadialGradient(0, 0, 0, 0, 0, shSize * 0.4);
    cGrd.addColorStop(0, '#ffffff');
    cGrd.addColorStop(0.5, '#ffe566');
    cGrd.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.fillStyle = cGrd;
    ctx.beginPath(); ctx.arc(0, 0, shSize * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawShield(w) {
  const r = (50 + w.level * 10) * player.rangeMul;
  const baseShields = w.level <= 2 ? 3 + (w.level - 1)
                    : w.level === 3 ? 5
                    : w.level === 4 ? 7 : 9;
  const shields = baseShields + player.countBuff;
  const size = 14 + w.level * 2;
  for (let i = 0; i < shields; i++) {
    const a = w.angle + (i / shields) * Math.PI * 2;
    const sx = player.x + Math.cos(a) * r - cam.x;
    const sy = player.y + Math.sin(a) * r - cam.y;
    const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, size);
    grd.addColorStop(0, '#ddeeff'); grd.addColorStop(0.5, '#4488ff'); grd.addColorStop(1, 'rgba(0,100,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
    // Outer hex shape
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(gameTime * 2 + i);
    ctx.strokeStyle = '#88ccff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6;
    ctx.beginPath();
    for (let h = 0; h < 6; h++) {
      const ha = h / 6 * Math.PI * 2;
      if (h === 0) ctx.moveTo(Math.cos(ha) * size * 0.8, Math.sin(ha) * size * 0.8);
      else ctx.lineTo(Math.cos(ha) * size * 0.8, Math.sin(ha) * size * 0.8);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
}

function drawGarlic(w) {
  const range = (80 + w.level * 15) * player.rangeMul;
  const sx = player.x - cam.x, sy = player.y - cam.y;
  const t = gameTime;

  // --- Inner glow fill ---
  ctx.save(); ctx.globalAlpha = 0.18 + 0.06 * Math.sin(t * 5);
  const grd = ctx.createRadialGradient(sx, sy, 10, sx, sy, range);
  grd.addColorStop(0, '#ccff88'); grd.addColorStop(0.6, '#44dd22'); grd.addColorStop(1, 'rgba(30,180,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(sx, sy, range, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // --- Edge glow ring (solid, soft - replaces dotted line) ---
  ctx.save(); ctx.globalAlpha = 0.45 + 0.15 * Math.sin(t * 5);
  ctx.strokeStyle = '#88ff44'; ctx.lineWidth = 3;
  ctx.shadowBlur = 10; ctx.shadowColor = '#44ff00';
  ctx.beginPath(); ctx.arc(sx, sy, range, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // --- Orbiting herb leaf icons ---
  const leafCount = 4 + Math.min(w.level * 2, 6);
  const leafSpd = 1.6 + w.level * 0.25;
  for (let li = 0; li < leafCount; li++) {
    const a = t * leafSpd + (li / leafCount) * Math.PI * 2;
    const orbitR = range * 0.72;
    const lx = sx + Math.cos(a) * orbitR;
    const ly = sy + Math.sin(a) * orbitR;
    ctx.save();
    ctx.translate(lx, ly); ctx.rotate(a + Math.PI / 2);
    ctx.globalAlpha = 0.9;
    // Leaf shape
    ctx.fillStyle = '#33ee11';
    ctx.shadowBlur = 6; ctx.shadowColor = '#88ff44';
    ctx.beginPath();
    ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
    // Vein
    ctx.strokeStyle = '#99ff66'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.stroke();
    ctx.restore();
  }

  // --- Drifting sparkle particles ---
  for (let pi = 0; pi < 3; pi++) {
    const pa = t * 0.8 + pi * Math.PI * 2 / 3 + Math.sin(t * 3 + pi) * 0.5;
    const pr = range * (0.3 + 0.4 * ((Math.sin(t * 1.5 + pi * 2.1) + 1) / 2));
    const px2 = sx + Math.cos(pa) * pr;
    const py2 = sy + Math.sin(pa) * pr;
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4 + pi);
    ctx.fillStyle = '#aaffcc';
    ctx.beginPath(); ctx.arc(px2, py2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawAuraRing(w) {
  const range = (100 + w.level * 20) * player.rangeMul;
  const sx = player.x - cam.x, sy = player.y - cam.y;
  const t = gameTime;
  // Simple soft radial glow - clean and minimal
  const pulse = 0.12 + 0.05 * Math.sin(t * 4);
  ctx.save();
  ctx.globalAlpha = pulse;
  const grd = ctx.createRadialGradient(sx, sy, range * 0.3, sx, sy, range);
  grd.addColorStop(0, 'rgba(180,100,255,0.6)');
  grd.addColorStop(0.5, 'rgba(100,40,200,0.3)');
  grd.addColorStop(1, 'rgba(60,0,150,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(sx, sy, range, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Single clean solid edge ring (no dash)
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t * 3);
  ctx.strokeStyle = '#9955ee'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(sx, sy, range, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ===== PROJECTILE DRAWING =====
function drawBoneProj(px,py,vx,vy,size){const a=Math.atan2(vy,vx);ctx.save();ctx.translate(px,py);ctx.rotate(a);ctx.shadowBlur=8;ctx.shadowColor='rgba(200,200,160,0.5)';ctx.fillStyle='#ddddcc';ctx.strokeStyle='#aaaaaa';ctx.lineWidth=0.8;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-size*0.65,-size*0.14,size*1.3,size*0.28,3);else ctx.rect(-size*0.65,-size*0.14,size*1.3,size*0.28);ctx.fill();ctx.stroke();for(const[bx,oy]of[[-size*0.65,-size*0.18],[-size*0.65,size*0.18],[size*0.65,-size*0.18],[size*0.65,size*0.18]]){ctx.beginPath();ctx.arc(bx,oy,size*0.22,0,Math.PI*2);ctx.fill();ctx.stroke();}ctx.restore();}
function drawProjs() {
  for(const p of projs){
    if(p.isBone){const sx=p.x-cam.x,sy=p.y-cam.y;drawBoneProj(sx,sy,p.vx,p.vy,p.size);continue;}
    if(p.isWisp){const sx=p.x-cam.x,sy=p.y-cam.y;drawWispFireball(sx,sy,p.size,p.wispColor||'blue');continue;}
    if(p.isRock){const sx=p.x-cam.x,sy=p.y-cam.y;drawRock(sx,sy,p.size*0.7,Math.atan2(p.vy,p.vx)+gameTime*3);continue;}
    if(p.isGoldCoin){const sx=p.x-cam.x,sy=p.y-cam.y;drawGoldCoin(sx,sy,p.size,gameTime*5+p.x);continue;}
    // ── Cannonball: big black iron sphere with highlight ──────────────────
    if(p.isCannon){
      const sx=p.x-cam.x,sy=p.y-cam.y;
      ctx.save();
      const cGr=ctx.createRadialGradient(sx-p.size*0.28,sy-p.size*0.28,p.size*0.05,sx,sy,p.size);
      cGr.addColorStop(0,'rgba(120,120,130,1)');
      cGr.addColorStop(0.4,'rgba(35,35,40,1)');
      cGr.addColorStop(1,'rgba(10,10,12,1)');
      ctx.fillStyle=cGr;
      ctx.shadowBlur=12; ctx.shadowColor='rgba(80,0,0,0.7)';
      ctx.beginPath(); ctx.arc(sx,sy,p.size,0,Math.PI*2); ctx.fill();
      // Iron ring
      ctx.strokeStyle='rgba(80,80,90,0.6)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(sx,sy,p.size*0.82,0,Math.PI*2); ctx.stroke();
      // Highlight glint
      ctx.fillStyle='rgba(200,200,220,0.5)';
      ctx.beginPath(); ctx.arc(sx-p.size*0.32,sy-p.size*0.32,p.size*0.22,0,Math.PI*2); ctx.fill();
      // Smoke trail
      ctx.globalAlpha=0.35;
      ctx.fillStyle='rgba(80,80,80,0.5)';
      const _ta=Math.atan2(p.vy,p.vx)+Math.PI;
      for(let _ti=1;_ti<=3;_ti++){
        ctx.beginPath();
        ctx.arc(sx+Math.cos(_ta)*p.size*_ti*0.9,sy+Math.sin(_ta)*p.size*_ti*0.9,p.size*(0.7-_ti*0.15),0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
      continue;
    }
    // ── Purin (pudding) projectile ────────────────────────────────────────
    if(p.isPurin){
      const sx=p.x-cam.x,sy=p.y-cam.y;
      ctx.save();
      // Body
      const pGr=ctx.createRadialGradient(sx,sy-p.size*0.15,p.size*0.1,sx,sy,p.size);
      pGr.addColorStop(0,'#ffe88a'); pGr.addColorStop(0.6,'#ffcc44'); pGr.addColorStop(1,'rgba(200,150,0,0)');
      ctx.fillStyle=pGr; ctx.shadowBlur=6; ctx.shadowColor='#ffaa00';
      ctx.beginPath(); ctx.ellipse(sx,sy+p.size*0.1,p.size,p.size*0.85,0,0,Math.PI*2); ctx.fill();
      // Caramel top stripe
      ctx.fillStyle='rgba(140,70,0,0.55)';
      ctx.beginPath(); ctx.ellipse(sx,sy-p.size*0.35,p.size*0.65,p.size*0.18,0,0,Math.PI*2); ctx.fill();
      // Highlight
      ctx.fillStyle='rgba(255,255,220,0.7)';
      ctx.beginPath(); ctx.ellipse(sx-p.size*0.2,sy-p.size*0.25,p.size*0.2,p.size*0.12,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) continue;
    const alpha = Math.min(1, p.life / 0.2);
    ctx.save(); ctx.globalAlpha = alpha;

    if (p.type === 'rapid') {
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.size * 1.8);
      grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.4, '#ff8844'); grd.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, p.size * 1.8, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'triple') {
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.size);
      grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.5, '#cc88ff'); grd.addColorStop(1, 'rgba(150,50,255,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'fireball') {
      const fAngle = Math.atan2(p.vy, p.vx);
      const spd = Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      // === METEOR look: elongated streak + core ===
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(fAngle);
      // Long comet tail
      for (let ti = 0; ti < 6; ti++) {
        const tLen = p.size * (2.5 + ti * 1.8);
        const tW = p.size * (1.1 - ti * 0.14);
        const tAlpha = alpha * (0.55 - ti * 0.08);
        const grdT = ctx.createLinearGradient(-tLen, 0, 0, 0);
        grdT.addColorStop(0, 'rgba(80,0,0,0)');
        grdT.addColorStop(0.5, `rgba(200,${40+ti*10},0,${tAlpha.toFixed(2)})`);
        grdT.addColorStop(1, `rgba(255,120,0,${(tAlpha*1.4).toFixed(2)})`);
        ctx.globalAlpha = 1;
        ctx.fillStyle = grdT;
        ctx.beginPath(); ctx.ellipse(-tLen/2, 0, tLen/2, tW, 0, 0, Math.PI*2); ctx.fill();
      }
      // Outer glow
      ctx.globalAlpha = alpha * 0.4;
      const grdO2 = ctx.createRadialGradient(0,0,0,0,0,p.size*2.2);
      grdO2.addColorStop(0,'rgba(255,120,0,0.9)'); grdO2.addColorStop(1,'rgba(200,0,0,0)');
      ctx.fillStyle = grdO2;
      ctx.beginPath(); ctx.arc(0,0,p.size*2.2,0,Math.PI*2); ctx.fill();
      // Core - blazing white-orange
      ctx.globalAlpha = alpha;
      const grdCore = ctx.createRadialGradient(0,0,0,0,0,p.size);
      grdCore.addColorStop(0,'#ffffff');
      grdCore.addColorStop(0.2,'#ffeeaa');
      grdCore.addColorStop(0.5,'#ff8833');
      grdCore.addColorStop(1,'#dd2200');
      ctx.fillStyle = grdCore;
      ctx.beginPath(); ctx.arc(0,0,p.size,0,Math.PI*2); ctx.fill();
      // Spark particles
      ctx.globalAlpha = alpha * 0.7;
      for (let si=0;si<4;si++) {
        const sa = si/4*Math.PI*2 + gameTime*8;
        const sr = p.size*(0.9+0.3*Math.sin(gameTime*5+si));
        ctx.fillStyle = si%2===0?'#ffcc44':'#ff8800';
        ctx.beginPath(); ctx.arc(Math.cos(sa)*sr, Math.sin(sa)*sr, 2.5,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    } else if (p.type === 'ice') {
      // Ice crystal
      ctx.save();
      ctx.translate(sx, sy);
      const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      const grd = ctx.createLinearGradient(-p.size * 2, 0, p.size * 2, 0);
      grd.addColorStop(0, 'rgba(180,230,255,0)'); grd.addColorStop(0.3, '#88ddff');
      grd.addColorStop(0.5, '#ffffff'); grd.addColorStop(0.7, '#88ddff');
      grd.addColorStop(1, 'rgba(180,230,255,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-p.size * 2, 0); ctx.lineTo(0, -p.size); ctx.lineTo(p.size * 2, 0);
      ctx.lineTo(0, p.size); ctx.closePath(); ctx.fill();
      // Sparkles
      ctx.fillStyle = 'rgba(200,240,255,0.7)';
      for (let si = 0; si < 3; si++) {
        const sa = (si / 3) * Math.PI * 2 + gameTime * 10;
        ctx.fillRect(Math.cos(sa) * p.size * 1.3 - 1.5, Math.sin(sa) * p.size * 0.8 - 1.5, 3, 3);
      }
      ctx.restore();
    } else if (p.type === 'boomerang') {
      ctx.save(); ctx.translate(sx, sy);
      const a = Math.atan2(p.vy, p.vx) + gameTime * 12;
      ctx.rotate(a);
      const grd = ctx.createLinearGradient(-p.size, 0, p.size, 0);
      grd.addColorStop(0, '#9933ff'); grd.addColorStop(0.5, '#cc66ff'); grd.addColorStop(1, '#9933ff');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(0, 0, p.size, -Math.PI * 0.7, Math.PI * 0.7);
      ctx.arc(p.size * 0.3, 0, p.size * 0.6, Math.PI * 0.7, -Math.PI * 0.7, true);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.type === 'megapaw') {
      // Purple paw slap (megapaw)
      ctx.save(); ctx.translate(sx, sy);
      ctx.rotate(gameTime * 5);
      const ps = p.size;
      // Purple glow
      ctx.save(); ctx.globalAlpha = 0.4;
      const mgrd = ctx.createRadialGradient(0,0,0,0,0,ps*2.0);
      mgrd.addColorStop(0,'#cc88ff'); mgrd.addColorStop(0.5,'rgba(120,0,200,0.3)'); mgrd.addColorStop(1,'rgba(80,0,150,0)');
      ctx.fillStyle=mgrd; ctx.beginPath(); ctx.arc(0,0,ps*2.0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // Main palm pad – purple
      ctx.fillStyle = '#9944cc';
      ctx.strokeStyle = '#cc66ff'; ctx.lineWidth = 2;
      ctx.shadowBlur=8; ctx.shadowColor='#aa44ff';
      ctx.beginPath(); ctx.arc(0, ps*0.1, ps*0.62, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      // Shine
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(220,180,255,0.45)';
      ctx.beginPath(); ctx.ellipse(-ps*0.15,-ps*0.05,ps*0.24,ps*0.17,-0.4,0,Math.PI*2); ctx.fill();
      // 4 toe beans – lighter purple
      const toeAngles = [-0.55, -0.18, 0.18, 0.55];
      ctx.fillStyle = '#bb66ee';
      ctx.strokeStyle = '#dd88ff'; ctx.lineWidth = 1.2;
      for (const ta of toeAngles) {
        const tx4 = Math.sin(ta) * ps * 0.68;
        const ty4 = -Math.cos(ta) * ps * 0.68 - ps*0.08;
        ctx.beginPath(); ctx.arc(tx4, ty4, ps*0.23, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    } else {
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.size);
      grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.5, '#cc88ff'); grd.addColorStop(1, 'rgba(150,50,255,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(sx, sy, p.size, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }
}

// ===== PUDDLES & TORNADOS DRAWING =====
function drawPuddlesAndTornados() {
  for (const p of puddles) {
    const sx = p.x - cam.x, sy = p.y - cam.y;
    const alpha = Math.min(1, p.life * 1.5) * 0.6;
    const pulse = 1 + 0.1 * Math.sin(gameTime * 5);

    if (p.isShadow) {
      // ── 奈落の香: dark purple/black aura puddle ──────────────────────────
      ctx.save(); ctx.globalAlpha = alpha * 0.85;
      const sgrd = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.r * pulse);
      sgrd.addColorStop(0, 'rgba(100,0,160,0.9)');
      sgrd.addColorStop(0.4, 'rgba(50,0,100,0.7)');
      sgrd.addColorStop(0.75, 'rgba(20,0,50,0.4)');
      sgrd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sgrd;
      ctx.beginPath(); ctx.ellipse(sx, sy, p.r * pulse, p.r * 0.4 * pulse, 0, 0, Math.PI * 2); ctx.fill();
      // Dark sparkles
      for (let si = 0; si < 4; si++) {
        const sa = gameTime * 1.5 + si / 4 * Math.PI * 2;
        const sr = p.r * (0.3 + 0.15 * Math.sin(gameTime * 4 + si));
        ctx.globalAlpha = alpha * 0.6;
        ctx.fillStyle = si % 2 === 0 ? '#9900cc' : '#440088';
        ctx.font = '9px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✦', sx + Math.cos(sa) * sr, sy + Math.sin(sa) * sr * 0.4);
      }
      // Smoke wisps
      ctx.globalAlpha = alpha * 0.35;
      for (let wi = 0; wi < 3; wi++) {
        const wa = gameTime * 0.8 + wi * 2.1;
        const wr = p.r * (0.2 + 0.1 * wi);
        const wGrd = ctx.createRadialGradient(sx + Math.cos(wa) * wr, sy - wr * 0.3, 0, sx + Math.cos(wa) * wr, sy - wr * 0.3, p.r * 0.25);
        wGrd.addColorStop(0, 'rgba(80,0,120,0.6)');
        wGrd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = wGrd;
        ctx.beginPath(); ctx.arc(sx + Math.cos(wa) * wr, sy - wr * 0.3, p.r * 0.25, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      continue;
    }

    // ── Holy water: Golden Goddess Pool ──────────────────────────────────────
    const t2 = gameTime;
    ctx.save(); ctx.globalAlpha = alpha;
    // Golden base pool (ellipse)
    const grdBase = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.r * pulse);
    grdBase.addColorStop(0, '#fffaaa');
    grdBase.addColorStop(0.4, '#ffcc00');
    grdBase.addColorStop(0.75, '#cc8800');
    grdBase.addColorStop(1, 'rgba(180,100,0,0)');
    ctx.fillStyle = grdBase;
    ctx.beginPath(); ctx.ellipse(sx, sy, p.r * pulse, p.r * 0.42 * pulse, 0, 0, Math.PI * 2); ctx.fill();
    // Shimmer inner ring
    ctx.save(); ctx.globalAlpha = alpha * 0.6;
    ctx.strokeStyle = '#ffffaa'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(sx, sy, p.r * 0.55, p.r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // Rotating sparkle stars on pool
    for (let gi = 0; gi < 5; gi++) {
      const ga = t2 * 1.8 + gi / 5 * Math.PI * 2;
      const gr2 = p.r * (0.35 + 0.2 * Math.sin(t2 * 3 + gi));
      const gx = sx + Math.cos(ga) * gr2;
      const gy = sy + Math.sin(ga) * gr2 * 0.4;
      ctx.globalAlpha = alpha * (0.5 + 0.4 * Math.abs(Math.sin(t2 * 4 + gi)));
      ctx.fillStyle = gi % 2 === 0 ? '#ffffff' : '#ffee44';
      ctx.font = '10px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✦', gx, gy);
    }
    // Goddess silhouette (tiny) above pool
    const godAlpha = alpha * 0.8;
    ctx.globalAlpha = godAlpha;
    ctx.fillStyle = '#ffdd88';
    ctx.beginPath(); ctx.arc(sx, sy - p.r * 0.55, p.r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath();
    ctx.moveTo(sx - p.r*0.15, sy - p.r*0.38);
    ctx.quadraticCurveTo(sx, sy - p.r*0.22, sx + p.r*0.15, sy - p.r*0.38);
    ctx.closePath(); ctx.fill();
    // Wings
    ctx.strokeStyle = '#ffffaa'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx - p.r*0.14, sy-p.r*0.45);
    ctx.quadraticCurveTo(sx - p.r*0.38, sy-p.r*0.6, sx - p.r*0.28, sy-p.r*0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + p.r*0.14, sy-p.r*0.45);
    ctx.quadraticCurveTo(sx + p.r*0.38, sy-p.r*0.6, sx + p.r*0.28, sy-p.r*0.4); ctx.stroke();
    ctx.restore();
  }
  // Tornados
  for (const t of tornados) {
    const sx = t.x - cam.x, sy = t.y - cam.y;
    const alpha = Math.min(1, t.life);
    const c1 = t.fire ? '#ff6644' : '#aaaaff';
    const c2 = t.fire ? '#cc1100' : '#6666ff';
    const c3 = t.fire ? 'rgba(140,0,0,0)' : 'rgba(80,80,255,0)';
    ctx.save();
    // Ground shadow/base glow
    if (t.fire) {
      ctx.save(); ctx.globalAlpha = alpha * 0.4;
      const grdBase = ctx.createRadialGradient(sx, sy, 0, sx, sy, t.r * 0.6);
      grdBase.addColorStop(0, '#ff6600'); grdBase.addColorStop(1, 'rgba(180,0,0,0)');
      ctx.fillStyle = grdBase;
      ctx.beginPath(); ctx.ellipse(sx, sy, t.r * 0.6, t.r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (let ti = 0; ti < 6; ti++) {
      const progress = ti / 6;
      const radius = t.r * (0.15 + 0.85 * progress);
      const yoff = -t.r * 0.8 * progress;
      const a = t.angle + ti * 1.0;
      ctx.globalAlpha = alpha * (0.6 - progress * 0.4);
      const grd = ctx.createRadialGradient(sx, sy + yoff, 0, sx, sy + yoff, radius);
      grd.addColorStop(0, c1); grd.addColorStop(0.5, c2); grd.addColorStop(1, c3);
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.ellipse(sx + Math.cos(a) * radius * 0.3, sy + yoff + Math.sin(a) * radius * 0.15, radius, radius * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    }
    // Ember sparks for fire tornados
    if (t.fire) {
      for (let ei = 0; ei < 4; ei++) {
        const ea = gameTime * 8 + ei * Math.PI / 2;
        const er = t.r * 0.25;
        ctx.globalAlpha = 0.7 * Math.abs(Math.sin(gameTime * 5 + ei));
        ctx.fillStyle = ei % 2 === 0 ? '#ff9900' : '#ffcc00';
        ctx.beginPath();
        ctx.arc(sx + Math.cos(ea)*er, sy + Math.sin(ea)*er*0.5, 4, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }
}

// ===== GEM DRAWING =====
function drawGems() {
  for (const g of gems) {
    const sx = g.x - cam.x, sy = g.y - cam.y;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
    const d = g.def;
    const pulse = 0.75 + 0.25 * Math.sin(gameTime * 7 + g.x * 0.1);
    const fadeAlpha = Math.min(1, g.life * 0.8);
    ctx.save(); ctx.globalAlpha = fadeAlpha;

    if (d.hp > 0) {
      // Heart
      ctx.save(); ctx.translate(sx, sy); ctx.scale(d.size / 12, d.size / 12);
      ctx.fillStyle = '#ff4488';
      ctx.beginPath();
      ctx.moveTo(0, -5); ctx.bezierCurveTo(-10, -15, -20, -5, -10, 5);
      ctx.lineTo(0, 14); ctx.lineTo(10, 5); ctx.bezierCurveTo(20, -5, 10, -15, 0, -5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,220,0.6)';
      ctx.beginPath(); ctx.ellipse(-4, -5, 4, 3, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      // Diamond gem
      const s = d.size * pulse;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(gameTime * 1.5 + g.x * 0.05);
      const grd = ctx.createRadialGradient(0, -s * 0.3, 0, 0, 0, s);
      grd.addColorStop(0, d.inner); grd.addColorStop(0.6, d.color); grd.addColorStop(1, d.color);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, -s * 0.2); ctx.lineTo(s * 0.5, s);
      ctx.lineTo(-s * 0.5, s); ctx.lineTo(-s * 0.7, -s * 0.2); ctx.closePath(); ctx.fill();
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.8); ctx.lineTo(s * 0.35, -s * 0.1); ctx.lineTo(0, -s * 0.2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }
}

// ===== FX DRAWING =====
function drawFX() {
  for (const f of fxList) {
    const alpha = Math.max(0, f.life);
    if (f.type === 'text') {
      const sx = f.x - cam.x, sy = f.y - cam.y;
      ctx.save();
      ctx.globalAlpha = Math.min(1, alpha * 1.5);
      ctx.fillStyle = f.color;
      ctx.font = (f.big ? 'bold 18px' : 'bold 13px') + ' monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowBlur = f.big ? 14 : 6; ctx.shadowColor = f.color;
      ctx.fillText(f.text, sx, sy);
      ctx.restore();
    } else if (f.type === 'rootTrap') {
      const sx = f.x - cam.x, sy = f.y - cam.y;
      const lifeRatio = Math.min(1, f.life / f.maxLife);
      const isTele = f.isTelegraph;
      const isShelter = f.isShelter;
      ctx.save();
      ctx.globalAlpha = isTele ? lifeRatio*0.55 : Math.min(0.88, lifeRatio*0.95);
      if (isShelter) {
        // Shelter spot (cyan) — keep original simple ring
        ctx.strokeStyle='#88ffff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(sx,sy,f.r,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='rgba(136,255,255,0.12)';
        ctx.beginPath(); ctx.arc(sx,sy,f.r,0,Math.PI*2); ctx.fill();
      } else {
        // ── VISIBLE ROOT MODEL ──────────────────────────────────────────────
        const rootColor = f.color || '#336600';
        const phase2Roots = !isTele; // only grown roots when active
        // Ground circle shadow
        ctx.fillStyle = 'rgba(20,10,0,0.28)';
        ctx.beginPath(); ctx.ellipse(sx,sy,f.r*1.1,f.r*0.35,0,0,Math.PI*2); ctx.fill();
        // Outer ring glow
        const ringG = ctx.createRadialGradient(sx,sy,f.r*0.55,sx,sy,f.r);
        ringG.addColorStop(0,'rgba(60,120,0,0)');
        ringG.addColorStop(0.7,`rgba(40,100,0,${isTele?0.25:0.35})`);
        ringG.addColorStop(1,'rgba(20,60,0,0)');
        ctx.fillStyle=ringG;
        ctx.beginPath(); ctx.arc(sx,sy,f.r,0,Math.PI*2); ctx.fill();
        // Main roots radiating out
        const numRoots = 8;
        ctx.lineCap='round'; ctx.lineJoin='round';
        for(let ri=0;ri<numRoots;ri++){
          const baseA = ri/numRoots*Math.PI*2 + 0.3;
          const sway = Math.sin(gameTime*1.2 + ri*1.3) * 0.18;
          ctx.strokeStyle = isTele ? 'rgba(80,140,20,0.45)' : `rgba(50,110,10,${0.7+Math.sin(gameTime*2+ri)*0.1})`;
          ctx.lineWidth = phase2Roots ? 3.5 : 2;
          ctx.shadowBlur = phase2Roots ? 6 : 0;
          ctx.shadowColor = '#336600';
          ctx.beginPath();
          ctx.moveTo(sx,sy);
          // Two-segment branching root
          const midR = f.r*0.48;
          const midX = sx+Math.cos(baseA+sway)*midR;
          const midY = sy+Math.sin(baseA+sway)*midR*0.55;
          ctx.lineTo(midX, midY);
          ctx.lineTo(sx+Math.cos(baseA+sway*1.4)*f.r*0.85, sy+Math.sin(baseA+sway*1.4)*f.r*0.55);
          ctx.stroke();
          // Branch fork
          if(phase2Roots){
            ctx.lineWidth=2; ctx.globalAlpha*=0.7;
            const bkA=baseA+sway+0.45, bkA2=baseA+sway-0.4;
            ctx.beginPath();
            ctx.moveTo(midX,midY);
            ctx.lineTo(sx+Math.cos(bkA)*f.r*0.65, sy+Math.sin(bkA)*f.r*0.45);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(midX,midY);
            ctx.lineTo(sx+Math.cos(bkA2)*f.r*0.6, sy+Math.sin(bkA2)*f.r*0.4);
            ctx.stroke();
            ctx.globalAlpha=Math.min(0.88, lifeRatio*0.95);
          }
        }
        // Center earth mound
        ctx.shadowBlur=0;
        const cg=ctx.createRadialGradient(sx,sy-4,0,sx,sy,f.r*0.3);
        cg.addColorStop(0,'rgba(90,60,20,0.9)');
        cg.addColorStop(0.6,'rgba(60,100,10,0.6)');
        cg.addColorStop(1,'rgba(40,80,0,0)');
        ctx.fillStyle=cg;
        ctx.beginPath(); ctx.ellipse(sx,sy,f.r*0.3,f.r*0.22,0,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    } else if (f.type === 'magicCircle') {
      const sx = f.x - cam.x, sy = f.y - cam.y;
      const prog = f.life/f.maxLife;
      ctx.save(); ctx.globalAlpha = 0.7*(1-prog*0.3);
      ctx.strokeStyle = `rgba(120,120,255,${0.8*(1-prog*0.2)})`;
      ctx.lineWidth = 2.5; ctx.shadowBlur=12; ctx.shadowColor='#8888ff';
      ctx.beginPath(); ctx.arc(sx,sy,f.r,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(180,180,255,0.6)'; ctx.lineWidth=1.5;
      for(let seg=0;seg<8;seg++){
        const a=seg/8*Math.PI*2+gameTime*0.8;
        ctx.beginPath(); ctx.moveTo(sx+Math.cos(a)*f.r*0.3,sy+Math.sin(a)*f.r*0.3);
        ctx.lineTo(sx+Math.cos(a)*f.r*0.9,sy+Math.sin(a)*f.r*0.9); ctx.stroke();
      }
      if(prog < 0.3) {
        ctx.globalAlpha = 0.9*(0.3-prog)/0.3;
        ctx.fillStyle='rgba(80,80,255,0.5)';
        ctx.beginPath(); ctx.arc(sx,sy,f.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    } else if (f.type === 'abyssHole') {
      const sx = f.x - cam.x, sy = f.y - cam.y;
      const hp2 = Math.max(0, f.life / f.maxLife);
      const r2 = 35 + (1-hp2)*55;
      ctx.save(); ctx.translate(sx, sy); ctx.globalAlpha = Math.min(1, hp2 * 1.2);
      const grdV = ctx.createRadialGradient(0,0,0,0,0,r2);
      grdV.addColorStop(0,'rgba(0,0,0,0.95)');
      grdV.addColorStop(0.55,'rgba(100,0,160,0.6)');
      grdV.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = grdV;
      ctx.beginPath(); ctx.arc(0,0,r2,0,Math.PI*2); ctx.fill();
      ctx.save(); ctx.rotate(gameTime*4);
      ctx.strokeStyle=`rgba(180,0,255,${hp2*0.85})`; ctx.lineWidth=2.5;
      ctx.shadowBlur=14; ctx.shadowColor='#9900ff';
      ctx.beginPath(); ctx.arc(0,0,r2*0.65,0,Math.PI*1.6); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.rotate(-gameTime*3);
      ctx.strokeStyle=`rgba(120,0,200,${hp2*0.5})`; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(0,0,r2*0.85,0,Math.PI*1.2); ctx.stroke();
      ctx.restore();
      ctx.restore();
    } else if (f.type === 'beamTelegraph') {
      const fsx=f.x-cam.x,fsy=f.y-cam.y;
      const fex=f.x+Math.cos(f.angle)*f.length-cam.x,fey=f.y+Math.sin(f.angle)*f.length-cam.y;
      const flashA=0.3+0.4*Math.abs(Math.sin(gameTime*8));
      const tR=Math.max(0,(f.timer||0)/(f.delay||0.9));
      ctx.save();
      ctx.globalAlpha=flashA*0.65; ctx.lineCap='round';
      ctx.strokeStyle=f.color; ctx.lineWidth=(f.width||18)*0.32;
      ctx.setLineDash([12,8]); ctx.shadowBlur=10; ctx.shadowColor=f.color;
      ctx.beginPath(); ctx.moveTo(fsx,fsy); ctx.lineTo(fex,fey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha=flashA*0.55; ctx.strokeStyle=f.color; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(fsx,fsy,15+flashA*10,0,Math.PI*2); ctx.stroke();
      if(tR<0.3) {
        ctx.globalAlpha=(0.3-tR)/0.3*0.85;
        ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=(f.width||18)*0.12;
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(fsx,fsy); ctx.lineTo(fex,fey); ctx.stroke();
      }
      ctx.restore();
    } else if (f.type === 'pressTelegraph') {
      const fsx=f.x-cam.x,fsy=f.y-cam.y;
      const pA=(f.life/(f.maxLife||2.5))*0.5,fl2=0.3+0.3*Math.sin(gameTime*6);
      ctx.save(); ctx.globalAlpha=pA;
      ctx.fillStyle=f.color+'33'; ctx.beginPath(); ctx.arc(fsx,fsy,f.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=pA+fl2*0.3; ctx.strokeStyle=f.color; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(fsx,fsy,f.r,0,Math.PI*2); ctx.stroke(); ctx.restore();
    } else if (f.type === 'ring' || f.type === 'explosion') {
      const sx = f.x - cam.x, sy = f.y - cam.y;
      ctx.save();
      const a = Math.min(1, alpha) * (f.type === 'explosion' ? 0.8 : 0.6);
      ctx.globalAlpha = a;
      if (f.type === 'explosion') {
        const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, f.r);
        grd.addColorStop(0, 'rgba(255,220,100,0.7)'); grd.addColorStop(0.5, 'rgba(255,100,0,0.5)');
        grd.addColorStop(1, 'rgba(200,0,0,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(sx, sy, f.r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = f.color;
        ctx.beginPath(); ctx.arc(sx, sy, f.r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    } else if (f.type === 'pop') {
      const sx = f.x - cam.x, sy = f.y - cam.y;
      const prog = 1 - alpha / 0.45;
      const r = f.r * (1 + prog * 2);
      ctx.save(); ctx.globalAlpha = alpha * 2.2;
      ctx.strokeStyle = f.color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    } else if (f.type === 'whip') {
      // ===== CUTE PAW / MEATBALL ATTACK - fully directional =====
      const sx = f.x - cam.x, sy = f.y - cam.y;
      const atkAngle = f.angle !== undefined ? f.angle : 0;
      const t2 = 1 - Math.max(0, f.life / 0.4); // 0→1 as it expands
      const maxR = f.rng * 0.55;
      const curR = maxR * (0.4 + 0.6 * t2);
      // Paw center is offset in the attack direction
      const pawCx = sx + Math.cos(atkAngle) * f.rng * 0.5;
      const pawCy = sy + Math.sin(atkAngle) * f.rng * 0.5;

      ctx.save();
      ctx.globalAlpha = alpha * 2.2;

      // Impact ring burst
      ctx.strokeStyle = '#ffbbdd'; ctx.lineWidth = 3;
      ctx.shadowBlur = 15; ctx.shadowColor = '#ff66aa';
      ctx.beginPath(); ctx.arc(pawCx, pawCy, curR * 1.3, 0, Math.PI * 2); ctx.stroke();

      // Rotate everything around the paw center to match attack direction
      // (paw "toes" always point in the attack direction)
      ctx.save();
      ctx.translate(pawCx, pawCy);
      // Rotate so paw toes face the attack direction
      // Paw toes are "up" in local space, so rotate by (atkAngle - PI/2)
      ctx.rotate(atkAngle - Math.PI / 2);

      // Main paw glow
      const grdPaw = ctx.createRadialGradient(0, 0, 0, 0, 0, curR);
      grdPaw.addColorStop(0, '#ffccdd'); grdPaw.addColorStop(0.6, '#ffaacc'); grdPaw.addColorStop(1, 'rgba(255,150,200,0)');
      ctx.fillStyle = grdPaw;
      ctx.beginPath(); ctx.arc(0, 0, curR, 0, Math.PI * 2); ctx.fill();

      // Central pad (slightly oval in local space)
      ctx.fillStyle = '#ff99bb';
      ctx.beginPath(); ctx.ellipse(0, curR*0.1, curR*0.58, curR*0.5, 0, 0, Math.PI*2); ctx.fill();

      // Toe beans - arc of 4 ovals "above" the pad (toward attack direction = up in local)
      const toeData = [
        [-curR*0.42, -curR*0.52],
        [-curR*0.16, -curR*0.65],
        [ curR*0.16, -curR*0.65],
        [ curR*0.42, -curR*0.52],
      ];
      ctx.fillStyle = '#ff88bb';
      for (const [tx2, ty2] of toeData) {
        ctx.beginPath(); ctx.ellipse(tx2, ty2, curR*0.22, curR*0.19, 0, 0, Math.PI*2); ctx.fill();
      }

      // Shine highlight
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath(); ctx.ellipse(-curR*0.15, -curR*0.1, curR*0.25, curR*0.18, -0.5, 0, Math.PI*2); ctx.fill();

      ctx.restore(); // un-rotate

      // Star sparkles (in screen space around the paw, no rotation needed)
      ctx.globalAlpha = alpha * 1.5;
      ctx.fillStyle = '#ffddee';
      for (let si = 0; si < 5; si++) {
        const sa = si / 5 * Math.PI * 2 + t2 * Math.PI;
        const sr2 = curR * (1.1 + 0.2 * Math.sin(sa * 3));
        const spx = pawCx + Math.cos(sa) * sr2 * 1.1;
        const spy = pawCy + Math.sin(sa) * sr2 * 0.85;
        ctx.font = Math.floor(12 + curR * 0.15) + 'px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✦', spx, spy);
      }
      ctx.restore();
    } else if (f.type === 'lightning') {
      ctx.save(); ctx.globalAlpha = Math.min(1, alpha * 3);
      ctx.strokeStyle = f.iceColor ? '#88ddff' : '#ffff44'; ctx.lineWidth = 3;
      ctx.shadowBlur = 22; ctx.shadowColor = f.iceColor ? '#44aaff' : '#ffff00';
      let prevX = f.ox - cam.x, prevY = f.oy - cam.y;
      for (const t of f.targets) {
        const tx2 = t.x - cam.x, ty2 = t.y - cam.y;
        const midX = (prevX + tx2) / 2 + randRange(-40, 40);
        const midY = (prevY + ty2) / 2 + randRange(-40, 40);
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.quadraticCurveTo(midX, midY, tx2, ty2);
        ctx.stroke();
        prevX = tx2; prevY = ty2;
      }
      ctx.restore();
    }

}

  // Touch joystick

    ctx.fillStyle = '#ffffff';

  // ズームインジケーター（ズームが1.0以外のとき表示）
  const _zoom = cam.zoom || 1.0;
  if (Math.abs(_zoom - 1.0) > 0.04) {

    ctx.fillText((_zoom > 1 ? '🔍 ' : '🔎 ') + Math.round(_zoom * 100) + '%', W - 42, H - 18);
    ctx.restore();
  }
}

function btSlots() {
  return bossTrialWpns.reduce((s,w)=>s+(BOSS_TRIAL_EVOLVED.includes(w)?2:1),0);
}
function btCanAdd(type) {
  const slots = btSlots();
  const cost = BOSS_TRIAL_EVOLVED.includes(type) ? 2 : 1;
  return slots + cost <= 5;
}

// ── Init trial mode ──
function initBossTrial() {
  bossTrialWpns = [];
  bossTrialBoss = 'ironbull';
  bossTrialScrollWpn = 0;
  bossTrialScrollBoss = 0;
  bossTrialState = 'weaponSelect';
  _trialDefeated = false;
  _trialDefeatTimer = 0;
  _trialStartDelay = 0;
  state = 'bossTrialSelect';
}

// ── Start the actual fight ──
function startBossTrialFight() {
  // Init a full game but heavily modified
  initGame();
  state = 'playing';
  challengeMode = false;

  // Trial mode: set far time to skip normal spawning, reset boss timer to prevent early fire
  gameTime = 99999;
  waveSystem.bossTimer = 9999;

  // Apply selected weapons (all at level 5)
  activeWeapons = bossTrialWpns.map(type => {
    const w = createWeapon(type);
    w.level = 5;
    return w;
  });

  // Remove all enemies and spawn ONLY the boss
  enemies.length = 0;

  const bossId = bossTrialBoss;
  const def = getEnemyDef(bossId);
  const hp = def.baseHp * 3;

  // Use createStageBossEnemy if it's a stage boss, else createEnemy
  const stageBossTypes = ['ironbull','elderwissp','skeletonbaron','flameking','snowdragon','kraken','mastermirror','yeti','crabgeneral','mirrormage'];
  const midBossTypes   = ['ironpig','shadowwolf','boneknight','hellknight'];
  const isStageBoss    = stageBossTypes.includes(bossId);
  const isMidBoss      = midBossTypes.includes(bossId);

  let boss;
  if (isStageBoss) {
    boss = createStageBossEnemy(bossId, hp, 1.0, true);
    boss.isFinalBoss = false; // don't trigger stage ending
  } else if (isMidBoss) {
    boss = createStageBossEnemy(bossId, hp, 0.6, true);
  } else {
    boss = spawnBossRaw(bossId, hp);
  }
  boss._trialMode = true;  // mark as trial boss
  enemies.push(boss);
  _trialStartDelay = 0.5; // grace period before defeat check

  // Set player to trial mode (no leveling from kills)
  player._trialMode = true;
  player.hp = player.maxHp = 999;

  // Setup arena if needed
  if (bossId === 'ironpig' || bossId === 'ironbull') {
    const _atype = bossId === 'ironpig' ? 'ring' : 'field';
    activateArena(0, 0, _atype);
    // Spawn boss near arena edge
    if (boss) {
      const _edgeA=Math.random()*Math.PI*2;
      boss.x = arenaX + Math.cos(_edgeA)*(arenaHW-boss.r-20);
      boss.y = arenaY + Math.sin(_edgeA)*(arenaHH-boss.r-20);
    }
  } else { deactivateArena(); }

  // Set BGM based on boss stage
  const boss_entry = BOSS_TRIAL_BOSS_LIST.find(b=>b.id===bossId);
  const stg_bgm = boss_entry ? boss_entry.stage : 'day';
  try {
    if (stg_bgm==='hell') playBGM('hell');
    else if (stg_bgm==='night') playBGM('night');
    else if (stg_bgm==='grave') playBGM('grave');
    else if (['snow','ocean','corridor'].includes(stg_bgm)) playBGM(stg_bgm);
    else playBGM('field');
  } catch(e2) {}
}

// ── Helper to spawn a boss entity ──
function spawnBossRaw(bossId, hp) {
  const def = getEnemyDef(bossId);
  const a = Math.random()*Math.PI*2;
  const e = {
    x: player.x+Math.cos(a)*300, y: player.y+Math.sin(a)*300,
    type: bossId, r: def.r||30, boss: true,
    maxHp: hp, hp,
    spd: def.spd||1.2, exp: 0, color: def.color||'#ff2244',
    dmg: Math.round((def.dmg||28)*(DIFFICULTIES[difficultyLevel]||DIFFICULTIES[1]).atkMod*1.6),
    invincible:0, flashLife:0, knockX:0, knockY:0, boss:true, slowTimer:0,
    bossPhase:1, attackTimer:1.5, attackCooldown:2.5, attackState:'idle',
    barrierActive:false, barrierTimer:0,
    takeDmg(amount, iframes, fromX, fromY) {
      const _specResult = bossSpecialTakeDmg(this, amount, iframes, fromX, fromY);
      if (_specResult === false) return false;
      if (this.invincible>0) return false;
      if (this.barrierActive && this.bossPhase===1) return false;
      this.hp -= amount; this.invincible = iframes||0; this.flashLife=0.08;
      if (fromX!==undefined){
        const dx=this.x-fromX,dy=this.y-fromY,d2=Math.sqrt(dx*dx+dy*dy)||1;
        if(!this.boss){this.knockX=(dx/d2)*80;this.knockY=(dy/d2)*80;}
      }
      if (this.hp<=this.maxHp*0.6&&this.bossPhase===1){
        this.bossPhase=2;
        this.spd*=1.5;
        this.attackCooldown*=0.45;
        this.dmg = Math.round(this.dmg*1.3);
        fxList.push({type:'text',x:this.x,y:this.y-80,text:'💢 フェーズ2！！',life:3,color:'#ff0000',vy:-30,big:true});
        for(let ri=0;ri<5;ri++) fxList.push({type:'ring',x:this.x,y:this.y,r:0,maxR:200+ri*40,life:1.2,color:ri%2?'#ff0000':'#ff8800'});
        // MirrorMage-specific: spawn clones at 50% HP
        if(this.type==='mirrormage' && !mirrorMageCloneActive) {
          spawnMirrorClones(this, 3);
          fxList.push({type:'text',x:this.x,y:this.y-100,text:'🪞 分身！どれが本物？',life:3,color:'#cc88ff',vy:-20,big:true});
        }
        try{playSFX('bossapp');}catch(e2){}
      }
      return true;
    }
  };
  return e;
}

    ctx.font = `bold 11px monospace`; ctx.textAlign='left'; ctx.textBaseline='top';
    const wname = WEAPON_NAMES[wtype]||wtype;
    ctx.fillText(wname.length>10 ? wname.slice(0,10)+'…' : wname, cx2+54, cy2+10);

    // Slot cost badge
    const cost = isEvolved ? '2スロット' : '1スロット';
    ctx.fillStyle = isEvolved ? '#ffcc44' : '#88aaff'; ctx.font='9px monospace';
    ctx.fillText(cost, cx2+54, cy2+26);

    // Evolved badge
    if (isEvolved) {
      ctx.fillStyle='rgba(255,180,0,0.2)'; rr(ctx,cx2+52,cy2+38,52,16,8); ctx.fill();
      ctx.fillStyle='#ffaa00'; ctx.font='8px monospace'; ctx.textBaseline='top';
      ctx.fillText('✨ 進化武器', cx2+54, cy2+40);
    }

    // Check mark if selected
    if (selected) {
      ctx.save(); ctx.font='20px serif'; ctx.textAlign='right'; ctx.textBaseline='top';
      ctx.fillText('✓', cx2+cardW-6, cy2+4); ctx.restore();
    }
  });

  const totalRows = Math.ceil(BOSS_TRIAL_ALL_WEAPONS.length/cols);
  const maxScroll = Math.max(0, totalRows*(cardH+gap)+contentY - H + 60);
  bossTrialScrollWpn = Math.max(0, Math.min(maxScroll, bossTrialScrollWpn));
  ctx.restore();

  // Scrollbar
  if (maxScroll>0) {
    const sbH=contentH, sbX=W-8, sbY=contentY;
    const tRatio=Math.min(1,sbH/(sbH+maxScroll));
    const tH=Math.max(24,sbH*tRatio);
    const tY=sbY+(bossTrialScrollWpn/maxScroll)*(sbH-tH);
    ctx.fillStyle='rgba(60,30,100,0.5)'; rr(ctx,sbX-4,sbY,8,sbH,4); ctx.fill();
    ctx.fillStyle='#8844cc'; rr(ctx,sbX-4,tY,8,tH,4); ctx.fill();
  }
}

    rr(ctx,cx2,cy2,cardW,cardH,10); ctx.stroke();
    if (selected) {
      ctx.save(); ctx.shadowBlur=12; ctx.shadowColor='#ff6644';
      rr(ctx,cx2,cy2,cardW,cardH,10); ctx.stroke(); ctx.restore();
    }
    // Stage color band
    ctx.fillStyle=stgColor+'55'; rr(ctx,cx2,cy2,cardW,24,10); ctx.fill();
    ctx.fillStyle=selected?'#ffcc88':'#aaaacc'; ctx.font='9px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    const stgLabel={'day':'🌿草原','night':'🌙夜','grave':'🪦墓場','hell':'🔥地獄','snow':'🏔️雪山','ocean':'🌊海','corridor':'🏛️回廊'};
    ctx.fillText(stgLabel[bentry.stage]||bentry.stage, cx2+8, cy2+12);

    // Boss sprite
    const bossImg = stageBossImgs[bentry.id]||midBossImgs[bentry.id]||hellEnemyImgs[bentry.id]||enemyImgs[bentry.id];
    if (bossImg&&bossImg.complete&&bossImg.naturalWidth>0) {
      ctx.save(); if(selected){ctx.shadowBlur=14;ctx.shadowColor='#ff6644';}
      ctx.drawImage(bossImg, cx2+6, cy2+22, 56, 60); ctx.restore();
    }

    // Name
    ctx.fillStyle = selected ? '#ffffff' : '#eeddcc';
    ctx.font = `bold 13px monospace`; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.shadowBlur = selected ? 6 : 0; ctx.shadowColor='#ff6644';
    ctx.fillText(bentry.label, cx2+68, cy2+26);
    ctx.shadowBlur=0;

    // HP info
    const def2=getEnemyDef(bentry.id);
    ctx.fillStyle=selected?'#ffaa88':'#aa8877'; ctx.font='10px monospace';
    ctx.fillText(`HP: ${(def2.baseHp*3).toLocaleString()}`, cx2+68, cy2+46);

    // Selected check
    if (selected) {
      ctx.save(); ctx.font='22px serif'; ctx.textAlign='right'; ctx.textBaseline='top';
      ctx.fillText('✓', cx2+cardW-8, cy2+6); ctx.restore();
    }
  });

  const totalRows2=Math.ceil(BOSS_TRIAL_BOSS_LIST.length/cols);
  const maxScroll2=Math.max(0,totalRows2*(cardH+gap)+contentY-H+60);
  bossTrialScrollBoss=Math.max(0,Math.min(maxScroll2,bossTrialScrollBoss));
  ctx.restore();

  // Scrollbar
  if(maxScroll2>0){
    const sbH=contentH,sbX=W-8,sbY=contentY;
    const tR=Math.min(1,sbH/(sbH+maxScroll2)),tH2=Math.max(24,sbH*tR);
    const tY2=sbY+(bossTrialScrollBoss/maxScroll2)*(sbH-tH2);
    ctx.fillStyle='rgba(80,30,20,0.5)'; rr(ctx,sbX-4,sbY,8,sbH,4); ctx.fill();
    ctx.fillStyle='#cc4422'; rr(ctx,sbX-4,tY2,8,tH2,4); ctx.fill();
  }
}

// ===== TITLE SCREEN =====
function drawTitle(dt) {
  // ── Background ────────────────────────────────────────────────────────────
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0020'); grad.addColorStop(0.6, '#1a0035'); grad.addColorStop(1, '#2a0050');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  // ── Stars ─────────────────────────────────────────────────────────────────
  for (const s of stars) {
    s.twinkle += dt * 1.8;
    ctx.fillStyle = `rgba(255,220,255,${0.4 + 0.5 * Math.sin(s.twinkle)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  // ── Rising particles ──────────────────────────────────────────────────────
  if (Math.random() < 0.2) {
    particles.push({ x: Math.random()*W, y: H+10,
      vx: (Math.random()-0.5)*0.8, vy: -1.2-Math.random()*0.8,
      life: 1, type: Math.random()<0.45?'✦':'❤️', size: 11+Math.random()*10 });
  }
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=dt*0.25;
    if(p.life<=0||p.y<-20){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life*0.7; ctx.font=p.size+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.type, p.x, p.y); ctx.globalAlpha=1;
  }

  // ── CENTERED Title logo ────────────────────────────────────────────────────
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const pulse = 1 + 0.025 * Math.sin(titleT * 3);
  ctx.translate(W / 2, 85); ctx.scale(pulse, pulse);
  for (let i = 3; i >= 0; i--) {
    ctx.shadowBlur = 30 + i*10; ctx.shadowColor = '#ff66cc';
    ctx.fillStyle = i===0 ? 'white' : `rgba(255,100,200,${0.3-i*0.07})`;
    ctx.font = `bold ${46-i*2}px "Courier New", monospace`;
    ctx.fillText('ニャンサバイバー！', 0, 0);
  }
  ctx.restore();

  // ── Subtitle (centered) ────────────────────────────────────────────────────
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=8; ctx.shadowColor='#aa44ff';
  ctx.fillStyle='#ddaaff'; ctx.font='bold 15px "Courier New", monospace';
  ctx.fillText(_subtitle, W/2, 138);
  ctx.restore();

  // ── Floating cats — full width, v32 style ─────────────────────────────────
  const catSpacing = W / CHARS.length;
  for (let i = 0; i < CHARS.length; i++) {
    const tc = titleCats[i];
    const bobY = Math.sin(titleT * 1.2 + tc.phase) * 18;
    tc.angle *= 0.96;
    tc.angle += (Math.random() - 0.5) * 0.03;

    const catX = catSpacing * i + catSpacing / 2;
    const catY = 240 + Math.sin(tc.phase * 2) * 12;

    ctx.save();
    ctx.translate(catX, catY + bobY);
    ctx.rotate(tc.angle);

    if (imgs[CHARS[i].id] && imgsLoaded > i) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(imgs[CHARS[i].id], -35, -42, 70, 80);
    } else {
      drawCatSprite(0, 5, 28, CHARS[i], 1);
    }

    // Hover highlight ring
    if (i === titleHoveredCat) {
      ctx.save();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.shadowBlur = 18; ctx.shadowColor = '#ff88ff';
      ctx.globalAlpha = 0.8 + 0.2 * Math.sin(titleT * 8);
      ctx.beginPath(); ctx.arc(0, 0, 52, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // Name tag
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    rr(ctx, -34, 40, 68, 18, 9); ctx.fill();
    ctx.fillStyle = i === titleHoveredCat ? '#ffff88' : '#ffffff';
    ctx.font = (i === titleHoveredCat ? 'bold ' : '') + '11px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowBlur = i === titleHoveredCat ? 8 : 0; ctx.shadowColor = '#ffff44';
    ctx.fillText(CHARS[i].name, 0, 49);
    ctx.restore();
    ctx.restore();
  }

  // ── Cat hover tooltip ─────────────────────────────────────────────────────
  if (titleHoveredCat >= 0) {
    const hc = CHARS[titleHoveredCat];
    const ttW = 340, ttX = W/2 - ttW/2, ttY = 320, ttH = 64;
    ctx.save(); ctx.globalAlpha=0.92;
    ctx.fillStyle='rgba(20,0,40,0.94)'; rr(ctx,ttX,ttY,ttW,ttH,12); ctx.fill();
    ctx.strokeStyle='#cc88ff'; ctx.lineWidth=1.5; rr(ctx,ttX,ttY,ttW,ttH,12); ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='#ffddff'; ctx.font='bold 14px monospace';
    ctx.fillText(`${hc.name}  [${hc.type}]`, ttX+10, ttY+7);
    ctx.fillStyle='#aaaacc'; ctx.font='11px monospace';
    ctx.fillText(hc.desc, ttX+10, ttY+27);
    const wnames={orbit:'⚪ オービット',shield:'🛡️ シールド',rapid:'💥 ラピッド',triple:'🎯 トリプル',aura:'🌑 ダークオーラ'};
    ctx.fillStyle='#88ccff'; ctx.font='10px monospace';
    ctx.fillText('武器: '+(wnames[hc.wpn]||hc.wpn), ttX+10, ttY+45);
    ctx.restore();
  }

  // ── Ready info bar (above start button) ───────────────────────────────────
  if (readyToPlay) {
    const stgInfo=STAGES[selectedStage]||STAGES[0];
    const charInfo=CHARS[selChar];
    const diffInfo=DIFFICULTIES[difficultyLevel]||DIFFICULTIES[1];
    const ibW=Math.min(480, W-60), ibX=(W-ibW)/2, ibY=H-196;
    ctx.save();
    ctx.fillStyle='rgba(20,0,50,0.92)'; rr(ctx,ibX,ibY,ibW,42,12); ctx.fill();
    ctx.strokeStyle='#aa44ff'; ctx.lineWidth=1.5; rr(ctx,ibX,ibY,ibW,42,12); ctx.stroke();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#ffddff'; ctx.font='bold 12px monospace';
    const wn={orbit:'オービット',shield:'シールド',rapid:'ラピッド',triple:'トリプル',aura:'ダークオーラ'};
    ctx.fillText(`${stgInfo.name}  /  ${charInfo.name} [${charInfo.type}]  武器:${wn[charInfo.wpn]||charInfo.wpn}`, ibX+ibW/2, ibY+13);
    // Difficulty badge
    ctx.fillStyle = diffInfo.color; ctx.font='bold 11px monospace';
    ctx.fillText(`${diffInfo.icon} 難易度: ${diffInfo.name}`, ibX+ibW/2, ibY+30);
    ctx.restore();
  }

  // ── START button (centered, narrower) ─────────────────────────────────────
  const _sW = Math.min(480, W-60), _sH = 52, _sX = (W-Math.min(480,W-60))/2, _sY = H - 148;
  const _sHov = lastMX>=_sX&&lastMX<=_sX+_sW&&lastMY>=_sY&&lastMY<=_sY+_sH;
  const _pulse2 = 1 + 0.05*Math.sin(titleT*4);
  ctx.save();
  ctx.translate(_sX+_sW/2, _sY+_sH/2);
  ctx.scale(_sHov?1.02:_pulse2, _sHov?1.02:_pulse2);
  const _sGrad = ctx.createLinearGradient(-_sW/2,-_sH/2,-_sW/2,_sH/2);
  _sGrad.addColorStop(0, _sHov?'#ff55bb':'#dd3399');
  _sGrad.addColorStop(1, _sHov?'#cc2288':'#aa1166');
  ctx.fillStyle=_sGrad; rr(ctx,-_sW/2,-_sH/2,_sW,_sH,24); ctx.fill();
  ctx.shadowBlur=_sHov?32:16; ctx.shadowColor='#ff66cc';
  ctx.strokeStyle=_sHov?'#ffccee':'#ff88cc'; ctx.lineWidth=_sHov?2.5:2;
  rr(ctx,-_sW/2,-_sH/2,_sW,_sH,24); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='white'; ctx.font='bold 21px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(readyToPlay?'🎮 ゲームスタート！ [SPACE]':'🎮 ゲームスタート / キャラ・マップを選ぶ', 0, 0);
  ctx.restore();

  // ── BOTTOM ROW: 6 buttons across the full width ────────────────────────────
  const _bH=40, _bY=H-88, _bGap=6;
  const _bbtns=[
    {txt:'⚔️ ボス試練',    bg:'rgba(50,12,5,0.94)',  stroke:'#cc3300', tc:'#ffaa88', glow:'#ff4400'},
    {txt:'🏆 実績',        bg:'rgba(50,35,5,0.94)',  stroke:'#cc9900', tc:'#ffee88', glow:'#ffcc00'},
    {txt:'📋 遊び方',     bg:'rgba(15,55,15,0.94)',  stroke:'#449944', tc:'#aaffaa', glow:'#44cc44'},
    {txt:'🛒 ショップ',    bg:'rgba(50,35,8,0.94)',  stroke:'#cc8800', tc:'#ffe88a', glow:'#cc9900'},
    {txt:'📖 各種ガイド', bg:'rgba(40,18,70,0.94)', stroke:'#8855aa', tc:'#ddbbff', glow:'#aa66ff'},
    {txt:'📝 更新履歴',  bg:'rgba(8,28,60,0.94)',   stroke:'#4488cc', tc:'#aaddff', glow:'#4488cc'},
  ];
  const _bW = Math.floor((W - _bGap*(_bbtns.length-1) - 16) / _bbtns.length);
  _bbtns.forEach((b, bi) => {
    const bx = 8 + bi*(_bW+_bGap), by = _bY;
    const h = lastMX>=bx&&lastMX<=bx+_bW&&lastMY>=by&&lastMY<=by+_bH;
    ctx.save();
    if(h){ ctx.shadowBlur=14; ctx.shadowColor=b.glow; }
    ctx.fillStyle = h ? b.bg.replace('0.94','1.0') : b.bg;
    rr(ctx,bx,by,_bW,_bH,20); ctx.fill();
    ctx.strokeStyle = h?'#ffffff':b.stroke; ctx.lineWidth = h?2:1.5;
    rr(ctx,bx,by,_bW,_bH,20); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle = h?'#ffffff':b.tc;
    ctx.font = (h?'bold ':'') + '11px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.txt, bx+_bW/2, by+_bH/2);
    ctx.restore();
  });

  // ── Second bottom row: BGM changer (left) + coin display (right) ──────────
  const _r2Y = H - 40;
  // BGM changer - compact, bottom-left area
  drawTitleBGMChanger();
  // Coin display - bottom-right
  ctx.save();
  ctx.fillStyle='rgba(40,30,0,0.88)'; rr(ctx,W-162,_r2Y,154,30,15); ctx.fill();
  ctx.strokeStyle='#aa8800'; ctx.lineWidth=1.2; rr(ctx,W-162,_r2Y,154,30,15); ctx.stroke();
  ctx.fillStyle='#ffdd44'; ctx.font='bold 13px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('💰 '+shopCoins+' コイン', W-85, _r2Y+15);
  ctx.restore();

  // ── Version badge ──────────────────────────────────────────────────────────
  ctx.save();
  ctx.fillStyle='rgba(100,80,130,0.5)'; ctx.font='9px monospace';
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('v'+GAME_VERSION+' 🐾', 6, H-2);
  ctx.restore();

  // Settings gear button top-right
  drawGearButton(W-24, 24, 18);
  drawAchievementToast();
}

// ===== CHARACTER SELECT =====
function drawSelect() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0025'); grad.addColorStop(1, '#1a003a');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.fillStyle = 'rgba(200,180,255,0.18)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowBlur = 20; ctx.shadowColor = '#ff66cc';
  ctx.fillStyle = '#ffddff'; ctx.font = 'bold 32px monospace';
  ctx.fillText('🐱 キャラクターせんたく 🐱', W / 2, 40);
  ctx.restore();

  const char = CHARS[selChar];
  const cardX = W / 2 - 245, cardY = 68, cardW = 490, cardH = 418;

  ctx.fillStyle = 'rgba(0,0,0,0.4)'; rr(ctx, cardX + 5, cardY + 5, cardW, cardH, 20); ctx.fill();

  cGrad.addColorStop(0, '#2a0050'); cGrad.addColorStop(1, '#1a0035');
  ctx.fillStyle = cGrad; rr(ctx, cardX, cardY, cardW, cardH, 20); ctx.fill();
  ctx.strokeStyle = '#aa44ff'; ctx.lineWidth = 2;
  rr(ctx, cardX, cardY, cardW, cardH, 20); ctx.stroke();

  // Image panel — pixel art, no bg fill, no border frame
  const imgX = cardX + 18, imgY = cardY + 18, imgW = 185, imgH = 220;
  if (imgs[char.id] && imgsLoaded === CHARS.length) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(imgs[char.id], imgX, imgY, imgW, imgH);
  } else {

  const infoX = cardX + 220, infoY = cardY + 22;

  ctx.fillStyle = '#aa44ff'; rr(ctx, infoX, infoY + 36, 95, 22, 10); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';

  ctx.fillStyle = '#ccaaff'; ctx.font = '13px monospace';
  ctx.fillText(char.desc, infoX, infoY + 72);

  // Stat bars

    { label: '体力 HP', val: char.hp / 150, color: '#ff5555' },
    { label: 'スピード', val: (char.spd - 1.5) / 2.2, color: '#55ff55' },
    { label: '攻撃力', val: char.atk / 1.5, color: '#ffaa44' },
  ];
  stats.forEach((st, i) => {
    const by = infoY + 110 + i * 44;
    ctx.fillStyle = '#aaaacc'; ctx.font = '12px monospace'; ctx.textBaseline = 'top';
    ctx.fillText(st.label, infoX, by);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ctx, infoX, by + 18, 250, 16, 8); ctx.fill();
    ctx.fillStyle = st.color;
    rr(ctx, infoX, by + 18, 250 * Math.min(st.val, 1), 16, 8); ctx.fill();
  });

  // Weapon
  const wnames = { orbit:'⚪ オービット', shield:'🛡️ シールド', rapid:'💥 ラピッドファイア', triple:'🎯 トリプルショット', aura:'🌑 ダークオーラ' };
  ctx.fillStyle = '#88ccff'; ctx.font = '13px monospace'; ctx.textBaseline = 'top';
  ctx.fillText('初期武器: ' + (wnames[char.wpn] || char.wpn), infoX, infoY + 250);

  // Character icons row
  const dotY = cardY + cardH - 75;
  for (let i = 0; i < CHARS.length; i++) {
    const active = i === selChar;
    ctx.fillStyle = active ? `rgba(255,160,255,${0.7 + 0.25 * Math.sin(titleT * 4)})` : '#554466';
    ctx.beginPath(); ctx.arc(W / 2 - (CHARS.length - 1) * 17 + i * 34, dotY, active ? 10 : 7, 0, Math.PI * 2); ctx.fill();
  }

  // Start button
  const btnX = W / 2 - 120, btnY = dotY + 18;
  const _decH = lastMX>=btnX&&lastMX<=btnX+240&&lastMY>=btnY&&lastMY<=btnY+46;
  ctx.save();
  ctx.shadowBlur = _decH?30:20; ctx.shadowColor = '#ff44aa';
  ctx.fillStyle = _decH?`hsl(320,85%,55%)`:`hsl(320,70%,${40+10*Math.sin(titleT*3)}%)`;
  rr(ctx, btnX, btnY, 240, 46, 23); ctx.fill();
  ctx.strokeStyle = _decH?'#ffffff':'#ff88cc'; ctx.lineWidth = _decH?2.5:2;
  rr(ctx, btnX, btnY, 240, 46, 23); ctx.stroke();
  ctx.fillStyle = 'white'; ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('✨ けってい！ ✨', W / 2, btnY + 23);
  ctx.restore();

  // Nav arrows
  const _laH=lastMX>=cardX-50&&lastMX<=cardX-6&&lastMY>=cardY+cardH/2-30&&lastMY<=cardY+cardH/2+30;
  const _raH=lastMX>=cardX+cardW+6&&lastMX<=cardX+cardW+50&&lastMY>=cardY+cardH/2-30&&lastMY<=cardY+cardH/2+30;
  ctx.save(); ctx.font = 'bold 38px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle=_laH?'#ffffff':'#cc88ff'; ctx.shadowBlur=_laH?16:10; ctx.shadowColor='#aa44ff';
  ctx.fillText('◀', cardX - 28, cardY + cardH / 2);
  ctx.fillStyle=_raH?'#ffffff':'#cc88ff'; ctx.shadowBlur=_raH?16:10;
  ctx.fillText('▶', cardX + cardW + 28, cardY + cardH / 2);
  ctx.restore();
  // Back to title
  const _bkSH=lastMX>=W/2-70&&lastMX<=W/2+70&&lastMY>=H-34&&lastMY<=H-8;
  ctx.save();
  ctx.fillStyle=_bkSH?'rgba(120,60,160,0.97)':'rgba(80,40,100,0.85)';
  rr(ctx, W/2-70, H-34, 140, 26, 13); ctx.fill();
  ctx.strokeStyle=_bkSH?'#cc88ff':'#884499'; ctx.lineWidth=_bkSH?2:1.2;
  rr(ctx, W/2-70, H-34, 140, 26, 13); ctx.stroke();
  ctx.fillStyle=_bkSH?'#ffffff':'#ccaadd'; ctx.font='12px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('← タイトルに戻る', W/2, H-21); ctx.restore();
}

function drawLevelUp() {
  drawBG();
  drawPuddlesAndTornados();
  drawGems();
  drawWeapons();
  drawEnemies();
  drawPlayer();
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);

  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowBlur = 30; ctx.shadowColor = '#ffff44';
  ctx.fillStyle = '#ffff44'; ctx.font = 'bold 38px monospace';
  ctx.fillText('⭐ LEVEL UP! ⭐', W / 2, 78);
  ctx.fillStyle = '#ffffff'; ctx.font = '18px monospace';
  ctx.fillText(`Lv.${player.level} アップグレードをえらんでね！`, W / 2, 116);
  ctx.restore();

  const count = lvlChoices.length;
  const cardW = 195, cardH = 230, gap = 16;
  const totalW = count * cardW + (count - 1) * gap;
  const startX = W / 2 - totalW / 2;

  lvlChoices.forEach((u, i) => {
    const cx2 = startX + i * (cardW + gap), cy2 = 144;
    const isHovered = lastMX >= cx2 && lastMX < cx2 + cardW && lastMY >= cy2 && lastMY < cy2 + cardH;

    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(ctx, cx2 + 4, cy2 + 4, cardW, cardH, 16); ctx.fill();
    const cg = ctx.createLinearGradient(cx2, cy2, cx2, cy2 + cardH);
    cg.addColorStop(0, isHovered ? '#3a0068' : '#2a0055');
    cg.addColorStop(1, isHovered ? '#220044' : '#1a0033');
    ctx.fillStyle = cg; rr(ctx, cx2, cy2, cardW, cardH, 16); ctx.fill();
    ctx.strokeStyle = isHovered ? '#ffaaff' : '#aa44ff'; ctx.lineWidth = isHovered ? 2.5 : 2;
    rr(ctx, cx2, cy2, cardW, cardH, 16); ctx.stroke();

    // Try weapon SVG icon
    const wImgKey = u.iconKey || null;
    const wImg = wImgKey ? weaponIconImgs[wImgKey] : null;
    if (wImg && wImg.complete && wImg.naturalWidth > 0) {
      ctx.drawImage(wImg, cx2 + cardW/2 - 22, cy2 + 30, 44, 44);
      // Level up arrow
      ctx.fillStyle = '#88ff44'; ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⬆ Lv.UP', cx2+cardW/2, cy2+82);
    } else {
      ctx.font = '44px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(u.icon, cx2 + cardW / 2, cy2 + 58);
    }

    ctx.save(); ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px monospace';
    ctx.fillText('[' + (i + 1) + ']', cx2 + cardW / 2, cy2 + 22); ctx.restore();

    ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = '#ff88cc';
    ctx.fillStyle = '#ffddff'; ctx.font = 'bold 14px monospace';
    ctx.fillText(u.name, cx2 + cardW / 2, cy2 + 110); ctx.restore();

    ctx.fillStyle = '#aaaacc'; ctx.font = '12px monospace';
    const words = u.desc.split('、');
    words.forEach((w, wi) => ctx.fillText(w, cx2 + cardW / 2, cy2 + 140 + wi * 18));
  });

  ctx.fillStyle = '#777777'; ctx.font = '13px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('1 / 2 / 3 キーかクリックでえらぼう！', W / 2, H - 18);
}

function drawBlueChestScreen() {
  // Dimmed game background
  drawGame();
  ctx.fillStyle='rgba(0,10,30,0.78)'; ctx.fillRect(0,0,W,H);

  // Panel
  const pw=520, ph=340, px2=(W-pw)/2, py2=(H-ph)/2;
  ctx.save();
  ctx.fillStyle='rgba(5,20,60,0.97)';
  rr(ctx,px2,py2,pw,ph,22); ctx.fill();
  ctx.strokeStyle='#4499ff'; ctx.lineWidth=2.5;
  rr(ctx,px2,py2,pw,ph,22); ctx.stroke();

  // Glow border pulse
  ctx.shadowBlur=22+Math.sin(gameTime*3)*6;
  ctx.shadowColor='#2266cc';
  ctx.strokeStyle='rgba(80,160,255,0.35)'; ctx.lineWidth=6;
  rr(ctx,px2-3,py2-3,pw+6,ph+6,24); ctx.stroke();
  ctx.shadowBlur=0;

  // Title
  ctx.fillStyle='#aaddff'; ctx.font='bold 22px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=12; ctx.shadowColor='#4488ff';
  ctx.fillText('📦 ボス前：ステータス強化！', W/2, py2+36);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(100,160,255,0.5)'; ctx.fillRect(px2+20,py2+56,pw-40,1);

  if (!blueChestChoices) return;
  const _cw=140, _ch=160, _gap=20;
  const _total = blueChestChoices.length * _cw + (blueChestChoices.length-1)*_gap;
  const _startX = W/2 - _total/2;

  blueChestChoices.forEach((ch, ci) => {
    const _cx = _startX + ci*(_cw+_gap);
    const _cy = py2 + 80;
    const _mx = (lastMX||0) - _cx, _my = (lastMY||0) - _cy;
    const _hover = _mx>=0&&_mx<=_cw&&_my>=0&&_my<=_ch;

    ctx.save();
    ctx.fillStyle = _hover ? 'rgba(30,80,160,0.95)' : 'rgba(10,40,100,0.88)';
    rr(ctx,_cx,_cy,_cw,_ch,14); ctx.fill();
    ctx.strokeStyle = _hover ? '#88ccff' : '#3366aa';
    ctx.lineWidth = _hover ? 2.5 : 1.8;
    rr(ctx,_cx,_cy,_cw,_ch,14); ctx.stroke();

    if(_hover){ ctx.shadowBlur=18; ctx.shadowColor='#4488ff'; }
    ctx.fillStyle='#ffffff'; ctx.font='bold 32px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ch.icon, _cx+_cw/2, _cy+50);
    ctx.shadowBlur=0;
    ctx.fillStyle='#cce8ff'; ctx.font='bold 13px monospace';
    ctx.fillText(ch.name, _cx+_cw/2, _cy+90);
    ctx.fillStyle='rgba(180,220,255,0.8)'; ctx.font='11px monospace';
    // word wrap desc
    const _words=ch.desc.split(''); let _line='';
    let _ly=_cy+113;
    for(const _c of ch.desc){
      _line+=_c;
      if(ctx.measureText(_line).width>_cw-16){ ctx.fillText(_line.slice(0,-1),_cx+_cw/2,_ly); _ly+=16; _line=_c; }
    }
    if(_line) ctx.fillText(_line,_cx+_cw/2,_ly);
    ctx.restore();
  });

  ctx.fillStyle='rgba(120,180,255,0.55)'; ctx.font='12px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('クリックで選択', W/2, py2+ph-22);
  ctx.restore();
}

  ctx.fillStyle='#aaddff'; ctx.font='bold 22px monospace';

  ctx.shadowBlur=16; ctx.shadowColor='#4488ff';
  ctx.fillText('📝 更新履歴', W/2, 27);
  ctx.shadowBlur=0;

  // Back button (top-right, same as guide screen)
  const _lbH=(lastMX>=W-122&&lastMX<=W-8&&lastMY>=8&&lastMY<=38);
  ctx.save();
  ctx.fillStyle=_lbH?'rgba(40,20,80,0.98)':'rgba(20,10,50,0.88)';
  rr(ctx,W-122,8,114,30,15); ctx.fill();
  ctx.strokeStyle=_lbH?'#cc88ff':'#4488cc'; ctx.lineWidth=_lbH?2:1.2;
  rr(ctx,W-122,8,114,30,15); ctx.stroke();
  ctx.fillStyle=_lbH?'#ffffff':'#aaddff'; ctx.font='bold 12px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('← タイトルへ', W-65, 23);
  ctx.restore();

  // Content area with clip
  const _contentY = 58, _contentH = H - _contentY - 10;

  // ── PRE-PASS: compute total content height for accurate scrollbar ──────────
  let _totalContentH = 12;
  const _lh=20, _pad=22;
  for(const ver of UPDATE_LOG){
    _totalContentH += 34 + ver.entries.length * _lh + 14;
  }
  _logMaxScroll = Math.max(0, _totalContentH - _contentH + 10);
  _logScroll = Math.min(_logScroll, _logMaxScroll);

  // ── DRAW PASS ──────────────────────────────────────────────────────────────
  ctx.save();
  ctx.beginPath(); ctx.rect(0, _contentY, W-14, _contentH); ctx.clip();

  let _y = _contentY + 12 - _logScroll;
  for(const ver of UPDATE_LOG){
    if(_y + 34 + ver.entries.length*_lh + 14 < _contentY - 4){ _y += 34 + ver.entries.length*_lh + 14; continue; }
    if(_y > H+10) { _y += 34 + ver.entries.length*_lh + 14; continue; }
    if(_y + 34 > _contentY - 4){
      ctx.fillStyle=ver.color; ctx.font='bold 17px monospace';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.shadowBlur=8; ctx.shadowColor=ver.color;
      ctx.fillText(`${ver.ver}${ver.date?' ('+ver.date+')':''}`, _pad, _y+10);
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(100,160,255,0.3)';
      ctx.fillRect(_pad,_y+22,W-_pad*2-10,1);
    }
    _y += 34;
    for(const entry of ver.entries){
      if(_y > _contentY-4 && _y < H+5){
        ctx.fillStyle='rgba(200,230,255,0.85)'; ctx.font='12px monospace';
        ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(entry, _pad+12, _y);
      }
      _y += _lh;
    }
    _y += 14;
  }
  ctx.restore();

  // Scrollbar (same pattern as guide screen)
  if(_logMaxScroll > 0){
    const sbX3=W-7, sbH3=_contentH;
    const tR=Math.min(1,sbH3/(sbH3+_logMaxScroll));
    const tH3=Math.max(24,sbH3*tR);
    const tY3=_contentY+(_logScroll/_logMaxScroll)*(sbH3-tH3);
    ctx.fillStyle='rgba(60,30,100,0.45)'; rr(ctx,sbX3-5,_contentY,10,sbH3,5); ctx.fill();
    ctx.fillStyle='#9944cc'; rr(ctx,sbX3-5,tY3,10,tH3,5); ctx.fill();
  }
}

let introT = 0;
let introScene = 0;
const INTRO_SCENES = [
  { dur: 2.8,  type: 'logo' },
  { dur: 4.0,  type: 'cats',    text: 'のどかな草原に\nかわいいねこたちがいた…' },
  { dur: 4.0,  type: 'enemies', text: 'ところが突然、\nあやしいモンスターが！！' },
  { dur: 3.2,  type: 'tagline', text: 'さあ、ねこたちよ\n戦えー！！' },
];
let introDone = false;

function updateIntro(dt) {
  introT += dt;
  const scene = INTRO_SCENES[introScene];
  if (!scene) { skipIntro(); return; }
  if (introT >= scene.dur) { introT = 0; introScene++; if (introScene >= INTRO_SCENES.length) skipIntro(); }
}

function skipIntro() { introDone = true; state = 'title'; ensureAudio(); playHomeBGM(); }

// ── イントロパーティクル ────────────────────────────────────────────────────
const _iP = [];
function _iSparkle(x, y, color, n=4) {
  for (let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*90;
    _iP.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7+Math.random()*0.6,maxLife:1.3,r:1.5+Math.random()*3,color});}
}
function _iUpdateP(dt) {
  for(let i=_iP.length-1;i>=0;i--){const p=_iP[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.life-=dt;
    if(p.life<=0){_iP.splice(i,1);continue;}
    const a=Math.max(0,p.life/p.maxLife);
    ctx.save();ctx.globalAlpha=a*0.88;ctx.fillStyle=p.color;ctx.shadowBlur=5;ctx.shadowColor=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);ctx.fill();ctx.restore();}
}

  const scene = INTRO_SCENES[introScene];

  if (scene.type==='logo') {

    const bgG=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);

      const sx=((i*173.5+t*90)%(W+100))-50,sy=(i*67.3)%H,len=28+i*7;

    ctx.beginPath();ctx.arc(sunX,sunY,34,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // 雲
    [[120,52,1.0],[295,36,0.85],[525,65,1.1],[685,42,0.9]].forEach(([cx2,cy2,sc2])=>{

    // 遠景の丘
    ctx.fillStyle='#7ab648';ctx.beginPath();ctx.moveTo(0,H*0.58);
    ctx.quadraticCurveTo(W*0.25,H*0.43,W*0.5,H*0.56);ctx.quadraticCurveTo(W*0.75,H*0.46,W,H*0.53);

    // 草原
    const gG=ctx.createLinearGradient(0,H*0.65,0,H);

      ctx.save();ctx.globalAlpha=0.26*ease;ctx.fillStyle='rgba(0,0,0,0.5)';

      ctx.drawImage(eI,ex2-ed.size/2,ey2,ed.size,ed.size);ctx.restore();
    });
    // ボス降下

      const bSc=90+Math.sin(t*2.8)*9,bTY=gY-bSc*1.05,bSY=-bSc*1.8,bX2=W-115,bY2=bSY+(bTY-bSY)*bE;
      if(bP>0){
        if(bE>0.3){ctx.save();ctx.globalAlpha=0.33*bE;
          const baG=ctx.createRadialGradient(bX2,bY2+bSc*0.5,0,bX2,bY2+bSc*0.5,bSc*1.3);
          baG.addColorStop(0,'rgba(255,30,0,0.8)');baG.addColorStop(1,'transparent');
          ctx.fillStyle=baG;ctx.beginPath();ctx.arc(bX2,bY2+bSc*0.5,bSc*1.3,0,Math.PI*2);ctx.fill();ctx.restore();}
        ctx.save();ctx.globalAlpha=0.24*bE;ctx.fillStyle='rgba(0,0,0,0.5)';
        ctx.beginPath();ctx.ellipse(bX2,gY+7,bSc*0.45,8,0,0,Math.PI*2);ctx.fill();ctx.restore();
        ctx.save();ctx.globalAlpha=bE;ctx.shadowBlur=50;ctx.shadowColor='#ff0022';
        ctx.drawImage(bI,bX2-bSc/2,bY2,bSc,bSc*1.1);ctx.restore();
        if(bP>0.84&&bP<0.99) for(let dp=0;dp<5;dp++) _iSparkle(bX2+(Math.random()-0.5)*38,gY-5,'#ff4400',1);
      }
    }
    _iUpdateP(1/60);
    // テキスト
    ctx.save();ctx.globalAlpha=Math.min(1,t*1.25);
    const tbG3=ctx.createLinearGradient(0,H-84,0,H-20);
    tbG3.addColorStop(0,'rgba(60,0,0,0.9)');tbG3.addColorStop(1,'rgba(28,0,0,0.8)');
    ctx.fillStyle=tbG3;rr(ctx,W/2-246,H-84,492,66,16);ctx.fill();
    ctx.strokeStyle=`rgba(255,${Math.round(28+Math.sin(t*8)*14)},28,0.88)`;ctx.lineWidth=2;
    rr(ctx,W/2-246,H-84,492,66,16);ctx.stroke();
    ctx.fillStyle=`hsl(0,100%,${60+12*Math.sin(t*7)}%)`;
    ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    scene.text.split('\n').forEach((l,li)=>ctx.fillText(l,W/2,H-59+li*23));ctx.restore();

  } else if (scene.type==='tagline') {
    // フィナーレ
    const bgG3=ctx.createLinearGradient(0,0,0,H);
    bgG3.addColorStop(0,'#08001a');bgG3.addColorStop(0.5,'#120028');bgG3.addColorStop(1,'#1a0030');
    ctx.fillStyle=bgG3;ctx.fillRect(0,0,W,H);
    // 星
    for(let si=0;si<65;si++){
      const bri=0.3+0.7*Math.abs(Math.sin(introT*3.5+si*0.8));
      ctx.save();ctx.globalAlpha=bri;ctx.fillStyle=`hsl(${270+si*6},80%,${80+si%20}%)`;
      ctx.shadowBlur=4;ctx.shadowColor=`hsl(${270+si*6},90%,90%)`;
      ctx.beginPath();ctx.arc((si*97.3)%W,(si*61.7)%H,0.8+si%3*0.6,0,Math.PI*2);ctx.fill();ctx.restore();
    }

      ['#ff88cc','#ffcc44','#88ffcc','#cc88ff'][Math.floor(Math.random()*4)],1);
    _iUpdateP(1/60);
    // 放射光
    for(let ri=0;ri<8;ri++){
      const ra=ri*(Math.PI/4)+introT*0.3;
      ctx.save();ctx.globalAlpha=0.06+0.04*Math.sin(introT*5+ri);

      ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(ra)*W,H/2+Math.sin(ra)*H);ctx.stroke();ctx.restore();
    }
    // 全猫
    CHARS.forEach((ch,i)=>{
      const total=CHARS.length,cx2=W*(i+1)/(total+1),cy2=H*0.52;
      const bob5=Math.sin(introT*4+i*1.2)*8,sc3=0.88+0.12*Math.sin(introT*3.5+i);
      if(imgs[ch.id]&&imgsLoaded>i){
        ctx.save();ctx.imageSmoothingEnabled=false;
        ctx.translate(cx2,cy2+bob5);ctx.scale(sc3,sc3);

    scene.text.split('\n').forEach((l,li)=>ctx.fillText(l,W/2,H*0.82+li*36));
