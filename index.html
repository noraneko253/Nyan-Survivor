  }

  ctx.restore();
  ctx.save();ctx.globalAlpha=0.5+0.2*Math.sin(introT*4);
  ctx.fillStyle='#886699';ctx.font='11px monospace';
  ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText('タップ / クリック / Space でスキップ',W-10,H-6);
  ctx.restore();
}

// ===== EVENT HANDLERS =====
function updateTitleHover(mx, my) {
  titleHoveredCat = -1;
  const catSpacing = W / CHARS.length;
  for (let i = 0; i < CHARS.length; i++) {
    const tc = titleCats[i];
    const bobY = Math.sin(titleT * 1.2 + tc.phase) * 18;
    const catX = catSpacing * i + catSpacing / 2;
    const catY = 240 + Math.sin(tc.phase * 2) * 12;
    if (dist(mx, my, catX, catY + bobY) < 56) { titleHoveredCat = i; break; }
  }
}

function onClick(mx, my) {
  // 管理者バークリック（playing中、他の処理より先に）
  if (_adminMode && state === 'playing') {
    if (handleAdminBarClick(mx, my)) return;
  }
  if (state === 'intro') {
    skipIntro(); return;
  }
  if (state === 'title') {
    ensureAudio();
    // Gear settings button (top-right: W-42 to W-6, y 6-42)
    if(mx>=W-42&&mx<=W-6&&my>=6&&my<=42){playSFX('click');_settingsFrom='title';state='settings';return;}
    // ── START button: full width, H-148 to H-96 ──────────────────────────
    const _sW=W-28, _sX=14, _sY=H-148, _sH=52;
    if (readyToPlay && mx>=_sX&&mx<=_sX+_sW&&my>=_sY&&my<=_sY+_sH) {
      playSFX('levelup'); initGame(); state='playing'; return;
    }
    if (!readyToPlay && mx>=_sX&&mx<=_sX+_sW&&my>=_sY&&my<=_sY+_sH) {
      playSFX('click'); state='select'; return;
    }

    // ── Bottom row of 6 buttons: H-88 to H-48 ───────────────────────────
    const _bH=40, _bY=H-88, _bGap=6;
    const _bW=Math.floor((W-_bGap*5-16)/6);
    const _actions=['bossTrial','achievements','howtoplay','shop','guide','updatelog'];
    if (my>=_bY && my<=_bY+_bH) {
      for(let bi=0; bi<6; bi++){
        const bx=8+bi*(_bW+_bGap);
        if(mx>=bx&&mx<=bx+_bW){
          playSFX('click');
          const a=_actions[bi];
          if(a==='bossTrial'){ initBossTrial(); return; }
          if(a==='achievements'){ state='achievements'; return; }
          if(a==='howtoplay'){ state='howtoplay'; return; }
          if(a==='shop'){ state='shop'; return; }
          if(a==='guide'){ guideFrom='title'; state='guide'; guideState.scroll=0; return; }
          if(a==='updatelog'){ state='updatelog'; return; }
        }
      }
    }

    // ── BGM changer (bottom-left, H-40 to H-10) ─────────────────────────
    if (handleTitleBGMClick(mx, my)) return;

    // ── Floating cat click ───────────────────────────────────────────────
    const catSpacing = W / CHARS.length;
    for (let i = 0; i < CHARS.length; i++) {
      const tc = titleCats[i];
      const bobY = Math.sin(titleT * 1.2 + tc.phase) * 18;
      const catX = catSpacing * i + catSpacing / 2;
      const catY = 240 + Math.sin(tc.phase * 2) * 12;
      if (dist(mx, my, catX, catY + bobY) < 56) {
        playSFX('click'); selChar = i; state = 'select'; return;
      }
    }
    // Anywhere else above the buttons → select screen
    if (my < H - 148 && my > 160) { state = 'select'; }
  } else if (state === 'stageselect') {
    // Stage card click – MUST include scroll offset to correctly map click to card
    const cardW = 210, cardH = 300, gap = 22;
    const totalW = STAGES.length*cardW + (STAGES.length-1)*gap;
    const maxScroll2 = Math.max(0, totalW - W + 40);
    const clampedScroll = Math.max(-maxScroll2/2, Math.min(maxScroll2/2, stageScrollX));
    const startX = W/2 - totalW/2 + clampedScroll;
    for (let i=0; i<STAGES.length; i++) {
      const cx2 = startX + i*(cardW+gap), cy2 = 80;
      if (mx >= cx2 && mx < cx2+cardW && my >= cy2 && my < cy2+cardH) {
        selectedStage = i;
        break;
      }
    }
    // Next button
    const btnY2 = H-110;
    if (mx >= W/2-190 && mx <= W/2+40 && my >= btnY2 && my <= btnY2+44) { readyToPlay = true; state = 'difficulty'; }
    // Challenge button
    if (mx >= W/2+50 && mx <= W/2+190 && my >= btnY2 && my <= btnY2+44) { initChallenge(); }
    // (duplicate challenge button removed)
    // Scroll arrows
    // Right arrow → scroll right (cards move left = stageScrollX increases)
    if (mx >= W-46 && mx <= W-10 && my >= H/2-24 && my <= H/2+24) stageScrollX += 230;
    // Left arrow → scroll left (cards move right = stageScrollX decreases)
    if (mx >= 10 && mx <= 46 && my >= H/2-24 && my <= H/2+24) stageScrollX -= 230;
    // Scrollbar track click
    const sbW2 = Math.min(W-80, 400), sbX2 = W/2-sbW2/2, sbY2 = H-140;
    if (mx >= sbX2 && mx <= sbX2+sbW2 && my >= sbY2-6 && my <= sbY2+14) {
      const totalW2 = STAGES.length*cardW + (STAGES.length-1)*gap;
      const mxSroll2 = Math.max(0, totalW2 - W + 40);
      const pct = (mx - sbX2) / sbW2;
      stageScrollX = (pct - 0.5) * mxSroll2;
    }
    // Back to title
    if (mx >= W/2-80 && mx <= W/2+80 && my >= H-62 && my <= H-30) state = 'select';
  } else if (state === 'select') {
    const cardX = W / 2 - 245, cardY = 68, cardW = 490, cardH = 418;
    if (mx < cardX && my > cardY && my < cardY + cardH)
      selChar = (selChar - 1 + CHARS.length) % CHARS.length;
    else if (mx > cardX + cardW && my > cardY && my < cardY + cardH)
      selChar = (selChar + 1) % CHARS.length;
    const dotY = cardY + cardH - 75;
    const btnX = W / 2 - 120, btnY = dotY + 18;
    if (mx >= btnX && mx <= btnX + 240 && my >= btnY && my <= btnY + 46) {
      state = 'stageselect'; titleHoveredCat = -1;
    }
    // Back to stage select
    if (mx >= W/2-70 && mx <= W/2+70 && my >= H-38 && my <= H-8) state = 'title';
    // Click on dot
    for (let i = 0; i < CHARS.length; i++) {
      const dotX = W / 2 - (CHARS.length - 1) * 17 + i * 34;
      if (dist(mx, my, dotX, dotY) < 18) selChar = i;
    }
  } else if (state === 'chest') {
    if (!chestChoices) return;
    const chs = chestChoices.choices;
    const cardW = 195, cardH = 220, gap = 16;
    const totalW = chs.length*cardW + (chs.length-1)*gap;
    const startX = W/2 - totalW/2;
    chs.forEach((u, i) => {
      const cx2 = startX + i*(cardW+gap), cy2 = 180;
      if (mx >= cx2 && mx < cx2+cardW && my >= cy2 && my < cy2+cardH) {
        applyChestReward(u);
      }
    });
  } else if (state === 'levelup') {
    const count = lvlChoices.length;
    const cardW = 195, cardH = 230, gap = 16;
    const totalW = count * cardW + (count - 1) * gap;
    const startX = W / 2 - totalW / 2;
    lvlChoices.forEach((u, i) => {
      const cx2 = startX + i * (cardW + gap), cy2 = 144;
      if (mx >= cx2 && mx <= cx2 + cardW && my >= cy2 && my <= cy2 + cardH)
        applyUpgrade(u);
    });
  } else if (state === 'playing') {
    // Keyboard shortcuts handled in onKeyDown
  } else if (state === 'difficulty') {
    const dCardW=210, dGap=24, dTotalW=DIFFICULTIES.length*dCardW+(DIFFICULTIES.length-1)*dGap;
    const dStartX = W/2 - dTotalW/2;
    DIFFICULTIES.forEach((diff, i) => {
      const dcx = dStartX + i*(dCardW+dGap);
      if (mx>=dcx && mx<=dcx+dCardW && my>=90 && my<=310) difficultyLevel = i;
    });
    const confY = 340;
    if (mx>=W/2-130 && mx<=W/2+130 && my>=confY && my<=confY+50) { state='title'; }
    if (mx>=W/2-80  && mx<=W/2+80  && my>=confY+60 && my<=confY+90) { readyToPlay=false; state='title'; }
  } else if (state === 'bossTrialSelect') {
    if (bossTrialState==='weaponSelect') {
      // Back to title
      if (mx >= W-130 && mx <= W-10 && my >= 8 && my <= 36) { state='title'; return; }
      // Next button
      if (bossTrialWpns.length>0 && mx>=W/2-90 && mx<=W/2+90 && my>=H-46 && my<=H-8) {
        bossTrialState='bossSelect'; return;
      }
      // Weapon card click
      const _cols=3, _cardW=(W-32)/_cols-6, _cardH=72, _gap=6, _cY=86;
      BOSS_TRIAL_ALL_WEAPONS.forEach((wtype,idx)=>{
        const col=idx%_cols, row=Math.floor(idx/_cols);
        const cx2=12+col*(_cardW+_gap), cy2=_cY+row*(_cardH+_gap)-bossTrialScrollWpn;
        if (mx>=cx2&&mx<=cx2+_cardW&&my>=cy2&&my<=cy2+_cardH) {
          const sel=bossTrialWpns.indexOf(wtype);
          if (sel>=0) { bossTrialWpns.splice(sel,1); }  // deselect
          else if (btCanAdd(wtype)) { bossTrialWpns.push(wtype); }  // select
        }
      });
    } else {
      // Boss select state
      // Back to weapon select
      if (mx>=W-130&&mx<=W-10&&my>=8&&my<=36) { bossTrialState='weaponSelect'; return; }
      // Start fight
      if (mx>=W/2-90&&mx<=W/2+90&&my>=H-46&&my<=H-8) { startBossTrialFight(); return; }
      // Boss card click
      const _cols2=2, _cardW2=(W-28)/_cols2-6, _cardH2=86, _gap2=8, _cY2=42;
      BOSS_TRIAL_BOSS_LIST.forEach((bentry,idx)=>{
        const col=idx%_cols2, row=Math.floor(idx/_cols2);
        const cx2=10+col*(_cardW2+_gap2), cy2=_cY2+row*(_cardH2+_gap2)-bossTrialScrollBoss;
        if (mx>=cx2&&mx<=cx2+_cardW2&&my>=cy2&&my<=cy2+_cardH2) { bossTrialBoss=bentry.id; }

  } else if (state === 'achievements') {

    if (isBackBtnClicked(mx,my)) { playSFX('click'); state = 'title'; return; }

    if (my >= 36 && my <= 64) {
      const tabW = Math.floor(W/HOWTO_TABS.length);
      const ti = Math.floor(mx/tabW);
      if (ti >= 0 && ti < HOWTO_TABS.length) { playSFX('tab'); _howtoTab = ti; howtoScroll = 0; return; }

    if (my > 70) howtoScroll = Math.min(howtoMaxScroll, howtoScroll + 80);
  } else if (state === 'settings') {
    if (isBackBtnClicked(mx,my)) { playSFX('click'); state=(_settingsFrom==='paused')?'paused':'title'; return; }
    handleSettingsClick(mx, my);
  } else if (state === 'updatelog') {
    // Back button (top-right, same as guide: W-122 to W-8, y 8-38)
    if (mx >= W-122 && mx <= W-8 && my >= 8 && my <= 38) { playSFX('click'); state = 'title'; return; }

    if (my > 58 && my < H-10) { _logScroll = Math.min(_logScroll + 80, _logMaxScroll); }
  } else if (state === 'blueChest') {
    // Card click
    if (blueChestChoices) {
      const _cw=140, _ch=160, _gap=20;
      const _total = blueChestChoices.length*_cw + (blueChestChoices.length-1)*_gap;
      const _startX = W/2 - _total/2;
      const _py2 = (H-340)/2;
      for(let ci=0; ci<blueChestChoices.length; ci++){
        const _cx=_startX+ci*(_cw+_gap), _cy=_py2+80;
        if(mx>=_cx&&mx<=_cx+_cw&&my>=_cy&&my<=_cy+_ch){
          applyBlueChestChoice(ci); return;
        }
      }
    }
  } else if (state === 'guide') {
    // Tab switch (4 tabs)
    if (my >= 34 && my <= 66) {
      const tabW4 = Math.floor(W / 4);
      if (mx < tabW4) { playSFX('tab'); guideState.tab='weapon'; guideState.scroll=0; }
      else if (mx < tabW4*2) { playSFX('tab'); guideState.tab='evolved'; guideState.scroll=0; }
      else if (mx < tabW4*3) { playSFX('tab'); guideState.tab='enemy'; guideState.scroll=0; }
      else { playSFX('tab'); guideState.tab='cats'; guideState.scroll=0; }
    }
    // Back button
    if (isBackBtnClicked(mx,my)) { playSFX('click'); state=guideFrom; guideFrom='title'; }
    // Vertical scrollbar click
    const sbX = W - 14, sbH2 = H - 80;
    if (mx >= sbX - 8 && mx <= sbX + 8 && my >= 76 && my <= 76 + sbH2 && guideState.maxScroll > 0) {
      const pct = (my - 76) / sbH2;
      guideState.scroll = Math.max(0, Math.min(guideState.maxScroll, pct * guideState.maxScroll));
    }
  } else if (state === 'adminPanel') {
    handleAdminPanelClick(mx, my);
  } else if (state === 'paused') {
    const px = W/2 - 200, py = 60, pw = 400;
    const contentY = py + 78;
    // Settings gear (top-right of panel)
    if(mx>=px+pw-42&&mx<=px+pw-10&&my>=py+10&&my<=py+42){playSFX('click');_settingsFrom='paused';state='settings';return;}

    if (mx >= px+20 && mx <= px+pw-20 && my >= guideY2 && my <= guideY2+26) {
      guideFrom='paused'; state = 'guide'; guideState.scroll = 0;
    }
  } else if (state === 'shop') {
    if (isBackBtnClicked(mx,my)) { playSFX('click'); goToTitle(); return; }
    // ── drawShopScreen と完全一致した定数 ──────────────────────────────
    const cols=2, iw=Math.floor((W-40)/cols), ih=118, gap=8, startY=56;
    SHOP_ITEMS.forEach((item,idx)=>{
      const col=idx%cols, row=Math.floor(idx/cols);
      const ix=12+col*(iw+gap);
      const iy=startY+6+row*(ih+gap)-shopView.scroll;
      // カードの範囲外なら無視
      if(iy+ih<0||iy>H) return;
      const lv=ownedPassives[item.id]||0;
      const maxed=lv>=item.maxLv;
      // 購入ボタン：drawShopScreen と完全一致
      const buyX=ix+8, buyY=iy+ih-38, buyW=iw-16, buyH=30;
      if(mx>=buyX&&mx<=buyX+buyW&&my>=buyY&&my<=buyY+buyH){
        if(!maxed&&shopCoins>=item.cost){
          shopCoins-=item.cost; ownedPassives[item.id]=(lv+1);
          playSFX('buy'); saveGameData();
        } else { playSFX('deny'); }
      }
    });


  } else if (state === 'doorchoice2') {
    // Only option: escape/ending
    startEnding2();
  } else if (state === 'doorchoice2') {
    startHappyEnding();
  } else if (state === 'happyending') {
    happyEndingScene++; happyEndingT = 0;
  } else if (state === 'doorchoice') {
    const ld = { x: W/2 - 160, y: H/2 - 100, w: 130, h: 200 };
    const rd = { x: W/2 + 30,  y: H/2 - 100, w: 130, h: 200 };
    if (mx >= ld.x && mx <= ld.x+ld.w && my >= ld.y && my <= ld.y+ld.h) startEnding();
    if (mx >= rd.x && mx <= rd.x+rd.w && my >= rd.y && my <= rd.y+rd.h) {
      // Clear all enemies, reset boss flags (boss won't re-appear)
      enemies.length = 0; finalBossDefeated = true; finalBossSpawned = true; finalBossActive = false;
      phase2Mode = true; phase2BossSpawned = false; phase2BossDefeated = false;

function onKeyDown(key) {
  if (state === 'intro') {
    if (key === 'Space' || key === 'Enter' || key === 'Escape') { skipIntro(); return; }
  } else if (state === 'title') {
    if (key === 'Space' || key === 'Enter') {
      ensureAudio();
      if (readyToPlay) { initGame(); state = 'playing'; }
      else {
        if (titleHoveredCat >= 0) selChar = titleHoveredCat;
        state = 'select';
      }
    }
  } else if (state === 'stageselect') {
    if (key === 'ArrowLeft'  || key === 'KeyA') { selectedStage = (selectedStage - 1 + STAGES.length) % STAGES.length; stageScrollX = -selectedStage * 232 + (STAGES.length-1)*116; }
    if (key === 'ArrowRight' || key === 'KeyD') { selectedStage = (selectedStage + 1) % STAGES.length; stageScrollX = -selectedStage * 232 + (STAGES.length-1)*116; }
    if (key === 'Enter' || key === 'Space') { readyToPlay = true; state = 'difficulty'; }
  } else if (state === 'select') {
    if (key === 'ArrowLeft'  || key === 'KeyA') selChar = (selChar - 1 + CHARS.length) % CHARS.length;
    if (key === 'ArrowRight' || key === 'KeyD') selChar = (selChar + 1) % CHARS.length;
    if (key === 'Enter' || key === 'Space') { state = 'stageselect'; }
  } else if (state === 'chest') {
    if (chestChoices) {
      if (key === 'Digit1' || key === '1') applyChestReward(chestChoices.choices[0]);
      if (key === 'Digit2' || key === '2') applyChestReward(chestChoices.choices[1]);
      if (key === 'Digit3' || key === '3') applyChestReward(chestChoices.choices[2]);
    }
  } else if (state === 'levelup') {
    if (key === 'Digit1' || key === '1') applyUpgrade(lvlChoices[0]);
    if (key === 'Digit2' || key === '2') applyUpgrade(lvlChoices[1]);
    if (key === 'Digit3' || key === '3') applyUpgrade(lvlChoices[2]);
  } else if (state === 'playing') {
    if (key === 'KeyQ' || key === 'q') activateSkill();
    if (key === 'Escape' || key === 'KeyP' || key === 'p') togglePause();
  } else if (state === 'guide') {
    // Tab switch (4 tabs)
    if (my >= 34 && my <= 66) {
      const tabW4 = Math.floor(W / 4);
      if (mx < tabW4) { playSFX('tab'); guideState.tab='weapon'; guideState.scroll=0; }
      else if (mx < tabW4*2) { playSFX('tab'); guideState.tab='evolved'; guideState.scroll=0; }
      else if (mx < tabW4*3) { playSFX('tab'); guideState.tab='enemy'; guideState.scroll=0; }
      else { playSFX('tab'); guideState.tab='cats'; guideState.scroll=0; }
    }
    // Back button
    if (isBackBtnClicked(mx,my)) { playSFX('click'); state=guideFrom; guideFrom='title'; }
    // Scroll down/up areas
    if (my > H-60 && mx > W-60) {
      guideState.scroll = Math.min(guideState.maxScroll, guideState.scroll + 80);
    }
  } else if (state === 'difficulty') {
    if (key === 'ArrowLeft' || key === 'KeyA') difficultyLevel = Math.max(0, difficultyLevel-1);
    if (key === 'ArrowRight' || key === 'KeyD') difficultyLevel = Math.min(2, difficultyLevel+1);
    if (key === 'Enter' || key === 'Space') { applyDifficulty(); state='title'; }
    if (key === 'Escape') { readyToPlay=false; state='title'; }
  } else if (state === 'achievements') {
    if (key === 'Escape') state = 'title';
  } else if (state === 'bossTrialSelect') {
    if (key === 'Escape') {
      if (bossTrialState==='bossSelect') bossTrialState='weaponSelect';
      else state='title';
    }
  } else if (state === 'howtoplay') {
    if (key === 'Escape') state = 'title';
  } else if (state === 'howtoplay') {
    if (key === 'Escape') state = 'title';
  } else if (state === 'paused') {
    if (key === 'Escape' || key === 'KeyP' || key === 'p') state = 'playing';
    if (key === 'Digit1' || key === '1') state = 'playing';
    if (key === 'Digit2' || key === '2') { guideFrom='paused'; state = 'guide'; }
    if (key === 'Digit3' || key === '3') { goToTitle(); challengeMode = false; }
  } else if (state === 'shop') {
    if (key === 'Escape') { goToTitle(); }
    if (key === 'ArrowDown') shopView.scroll = Math.min(shopView.maxScroll||0, shopView.scroll+60);
    if (key === 'ArrowUp') shopView.scroll = Math.max(0, shopView.scroll-60);
  } else if (state === 'howtoplay') {
    if (key === 'Escape') state='title';
    if (key === 'ArrowDown') howtoScroll = Math.min(howtoMaxScroll, howtoScroll+60);
    if (key === 'ArrowUp')   howtoScroll = Math.max(0, howtoScroll-60);
    if (key === 'ArrowRight') { _howtoTab = (_howtoTab+1)%HOWTO_TABS.length; howtoScroll=0; playSFX('tab'); }
    if (key === 'ArrowLeft')  { _howtoTab = (_howtoTab-1+HOWTO_TABS.length)%HOWTO_TABS.length; howtoScroll=0; playSFX('tab'); }
  } else if (state === 'updatelog') {
    if (key === 'Escape') state='title';
    if (key === 'ArrowDown') _logScroll = Math.min(_logScroll+60, _logMaxScroll);
    if (key === 'ArrowUp')   _logScroll = Math.max(0, _logScroll-60);
  } else if (state === 'guide') {
    if (key === 'Escape' || key === 'KeyQ') { state=guideFrom; guideFrom='title'; }
    if (key === 'ArrowDown') guideState.scroll = Math.min(guideState.maxScroll, guideState.scroll+60);
    if (key === 'ArrowUp')   guideState.scroll = Math.max(0, guideState.scroll-60);
  } else if (state === 'paused') {
    const px = W/2 - 200, py = 60, pw = 400;
    const contentY = py + 78;
    const actBtns2 = ['resume','title'];
    actBtns2.forEach((action, i) => {
      const by = contentY + i * 54;
      if (mx >= px+40 && mx <= px+pw-40 && my >= by && my <= by+42) {
        if (action === 'resume') state = 'playing';
        else if (action === 'title') { goToTitle(); challengeMode = false; }
      }
    });
    // Guide button
    const guideY2 = contentY + 118;
    if (mx >= px+20 && mx <= px+pw-20 && my >= guideY2 && my <= guideY2+26) {
      state = 'guide'; guideState.scroll = 0;
    }
  } else if (state === 'shop') {
    // Buy item click
    const iw = (W - 60) / 2, ih = 110, gap = 12;
    SHOP_ITEMS.forEach((item, idx) => {
      const col = idx % 2, row = Math.floor(idx / 2);
      const ix = 20 + col * (iw + gap);
      const iy = 60 + row * (ih + gap) - shopView.scroll;
      const lv = ownedPassives[item.id] || 0;
      if (mx >= ix + 10 && mx <= ix + iw - 10 && my >= iy + 70 && my <= iy + 100) {
        if (shopCoins >= item.cost && lv < item.maxLv) {
          shopCoins -= item.cost;
          ownedPassives[item.id] = lv + 1;
          playSFX('buy'); saveGameData();
        } else { playSFX('deny'); }
      }
    });
    // Nav buttons
    const btnY = H - 52;
    if (mx >= 20 && mx <= 190 && my >= btnY && my <= btnY + 36) state = 'select';

  } else if (state === 'doorchoice') {
    const ld = { x: W/2 - 160, y: H/2 - 100, w: 130, h: 200 };
    const rd = { x: W/2 + 30,  y: H/2 - 100, w: 130, h: 200 };
    if (mx >= ld.x && mx <= ld.x+ld.w && my >= ld.y && my <= ld.y+ld.h) startEnding();
    if (mx >= rd.x && mx <= rd.x+rd.w && my >= rd.y && my <= rd.y+rd.h) {
      // Clear all enemies, reset boss flags (boss won't re-appear)
      enemies.length = 0; finalBossDefeated = true; finalBossSpawned = true; finalBossActive = false;
      phase2Mode = true; phase2BossSpawned = false; phase2BossDefeated = false;
      // Boost remaining enemy spawns
      for (const k of Object.keys(ENEMY_DEFS)) {
        ENEMY_DEFS[k].baseHp *= 1.5; ENEMY_DEFS[k].dmg = Math.floor(ENEMY_DEFS[k].dmg * 1.4);
      }
      fxList.push({ type:'text', x:player.x, y:player.y-80, text:'⚔️ 新たな脅威が迫る！', life:3, color:'#ff8844', vy:-28, big:true });
      state = 'playing';
      try { playBGM('hell'); } catch(e){}
    }
  } else if (state === 'ending') {
    endingScene++; endingT = 0; // skip to next scene
  } else if (state === 'doorchoice2') {
    if (key === 'Enter' || key === 'Space') startHappyEnding();
  } else if (state === 'happyending') {
    happyEndingScene++; happyEndingT = 0;
  } else if (state === 'doorchoice') {
    if (key === 'Digit1' || key === '1') startEnding();
    if (key === 'Digit2' || key === '2') { startContinuePhase(); }
  } else if (state === 'ending') {
    endingScene++; endingT = 0;
  } else if (state === 'gameover') {
    if (key === 'KeyR' || key === 'r' || key === 'Enter') { goToTitle(); }
  }
}

const SAVE_KEY = 'nyanSurvivor_save_v1';

function saveGameData() {
  try {
    const data = {
      shopCoins,
      ownedPassives,
      achievementsUnlocked,
      difficultyLevel,
      _titleBGMIdx,
      savedAt: Date.now(),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  triggerAutosaveNotif();
  } catch(e) { console.warn('Save failed:', e); }
}

function loadGameData() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.shopCoins !== undefined)         shopCoins          = data.shopCoins;
    if (data.ownedPassives)                   ownedPassives      = data.ownedPassives;
    if (data.achievementsUnlocked)            achievementsUnlocked = data.achievementsUnlocked;
    if (data.difficultyLevel !== undefined)   difficultyLevel    = data.difficultyLevel;
    if (data._titleBGMIdx !== undefined)      _titleBGMIdx       = data._titleBGMIdx;
    // 設定データ復元
    if (data.bgmVol  !== undefined) _settingsBGMVol  = data.bgmVol;
    if (data.sfxVol  !== undefined) _settingsSFXVol  = data.sfxVol;
    if (data.bgmMute !== undefined) _settingsBGMMute = data.bgmMute;
    if (data.sfxMute !== undefined) _settingsSFXMute = data.sfxMute;
    _applySettingsVolume();
  } catch(e) { console.warn('Load failed:', e); }
}

  if (howtoMaxScroll > 0) {

function _htSection(y, title, color) {
  ctx.save();
  ctx.fillStyle = color+'20'; rr(ctx,6,y,W-12,30,8); ctx.fill();
  ctx.strokeStyle = color+'50'; ctx.lineWidth=1.5; rr(ctx,6,y,W-12,30,8); ctx.stroke();
  ctx.fillStyle=color; ctx.font='bold 13px monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.shadowBlur=8; ctx.shadowColor=color;
  ctx.fillText(title, 16, y+15);
  ctx.restore();
}
function _htRow(y, icon, label, desc, color) {
  ctx.save();
  ctx.font='15px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(icon, 22, y+13);
  ctx.fillStyle=color+'dd'; ctx.font='bold 11px monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(label, 38, y+13);
  const lw = ctx.measureText(label).width;
  ctx.fillStyle='rgba(220,210,240,0.8)'; ctx.font='10px monospace';
  // Truncate desc to fit
  let d=desc;
  while(d.length>2&&ctx.measureText(d).width>W-38-lw-18) d=d.slice(0,-1);
  ctx.fillText(d, 38+lw+8, y+13);
  ctx.restore();
}

function drawShopScreen() {
  // ── Background ──────────────────────────────────────────────────────────
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#080018'); grad.addColorStop(1,'#14002a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.globalAlpha=0.18; ctx.fillStyle='rgba(220,180,255,1)';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ── Header ───────────────────────────────────────────────────────────────
  ctx.fillStyle='rgba(10,0,30,0.9)'; ctx.fillRect(0,0,W,50);
  ctx.fillStyle='rgba(120,0,200,0.18)'; ctx.fillRect(0,0,W,50);
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=18; ctx.shadowColor='#cc44ff';
  ctx.fillStyle='#eeccff'; ctx.font='bold 20px monospace';
  ctx.fillText('🛒 アイテムショップ', W/2, 25);
  ctx.restore();

  // ── Back button (top-right, unified style) ───────────────────────────────
  drawBackBtn();

  // ── Coin display (top-left) ──────────────────────────────────────────────
  ctx.save();
  ctx.fillStyle='rgba(60,45,0,0.92)'; rr(ctx,8,8,158,34,17); ctx.fill();
  ctx.strokeStyle='#bb8800'; ctx.lineWidth=1.5; rr(ctx,8,8,158,34,17); ctx.stroke();
  ctx.fillStyle='#ffdd44'; ctx.font='bold 14px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('💰 '+shopCoins+' コイン', 87, 25);
  ctx.restore();

  // ── Items grid ───────────────────────────────────────────────────────────
  const cols=2, iw=Math.floor((W-40)/cols), ih=118, gap=8, startY=56;
  const contentH=H-startY;
  ctx.save(); ctx.beginPath(); ctx.rect(0,startY,W-12,contentH); ctx.clip();

  SHOP_ITEMS.forEach((item,idx)=>{
    const col=idx%cols, row=Math.floor(idx/cols);
    const ix=12+col*(iw+gap);
    const iy=startY+6+row*(ih+gap)-shopView.scroll;
    if(iy+ih < startY-4 || iy > H+10) return;

    const lv=ownedPassives[item.id]||0;
    const maxed=lv>=item.maxLv;
    const canBuy=shopCoins>=item.cost&&!maxed;
    const isH=lastMX>=ix&&lastMX<=ix+iw&&lastMY>=iy&&lastMY<=iy+ih;
    const buyY=iy+ih-38, buyH2=30;
    const buyHov=lastMX>=ix+8&&lastMX<=ix+iw-8&&lastMY>=buyY&&lastMY<=buyY+buyH2;

    // Card
    ctx.save();
    if(isH){ ctx.shadowBlur=16; ctx.shadowColor=maxed?'#aa7700':'#9955ff'; }
    const cg=ctx.createLinearGradient(ix,iy,ix+iw,iy+ih);
    if(maxed){       cg.addColorStop(0,'#1e1600'); cg.addColorStop(1,'#0e0b00'); }
    else if(isH){    cg.addColorStop(0,'#2a0f52'); cg.addColorStop(1,'#180832'); }
    else {           cg.addColorStop(0,'#160838'); cg.addColorStop(1,'#0c0422'); }
    ctx.fillStyle=cg; rr(ctx,ix,iy,iw,ih,12); ctx.fill();
    ctx.strokeStyle=maxed?'#886600':isH?'#bb77ff':canBuy?'#6633bb':'#2a1644';
    ctx.lineWidth=isH?2:1.2; rr(ctx,ix,iy,iw,ih,12); ctx.stroke();
    ctx.restore();

    // Level progress bar (top of card)
    ctx.fillStyle='rgba(80,40,130,0.3)'; ctx.fillRect(ix+1,iy+1,iw-2,6);
    ctx.fillStyle=maxed?'#ddaa00':'#9955ee';
    ctx.fillRect(ix+1,iy+1,(iw-2)*(lv/item.maxLv),6);

    // Icon
    ctx.font='28px serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(item.icon, ix+10, iy+34);

    // Name + MAX badge
    ctx.fillStyle=maxed?'#ffcc44':isH?'#ffffff':'#ddccff';
    ctx.font='bold 13px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(item.name, ix+46, iy+10);
    if(maxed){
      ctx.fillStyle='rgba(200,150,0,0.9)'; rr(ctx,ix+iw-58,iy+8,52,18,9); ctx.fill();
      ctx.fillStyle='#fff8cc'; ctx.font='bold 10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✨ MAX', ix+iw-32, iy+17);
    } else {
      ctx.fillStyle='#886699'; ctx.font='10px monospace'; ctx.textBaseline='top';
      ctx.fillText(`Lv ${lv} / ${item.maxLv}`, ix+iw-68, iy+10);
    }

    // Level dots
    for(let li=0;li<item.maxLv;li++){
      ctx.fillStyle=li<lv?(maxed?'#ffcc00':'#cc88ff'):'rgba(80,60,110,0.5)';
      ctx.beginPath(); ctx.arc(ix+46+li*13, iy+32, 4, 0, Math.PI*2); ctx.fill();
    }

    // Description
    ctx.fillStyle='rgba(190,175,215,0.75)'; ctx.font='10px monospace';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(item.desc, ix+10, iy+52);

    // Buy button
    if(!maxed){
      const bbg=ctx.createLinearGradient(ix+8,buyY,ix+8,buyY+buyH2);
      if(canBuy&&buyHov){ bbg.addColorStop(0,'#8855ee'); bbg.addColorStop(1,'#6633cc'); }
      else if(canBuy){    bbg.addColorStop(0,'#5522aa'); bbg.addColorStop(1,'#3d1888'); }
      else {              bbg.addColorStop(0,'rgba(30,15,50,0.85)'); bbg.addColorStop(1,'rgba(20,8,35,0.85)'); }
      ctx.save();
      if(buyHov&&canBuy){ ctx.shadowBlur=12; ctx.shadowColor='#aa77ff'; }
      ctx.fillStyle=bbg; rr(ctx,ix+8,buyY,iw-16,buyH2,9); ctx.fill();
      ctx.strokeStyle=canBuy?(buyHov?'#ddaaff':'#7744cc'):'#2a1440';
      ctx.lineWidth=buyHov?1.8:1; rr(ctx,ix+8,buyY,iw-16,buyH2,9); ctx.stroke();
      ctx.restore();
      ctx.fillStyle=canBuy?'#ffffff':'#554466';
      ctx.font=`${buyHov&&canBuy?'bold ':''}11px monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(canBuy?`💰 ${item.cost} コイン で強化 →Lv${lv+1}`:`💰 コイン不足 (${item.cost-shopCoins}足りない)`, ix+iw/2, buyY+buyH2/2);
    }
  });
  ctx.restore();

  // ── Compute scroll ────────────────────────────────────────────────────────
  shopView.maxScroll=Math.max(0, Math.ceil(SHOP_ITEMS.length/cols)*(ih+gap)+startY+12-H);
  shopView.scroll=Math.min(shopView.scroll, shopView.maxScroll);

  // ── Scrollbar (guide style) ───────────────────────────────────────────────
  if(shopView.maxScroll>0){
    const sbX=W-7, sbH3=contentH;
    const tR=Math.min(1,sbH3/(sbH3+shopView.maxScroll));
    const tH3=Math.max(24,sbH3*tR);
    const tY3=startY+(shopView.scroll/shopView.maxScroll)*(sbH3-tH3);
    ctx.fillStyle='rgba(60,30,100,0.45)'; rr(ctx,sbX-5,startY,10,sbH3,5); ctx.fill();
    ctx.fillStyle='#9944cc'; rr(ctx,sbX-5,tY3,10,tH3,5); ctx.fill();
  }
}

let challengeMode = false;

function initChallenge() {
  initGame();
  challengeMode = true;
  challengeWaveNum = 0;
  challengeScore = 0;
  // Challenge: force all-direction constant waves
  waveSystem.waveTimer = 8;   // first wave very soon
  waveSystem.waveCooldown = 15; // waves every 15s
  // Drop 2 special weapon-choice chests near the player start
  setTimeout(() => {
    if (state !== 'playing' || !player) return;
    const offsets = [[-80, 0], [80, 0]];
    offsets.forEach(([ox, oy]) => {
      chests.push({
        x: player.x + ox, y: player.y + oy,
        bobT: Math.random()*Math.PI*2,
        sparkleT: 0,
        life: 60,
        open: false,
        special: true, // weapon choice chest
      });
    });
    fxList.push({ type:'text', x:player.x, y:player.y-80,
      text:'🎁 2つの宝箱が出現！武器を選ぼう！', life:3, color:'#ffdd44', vy:-25, big:true });
  }, 500);
  state = 'playing';
}

  challengeScore = Math.floor(killCount * (1 + gameTime / 60));
}

let _adminPanelUI = null;

function handleAdminPanelClick(mx, my) {
  if (!_adminPanelUI) return;
  const u = _adminPanelUI;
  const hit = (b) => b && mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h;
  if (hit(u.b_coin))      { _adminAddCoins(99999); playSFX('buy'); }
  if (hit(u.b_shreset))   { _adminResetShop(); playSFX('click'); }
  if (hit(u.b_saveview))  {
    try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
      alert('💾 セーブデータ\n'+JSON.stringify(d,null,2).slice(0,800));}catch(e){alert('データなし');}
    playSFX('click');
  }
  if (hit(u.b_resetall))  {
    if(confirm('⚠ 全データを削除しますか？')){
      try{localStorage.removeItem(SAVE_KEY);}catch(e){}
      shopCoins=0;ownedPassives={};achievementsUnlocked={};difficultyLevel=1;
      playSFX('click');
      fxList.push({type:'text',x:W/2,y:H/2-40,text:'🗑 データ全削除',life:2.5,color:'#ff4444',vy:-25,big:true});
    }
  }
  if (hit(u.b_showfps))   { _settingsShowFPS=!_settingsShowFPS; saveSettingsData(); playSFX('click'); }
  if (hit(u.b_showcol))   { _adminShowCollision=!_adminShowCollision; playSFX('click'); }
  if (hit(u.b_godgame))   { gameTime+=600; playSFX('click');
    fxList.push({type:'text',x:W/2,y:H/2-40,text:'⏩ 時間+10分',life:2,color:'#aa66ff',vy:-25,big:true}); }
  if (hit(u.b_nowav))     { waveSystem.bossTimer=9999; waveSystem.waveTimer=0; playSFX('click'); }
  if (hit(u.b_clrenem))   { enemies.length=0; playSFX('click'); }
  if (hit(u.b_achunlock)) {
    ACHIEVEMENTS.forEach(a => { achievementsUnlocked[a.id] = true; });
    saveGameData(); playSFX('buy');
    fxList.push({type:'text',x:W/2,y:H/2-40,text:'🏆 全実績アンロック！',life:2.5,color:'#ffdd00',vy:-25,big:true});
  }
  if (mx>=u.backX&&mx<=u.backX+u.backW&&my>=u.backY&&my<=u.backY+u.backH) {
    playSFX('click'); state = 'settings';
  }
}

let happyEndingT = 0;
let happyEndingScene = 0;

function startHappyEnding() {
  happyEndingT=0; happyEndingScene=0; state='happyending';
  endingScore = killCount*150 + Math.floor(gameTime*12) + (player?player.level*800:0);
  try { playBGM('title'); } catch(e){}

function drawHappyEnding(dt) {
  happyEndingT += dt;
  if (happyEndingT > 5 && happyEndingScene < 4) { happyEndingScene++; happyEndingT=0; return; }
  if (happyEndingScene >= 5) { state='title'; readyToPlay=false; playHomeBGM(); return; }

  const sc = happyEndingScene;
  const t2 = happyEndingT;
  const fadeIn = Math.min(1,t2*1.5), fadeOut = sc<4?Math.max(0,1-(t2-4)*3):1;
  const alpha = fadeIn*fadeOut;

  const bgs = [['#000820','#001040'],['#1a1a40','#2a0050'],['#0a2200','#143300'],['#87CEEB','#98FB98'],['#000','#0a0020']];
  const [b1,b2] = bgs[sc]||bgs[0];
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,b1); g.addColorStop(1,b2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.save(); ctx.globalAlpha=Math.max(0,alpha); ctx.textAlign='center'; ctx.textBaseline='middle';

  if (sc===0) {
    // Enemies and cats face each other
    ctx.font='48px serif';
    ctx.fillText('👹', W*0.7, H*0.4+Math.sin(t2*2)*8);
    CHARS.forEach((ch,i)=>{
      if(imgs[ch.id]&&imgs[ch.id].complete){ctx.imageSmoothingEnabled=false;ctx.drawImage(imgs[ch.id],W*0.1+i*60,H*0.45,44,52);}
    });
    ctx.fillStyle='#ccaaff'; ctx.font='bold 22px monospace';
    ctx.fillText('……', W/2, H*0.72);
    ctx.fillStyle='#9988bb'; ctx.font='16px monospace';
    ctx.fillText('魔王は静かに立ち止まった', W/2, H*0.82);

  } else if (sc===1) {
    ctx.font='44px serif'; ctx.fillText('👹', W/2, H*0.32+Math.sin(t2*2)*5);
    ctx.fillStyle='#ffccff'; ctx.font='bold 20px monospace';
    ctx.fillText('「……もういい。疲れた」', W/2, H*0.52);
    ctx.fillStyle='#ccaacc'; ctx.font='15px monospace';
    ctx.fillText('魔王は長い戦いに疲れ果てていた', W/2, H*0.65);
    ctx.fillText('本当は誰かと仲良くなりたかっただけ……', W/2, H*0.76);

  } else if (sc===2) {
    // Cats approach demon lord
    CHARS.forEach((ch,i)=>{
      const bobF=Math.sin(t2*3+i)*8;
      if(imgs[ch.id]&&imgs[ch.id].complete){ctx.imageSmoothingEnabled=false;ctx.drawImage(imgs[ch.id],W*0.22+i*80,H*0.48+bobF,52,62);}
    });
    ctx.font='48px serif'; ctx.fillText('👹', W*0.8, H*0.45+Math.sin(t2*2)*5);
    ctx.fillStyle='#ffffcc'; ctx.font='bold 20px monospace'; ctx.shadowBlur=12; ctx.shadowColor='#ffdd44';
    ctx.fillText('白ネコ「一緒に帰ろう！」', W/2, H*0.78);
    ctx.fillStyle='#ffeeaa'; ctx.font='14px monospace'; ctx.shadowBlur=0;
    ctx.fillText('魔王はぽかんとした顔をした', W/2, H*0.88);

  } else if (sc===3) {
    // Sunny meadow, all together
    const skyG=ctx.createLinearGradient(0,0,0,H);
    skyG.addColorStop(0,'#87CEEB'); skyG.addColorStop(1,'#98FB98');
    ctx.fillStyle=skyG; ctx.fillRect(0,0,W,H); ctx.globalAlpha=alpha;
    for(let fi=0;fi<22;fi++){ctx.font='16px serif';ctx.fillText(fi%3?fi%2?'🌸':'🌼':'🌺',(fi*145)%W,H*0.76+(fi*41)%55);}
    CHARS.forEach((ch,i)=>{
      const bobC=Math.sin(t2*3+i*1.2)*14;
      if(imgs[ch.id]&&imgs[ch.id].complete){ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(90+i*120,H*0.5+bobC);ctx.drawImage(imgs[ch.id],-26,-34,52,62);ctx.restore();}
    });
    ctx.font='52px serif'; ctx.fillText('👹', W*0.82, H*0.5+Math.sin(t2*2.5)*10);
    ctx.fillStyle='#334400'; ctx.font='bold 22px monospace'; ctx.shadowBlur=12; ctx.shadowColor='#88ff44';
    ctx.fillText('🌿 みんなで草原へ帰ってきた！', W/2, H*0.84);

  } else if (sc===4) {
    // Credits
    const scrollY = H*0.18 - (t2-0.5)*55;
    ctx.fillStyle='#ccaaff'; ctx.font='bold 26px monospace'; ctx.shadowBlur=12; ctx.shadowColor='#aa66ff';
    ctx.fillText('🐱 ニャンサバイバー 🐱', W/2, scrollY);

      ctx.fillText(l, W/2, scrollY+105+i*30);
    });
    CHARS.forEach((ch,i)=>{
      const bobF=Math.sin(t2*2+i)*6;
      if(imgs[ch.id]&&imgs[ch.id].complete){ctx.imageSmoothingEnabled=false;ctx.drawImage(imgs[ch.id],70+i*126,H*0.7+bobF,48,58);}
    });
    ctx.font='40px serif'; ctx.fillText('👹', W*0.82, H*0.73+Math.sin(t2)*8);
    ctx.fillStyle='#554466'; ctx.font='11px monospace';
    ctx.fillText('また会う日まで……にゃ～ん＆がおー♪', W/2, H*0.94);
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle='#554477'; ctx.font='10px monospace';
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillText('スキップ→クリック', W-10, H-6); ctx.restore();
}

function drawDifficultyScreen() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0020'); grad.addColorStop(1, '#180030');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.fillStyle='rgba(180,160,255,0.15)';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  // Title
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=22; ctx.shadowColor='#ff44cc';
  ctx.fillStyle='#ffddff'; ctx.font='bold 28px monospace';
  ctx.fillText('⚙️ 難易度せんたく', W/2, 45); ctx.restore();

  const cardW=210, cardH=220, gap=24;
  const totalW = DIFFICULTIES.length * cardW + (DIFFICULTIES.length-1)*gap;
  const startX = W/2 - totalW/2;

  DIFFICULTIES.forEach((diff, i) => {
    const cx2 = startX + i*(cardW+gap), cy2 = 90;
    const active = difficultyLevel === i;
    const hover = mousePos.x>=cx2 && mousePos.x<cx2+cardW && mousePos.y>=cy2 && mousePos.y<cy2+cardH;
    // Card
    const cg = ctx.createLinearGradient(cx2,cy2,cx2,cy2+cardH);
    cg.addColorStop(0, active ? '#280048':'hover'? '#1a0038':'#120025');
    cg.addColorStop(1, active ? '#180030':'#0a0018');
    cg.addColorStop(0, active ? '#280048': hover ? '#1a0038':'#120025');
    ctx.fillStyle=cg; rr(ctx,cx2,cy2,cardW,cardH,18); ctx.fill();
    ctx.strokeStyle = active ? diff.color : hover ? diff.color+'88':'#553366';
    ctx.lineWidth = active ? 3 : 1.5;
    rr(ctx,cx2,cy2,cardW,cardH,18); ctx.stroke();
    if (active) { ctx.shadowBlur=20; ctx.shadowColor=diff.color; rr(ctx,cx2,cy2,cardW,cardH,18); ctx.stroke(); ctx.shadowBlur=0; }
    // Icon
    ctx.font='52px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(diff.icon, cx2+cardW/2, cy2+55);
    // Name
    ctx.fillStyle = active ? '#ffffff' : '#ccaadd'; ctx.font=`bold ${active?'20':'17'}px monospace`;
    ctx.fillText(diff.name, cx2+cardW/2, cy2+105);
    ctx.fillStyle = diff.color; ctx.font='11px monospace';
    ctx.fillText('['+diff.nameEn+']', cx2+cardW/2, cy2+125);
    // Description
    ctx.fillStyle='#aaaacc'; ctx.font='11px monospace';
    diff.desc.forEach((line, li) => ctx.fillText(line, cx2+cardW/2, cy2+145+li*16));
    // Selected badge
    if (active) {
      ctx.fillStyle=diff.color; ctx.font='bold 13px monospace';
      ctx.fillText('✓ せんたくちゅう', cx2+cardW/2, cy2+cardH-18);
    }
  });

  // Confirm button
  const confY = 340;
  const confDiff = DIFFICULTIES[difficultyLevel];
  const isHC = mousePos.x>=W/2-130 && mousePos.x<=W/2+130 && mousePos.y>=confY && mousePos.y<=confY+50;
  ctx.save(); ctx.fillStyle = isHC ? confDiff.color : confDiff.color+'99';
  ctx.shadowBlur = isHC ? 18 : 6; ctx.shadowColor = confDiff.shadowColor;
  rr(ctx,W/2-130,confY,260,50,25); ctx.fill();
  ctx.strokeStyle = confDiff.color; ctx.lineWidth=2; rr(ctx,W/2-130,confY,260,50,25); ctx.stroke();
  ctx.fillStyle='white'; ctx.font='bold 18px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('✨ この難易度でスタート', W/2, confY+25); ctx.restore();

  // Back
  ctx.save(); ctx.fillStyle='rgba(60,30,80,0.85)';
  rr(ctx,W/2-80,confY+60,160,30,15); ctx.fill();
  ctx.strokeStyle='#664488'; ctx.lineWidth=1; rr(ctx,W/2-80,confY+60,160,30,15); ctx.stroke();
  ctx.fillStyle='#ccaadd'; ctx.font='12px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('← タイトルへ戻る', W/2, confY+75); ctx.restore();
}

  // Achievement grid (scrollable)

    rr(ctx, cx2, cy2, cardW, cardH, 8); ctx.stroke();
    if (unlk) {
      ctx.save(); ctx.shadowBlur=8; ctx.shadowColor='#ffcc00';
      rr(ctx, cx2, cy2, cardW, cardH, 8); ctx.stroke(); ctx.restore();
    }
    ctx.font = '26px serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = unlk ? 1 : 0.25;
    ctx.fillText(ach.icon, cx2 + 8, cy2 + cardH/2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = unlk ? '#ffee88' : '#555566'; ctx.font = `bold 11px monospace`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(ach.name, cx2 + 44, cy2 + 10);
    ctx.fillStyle = unlk ? '#aaaacc' : '#404050'; ctx.font = '10px monospace';
    // Wrap desc
    const dw = cardW - 50;
    ctx.fillText(ach.desc, cx2 + 44, cy2 + 27);
    if (unlk) {
      ctx.fillStyle = '#88ff88'; ctx.font = 'bold 9px monospace';
      ctx.fillText('✓ UNLOCKED', cx2 + 44, cy2 + cardH - 16);
    }
  });

  const totalRows = Math.ceil(ACHIEVEMENTS.length / cols);
  achMaxScroll = Math.max(0, startY + totalRows * (cardH + gap) + achScroll - H + 10);
  ctx.restore();

  // Vertical scrollbar for achievements
  if (achMaxScroll > 0) {
    const sbX4 = W - 8, sbH4 = H - contentY2 - 4;
    const tRatio = Math.min(1, sbH4 / (sbH4 + achMaxScroll));
    const tH4 = Math.max(24, sbH4 * tRatio);
    const tY4 = contentY2 + (achScroll / achMaxScroll) * (sbH4 - tH4);
    ctx.fillStyle = 'rgba(60,40,20,0.5)';
    rr(ctx, sbX4-4, contentY2, 8, sbH4, 4); ctx.fill();
    ctx.fillStyle = '#cc9900';
    rr(ctx, sbX4-4, tY4, 8, tH4, 4); ctx.fill();
  }
}

function _spawnFinalBossAfterChest() {

  if (bossType === 'ironbull') activateArena(player.x, player.y, 'field');

  const baseHp = (def.baseHp + def.hpPerMin * min) * 3.5;
  const boss = createStageBossEnemy(bossType, baseHp, 1.0, true);
  boss.isFinalBoss = true;
  boss.speedMul = (boss.speedMul || 1.0) * 1.4;
  boss.dmgMul   = (boss.dmgMul   || 1.0) * 1.8;

  for (let i = enemies.length-1; i >= 0; i--) enemies.splice(i,1);

  fxList.push({type:'text',x:player.x,y:player.y-100,text:'👑 ラスボス降臨！！',life:4,color:'#ff0033',vy:-20,big:true});

// ── Blue Chest system ─────────────────────────────────────────────────────
let _blueChestPending = null; // 'midBoss' | 'finalBoss' | null

function spawnBlueChest(pendingBoss) {
  _blueChestPending = pendingBoss;
  // Pause enemy spawning, freeze enemies
  state = 'blueChest';
  // Build 3 random stat upgrade choices
  const _bcPool = [
    { id:'spd',   name:'移動速度UP',  icon:'💨', desc:'移動速度+0.4',         apply: p=>{ p.spd += 0.4; } },
    { id:'rate',  name:'攻撃速度UP',  icon:'⚡', desc:'クールダウン×0.88',    apply: p=>{ p.rateMul *= 0.88; } },
    { id:'maxhp', name:'最大HPUP',   icon:'💖', desc:'最大HP+25 & HP回復',    apply: p=>{ p.maxHp+=25; p.hp=Math.min(p.hp+20,p.maxHp); } },
  ];
  blueChestChoices = _bcPool.slice();
}

function applyBlueChestChoice(idx) {
  if (!blueChestChoices || idx < 0 || idx >= blueChestChoices.length) return;
  blueChestChoices[idx].apply(player);
  fxList.push({type:'text',x:player.x,y:player.y-80,text:'📦 '+blueChestChoices[idx].name+'！',
    life:2,color:'#44aaff',vy:-20,big:true});
  blueChestChoices = null;
  state = 'playing';
  // Spawn the pending boss
  if (_blueChestPending === 'midBoss') _spawnMidBossAfterChest();
  else if (_blueChestPending === 'finalBoss') _spawnFinalBossAfterChest();
  _blueChestPending = null;
}

let blueChestChoices = null;

function createStageBossEnemy(bossType, hp, expMul, isBoss) {
  const a = Math.random()*Math.PI*2;
  const def = getEnemyDef(bossType);
  return {
    x: player.x+Math.cos(a)*520, y: player.y+Math.sin(a)*520,
    type: bossType, r: def.r, boss: isBoss,
    maxHp: hp, hp,
    spd: def.spd, exp: Math.round(def.exp * expMul), color: def.color,
    dmg: Math.round(def.dmg * (DIFFICULTIES[difficultyLevel]||DIFFICULTIES[1]).atkMod),
    invincible:0, flashLife:0, knockX:0, knockY:0, slowTimer:0,
    // Boss attack state machine
    bossPhase: 1, attackTimer: 1.5, attackState: 'idle', attackCooldown: 2.5,
    barrierActive: false, barrierTimer: 0,
    takeDmg(amount, iframes, fromX, fromY) {
      if (this.invincible>0) return false;
      // Check special boss immunity
      const _specResult = bossSpecialTakeDmg(this, amount, iframes, fromX, fromY);
      if (_specResult === false) return false;
      if (this.barrierActive && this.bossPhase===1) return false;
      this.hp -= amount;
      this.invincible = iframes||0; this.flashLife = 0.1;
      if (fromX!==undefined) {
        const dx=this.x-fromX,dy=this.y-fromY,d2=Math.sqrt(dx*dx+dy*dy)||1;
        this.knockX=(dx/d2)*30; this.knockY=(dy/d2)*30;
      }
      // Phase 2 at 50% HP
      if (this.bossPhase===1 && this.hp <= this.maxHp*0.5) {
        this.bossPhase = 2;
        this.spd *= 1.4; this.attackCooldown = 2.0;
        fxList.push({type:'text',x:this.x,y:this.y-80,text:'⚠️ フェーズ2！',life:2.5,color:'#ff4444',vy:-30,big:true});
        for(let ri=0;ri<3;ri++) fxList.push({type:'ring',x:this.x,y:this.y,r:0,maxR:250+ri*40,life:0.8,color:'#ff2200'});
      }
      return true;
    }
  };
}

// Boss attack AI: update per frame
function updateBossAttacks(dt) {
  for (const e of enemies) {
    if (!e.boss) continue;
    if (e.attackCooldown === undefined) e.attackCooldown = 3.5;
    if (e.attackTimer === undefined) e.attackTimer = 0;
    e.attackTimer = (e.attackTimer||0) + dt;
    if (e.barrierActive) { e.barrierTimer -= dt; if(e.barrierTimer<=0) e.barrierActive=false; }
    if (e.attackTimer < (e.attackCooldown||4)) continue;
    e.attackTimer = 0;
    // Choose attack based on type
    executeBossAttack(e);
  }
}

function _bossVoice(e, text, color) {
  fxList.push({type:'text',x:e.x,y:e.y-65,text:text,life:1.8,color:color||'#ffffff',vy:-18,big:true});
}

function executeBossAttack(e) {
  if (!player) return;
  const t = e.type;
  const bs = getBossState(e);
  // Don't attack while stunned
  if (bs.stun > 0) { e.attackCooldown = 0.3; return; }
  const phase = e.bossPhase || 1;
  const dmg = e.dmg || 20;
  const px = player.x, py = player.y;
  const angle2P = Math.atan2(py - e.y, px - e.x);

  // Helper: fire N projs in spread around angle
  const fireSpread = (count, baseA, spd, d, sz, lt, ptype, pierce) => {
    for(let i=0;i<count;i++){
      const a=baseA+(i-(count-1)/2)*(0.3+count*0.05);
      projs.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
        dmg:d,size:sz,life:lt,maxLife:lt,pierce:pierce||0,type:ptype||'triple',
        hitSet:new Set(),fromBoss:true});
    }
  };
  // Helper: homing thunder bolt
  const fireHoming = (spd, d, sz, lt) => {
    projs.push({x:e.x,y:e.y,vx:Math.cos(angle2P)*spd,vy:Math.sin(angle2P)*spd,
      dmg:d,size:sz,life:lt,maxLife:lt,pierce:0,type:'lightning',hitSet:new Set(),
      homing:true, homingTarget: player});
  };

  // ╔══════════════════════════════════════╗
  // ║  アイアンピッグ  (Iron Pig)          ║
  // ╚══════════════════════════════════════╝
  if (t === 'ironpig') {
    // Combat handled by movement (charge + wall stun)
    e.attackCooldown = 99;
    return;
  }

  // ╔══════════════════════════════════════╗
  // ║  暴走耕運機  (Ironbull)              ║
  // ╚══════════════════════════════════════╝
  if (t === 'ironbull') {
    if (!bs._ibAtk) bs._ibAtk = 0;
    bs._ibAtk = (bs._ibAtk % 2) + 1;
    if (bs._ibAtk === 1) {
      // Rock throw with rock model
      _bossVoice(e,'🚜 岩投げ！','#664422');
      const rocks=phase===2?5:3;
      for(let ri=0;ri<rocks;ri++){
        setTimeout(()=>{

let _trialDefeatTimer = 0;
let _trialDefeated = false;
let _trialStartDelay = 0;
function checkBossTrialDefeated() {
  if (!player || !player._trialMode) return;
  if (state !== 'playing') return;
  if (_trialStartDelay > 0) { _trialStartDelay -= 1/60; return; }
  const boss = enemies.find(e=>e.boss);
  if (!boss && !_trialDefeated) {
    _trialDefeated = true;
    _trialDefeatTimer = 0;
    fxList.push({type:'text',x:player.x,y:player.y-80,text:'🎉 ボス撃破！おめでとう！',life:3,color:'#ffcc00',vy:-20,big:true});
    for(let ri=0;ri<6;ri++) fxList.push({type:'ring',x:player.x,y:player.y,r:0,maxR:300+ri*60,life:1.5,color:ri%2?'#ff66cc':'#ffcc00'});
  }
  if (_trialDefeated) {
    _trialDefeatTimer += 1/60;
    if (_trialDefeatTimer > 0.5) {   // ← 3.5s → 0.5s: 即終了
      _trialDefeated = false;
      _trialDefeatTimer = 0;
      player._trialMode = false;
      state = 'bossTrialSelect';
      bossTrialState = 'bossSelect';
      deactivateArena();
      enemies.length = 0;
      playHomeBGM()
    }
  }
}

function checkStageBossDefeated() {
  if (player && player._trialMode) return;
  if (!stageFinalBossSpawned || stageFinalBossDefeated) return;
  // Don't trigger if boss hasn't been pushed to enemies yet (blueChest pending)
  if (_blueChestPending === 'finalBoss' || state === 'blueChest') return;
  const boss = enemies.find(e => e.isFinalBoss);
  if (!boss) {
    stageFinalBossDefeated = true;
    const stg = STAGES[selectedStage] || STAGES[0];
    startStageEnding(stg.id);
  }
}

// Wire rootTrap + magicCircle FX into updateFX
function processBossSpecialFX(f, dt) {
  if (f.type === 'rootTrap') {
    // Slow player if standing in it
    if (!player) return;
    const dx=player.x-f.x, dy=player.y-f.y;
    if (Math.sqrt(dx*dx+dy*dy) < f.r) {
      player._slowDebuff = (player._slowDebuff||0) + dt * f.slowAmt;
    }
  } else if (f.type === 'magicCircle') {
    // Damage player if in circle when life expires
    if (f.life <= 0.2 && !f.struck && player) {
      const dx=player.x-f.x, dy=player.y-f.y;
      if (Math.sqrt(dx*dx+dy*dy) < f.r) {
        player.hp -= f.dmg;
        fxList.push({type:'ring',x:f.x,y:f.y,r:0,maxR:f.r,life:0.5,color:'#8888ff'});
        f.struck = true;
      }
    }
  }
}

let stageEndingActive = false;
let stageEndingT = 0;
let stageEndingScene = 0;
let stageEndingId = '';
let stageEndingScore = 0;

function startStageEnding(stageId) {
  _achStageClear[stageId] = true;
  stageEndingActive = true;
  stageEndingT = 0;
  stageEndingScene = 0;
  stageEndingId = stageId;
  stageEndingScore = killCount*120 + Math.floor(gameTime*10) + (player?player.level*500:0);
  state = 'stageending';
  try { stopBGM(); setTimeout(()=>{ try{playBGM(STAGE_ENDING_DATA[stageId]?.bgm||'title');}catch(e2){} }, 500); } catch(e2){}
}

function drawStageEnding(dt) {
  stageEndingT += dt;
  const data = STAGE_ENDING_DATA[stageEndingId];
  if (!data) { state='title'; readyToPlay=false; return; }
  const scenes = data.scenes;
  if (stageEndingScene >= scenes.length + 1) {
    state = 'title'; readyToPlay = false;
    try { playBGM('title'); } catch(e2) {}
    return;
  }
  if (stageEndingT > 5 && stageEndingScene < scenes.length) {
    stageEndingScene++; stageEndingT = 0; return;
  }

  const sc = stageEndingScene < scenes.length ? scenes[stageEndingScene] : null;
  if (!sc) {
    // Score scene
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0a0020'); bg.addColorStop(1,'#150030');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#ffddff'; ctx.font='bold 26px monospace';
    ctx.shadowBlur=16; ctx.shadowColor='#ff88cc';
    ctx.fillText(`${data.title} - クリア！`, W/2, H*0.22);
    const rows = [
      ['⏱ タイム', `${String(Math.floor(gameTime/60)).padStart(2,'0')}:${String(Math.floor(gameTime%60)).padStart(2,'0')}`],
      ['💀 撃破数', `${killCount} 体`],
      ['⭐ レベル', `Lv.${player?player.level:'?'}`],
      ['🏆 スコア', stageEndingScore.toLocaleString()],
    ];
    rows.forEach(([lbl,val],i) => {
      const ry=H*0.38+i*52;
      ctx.fillStyle='rgba(30,10,60,0.75)'; rr(ctx,W/2-180,ry-18,360,36,8); ctx.fill();
      ctx.fillStyle='#aaaacc'; ctx.font='14px monospace'; ctx.textAlign='left';
      ctx.fillText(lbl, W/2-165, ry); ctx.fillStyle='#ffffff'; ctx.font='bold 16px monospace'; ctx.textAlign='right';
      ctx.fillText(val, W/2+170, ry);
    });
    ctx.fillStyle='#664488'; ctx.font='12px monospace'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('クリック / タップで続く', W/2, H-10);
    ctx.shadowBlur=0;
    return;
  }

  // Scene rendering
  const fadeIn=Math.min(1,stageEndingT*1.5), fadeOut=Math.max(0,1-(stageEndingT-4)*3);
  const alpha=Math.max(0, fadeIn*fadeOut);
  const bg2=ctx.createLinearGradient(0,0,0,H);
  bg2.addColorStop(0,sc.bg[0]); bg2.addColorStop(1,sc.bg[1]);
  ctx.fillStyle=bg2; ctx.fillRect(0,0,W,H);

  ctx.save(); ctx.globalAlpha=Math.max(0,alpha); ctx.textAlign='center'; ctx.textBaseline='middle';

  // Stage title
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=Math.max(0,alpha);

  const bg3=ctx.createLinearGradient(0,0,0,H);
  bg3.addColorStop(0,sc.bg[0]); bg3.addColorStop(1,sc.bg[1]);
  ctx.fillStyle=bg3; ctx.globalAlpha=1; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=Math.max(0,alpha);

  ctx.font='80px serif'; ctx.fillText(sc.emoji, W/2, H*0.3);
  ctx.fillStyle='#ffffff'; ctx.font='bold 22px monospace';
  ctx.shadowBlur=15; ctx.shadowColor='#ffddff';
  sc.text.split('\n').forEach((line,li)=>ctx.fillText(line, W/2, H*0.58+li*32));
  // Cats at bottom
  CHARS.forEach((ch,i)=>{
    const bob=Math.sin(stageEndingT*2.5+i)*10;
    if(imgs[ch.id]&&imgs[ch.id].complete){ctx.imageSmoothingEnabled=false;ctx.drawImage(imgs[ch.id],65+i*130,H*0.78+bob,52,62);}
  });
  ctx.restore();
  ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle='#554477'; ctx.font='10px monospace';
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillText('スキップ→クリック', W-10, H-6); ctx.restore();
}

// Per-boss state machine
function getBossState(e) {
  if (!e._bs) e._bs = {
    phase: 1, timer: 0, cd: 3.0,
    motionType: 'idle', motionT: 0,
    stun: 0,          // stun seconds remaining
    barrierHP: 0,      // mirror boss
    arenaActive: false,
    subState: '',
    subTimer: 0,
    // position history for mirror mage
    posHistory: [],
    // ironpig running
    runAngle: Math.random()*Math.PI*2,
    runSpeed: 0,
    wallBounce: 0,
    // ironbull spin
    spinning: false,
    spinAngle: 0,
    chargeDir: 0,
    chargeActive: false,
    // dragon confusion
    confusionActive: false,
    confusionT: 0,
    // mirror boss stacks
    mirrorHP: [0,0,0],
    mirrorAlive: [true,true,true],
    // skeleton baron sword
    swordActive: false,
    swordT: 0,
    // flameking shield
    shieldSpots: [],
  };
  return e._bs;
}

// Apply stun to enemy
function stunEnemy(e, duration) {
  const bs = getBossState(e);
  bs.stun = Math.max(bs.stun, duration);
  bs.motionType = 'stunned';
  fxList.push({type:'text',x:e.x,y:e.y-60,text:'😵 STUN！',life:1.5,color:'#ffff44',vy:-20,big:false});
  for(let r=0;r<3;r++) fxList.push({type:'ring',x:e.x,y:e.y,r:0,maxR:80+r*20,life:0.6,color:'#ffff00'});
}

// ── Draw boss state overlay (stun stars, etc.) ──
function drawBossStateOverlay(e, sx, sy) {
  const bs = getBossState(e);
  if (bs.stun > 0) {
    ctx.save(); ctx.font='20px serif';
    for(let i=0;i<3;i++){
      const sa=(i/3)*Math.PI*2+gameTime*4;
      ctx.fillText('⭐',sx+Math.cos(sa)*e.r*0.7,sy-e.r-10+Math.sin(sa)*8);
    }
    ctx.restore();
  }
  // Ironpig: barrier ring when running
  if ((e.type==='ironpig') && bs.stun<=0) {
    ctx.save(); ctx.globalAlpha=0.35; ctx.strokeStyle='#ff4400';
    ctx.lineWidth=2.5; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.arc(sx,sy,e.r+8,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
  // Mirror boss: mirror shards
  if ((e.type==='mastermirror') && bs.barrierHP>0) {
    ctx.save(); ctx.globalAlpha=0.6; ctx.strokeStyle='#cc88ff';
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,sy,e.r+12,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(180,130,255,0.12)';
    ctx.beginPath(); ctx.arc(sx,sy,e.r+12,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // Dragon confusion indicator
  if (e.type==='snowdragon' && bs.confusionActive) {
    ctx.save(); ctx.globalAlpha=0.7; ctx.font='bold 11px monospace';
    ctx.fillStyle='#88ccff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const ctLabel='↕⇄ 混乱中！'; ctx.fillText(ctLabel,sx,sy-e.r-16);
    ctx.restore();
  }
}

// ─── Arena system ───
let arenaActive = false;
let arenaX=0, arenaY=0, arenaHW=240, arenaHH=200;
let arenaType = ''; // 'ring'|'field'

function activateArena(cx, cy, type) {
  arenaActive = true;
  arenaX = cx; arenaY = cy;
  arenaHW = 360; arenaHH = 280; // Wider arena
  arenaType = type;
  // Teleport player to center of arena
  if (player) {
    player.x = cx; player.y = cy;
  }
  // Spawn boss near arena edge (will be set by calling code)
  // Boss entities spawned separately
}
function deactivateArena() { arenaActive = false; }

function constrainToArena(obj, r) {
  if (!arenaActive) return;
  const pad = (r||20) + 8;
  obj.x = Math.max(arenaX - arenaHW + pad, Math.min(arenaX + arenaHW - pad, obj.x));
  obj.y = Math.max(arenaY - arenaHH + pad, Math.min(arenaY + arenaHH - pad, obj.y));
}
function constrainPlayerToArena() {
  if (!arenaActive || !player) return;
  constrainToArena(player, 20);
  // Also constrain boss entities to arena
  if (arenaActive) {
    for (const e of enemies) {
      if (e.boss) constrainToArena(e, e.r||30);
    }
  }
}

function drawArena() {
  if (!arenaActive) return;
  const sx=arenaX-cam.x, sy=arenaY-cam.y;

    ctx.strokeStyle='#8B6914'; ctx.lineWidth=18;
    ctx.strokeRect(sx-hw,sy-hh,hw*2,hh*2);
    ctx.strokeStyle='#cc9944'; ctx.lineWidth=6;
    ctx.strokeRect(sx-hw,sy-hh,hw*2,hh*2);
    ctx.strokeStyle='rgba(255,200,80,0.5)'; ctx.lineWidth=2;
    ctx.strokeRect(sx-hw-8,sy-hh-8,hw*2+16,hh*2+16);

    [[sx-hw,sy-hh],[sx+hw,sy-hh],[sx-hw,sy+hh],[sx+hw,sy+hh]].forEach(([cx2,cy2])=>{

      ctx.strokeStyle='#ffcc44'; ctx.lineWidth=2; ctx.strokeRect(cx2-14,cy2-14,28,28);
    });
    // Crowd fill hint
    ctx.globalAlpha=0.04; ctx.fillStyle='#884400';
    ctx.fillRect(sx-hw,sy-hh,hw*2,hh*2);
    // "VS" banner
    ctx.globalAlpha=0.8;
    ctx.fillStyle='#ff6600'; ctx.font='bold 16px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=10; ctx.shadowColor='#ff4400';
    ctx.fillText('🏟️ 闘技場', sx, sy-hh+14);
    ctx.shadowBlur=0;
  } else if (arenaType==='field') {
    // Ironbull: farmland SQUARE
    ctx.globalAlpha=0.14; ctx.fillStyle='#556633';
    ctx.fillRect(sx-hw,sy-hh,hw*2,hh*2);
    // Soil rows
    ctx.globalAlpha=0.25; ctx.strokeStyle='rgba(100,160,50,0.5)'; ctx.lineWidth=1.5;
    for(let row=-6;row<=6;row++){
      const ry=sy+row*32;
      ctx.beginPath(); ctx.moveTo(sx-hw,ry); ctx.lineTo(sx+hw,ry); ctx.stroke();
    }
    // Fence border
    ctx.globalAlpha=0.85;
    ctx.strokeStyle='#885522'; ctx.lineWidth=14;
    ctx.strokeRect(sx-hw,sy-hh,hw*2,hh*2);
    ctx.strokeStyle='#ddaa44'; ctx.lineWidth=4;
    ctx.strokeRect(sx-hw,sy-hh,hw*2,hh*2);
    // Fence posts
    const postGap=60;
    for(let px2=sx-hw;px2<=sx+hw;px2+=postGap){
      ctx.fillStyle='#664422'; ctx.fillRect(px2-5,sy-hh-10,10,20);
      ctx.fillRect(px2-5,sy+hh-10,10,20);
    }
    for(let py2=sy-hh;py2<=sy+hh;py2+=postGap){
      ctx.fillStyle='#664422'; ctx.fillRect(sx-hw-10,py2-5,20,10);
      ctx.fillRect(sx+hw-10,py2-5,20,10);
    }
    ctx.globalAlpha=0.8; ctx.fillStyle='#ddaa44'; ctx.font='bold 15px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=8; ctx.shadowColor='#aa6600';
    ctx.fillText('🌾 畑バトル', sx, sy-hh+14);
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

// ─── Update boss movement per boss type ───
function updateBossMovement(e, dt) {
  const bs = getBossState(e);
  if (!player) return;
  const pdx=player.x-e.x, pdy=player.y-e.y;
  const pdist=Math.sqrt(pdx*pdx+pdy*pdy)||1;

  // stun: stop moving
  if (bs.stun > 0) {
    bs.stun -= dt;
    e.knockX *= 0.8; e.knockY *= 0.8;
    // Make stunned boss damageable
    e._stunDamageable = true;
    return;
  }
  e._stunDamageable = false;

  // ─ Iron pig: runs around, charges straight at player, stuns on wall ─
  if (e.type === 'ironpig') {
    if (!arenaActive) { activateArena(e.x, e.y, 'ring'); }
    // Arena bounds (square)
    const aL=arenaX-arenaHW+e.r+10, aR=arenaX+arenaHW-e.r-10;
    const aT=arenaY-arenaHH+e.r+10, aB=arenaY+arenaHH-e.r-10;

    if (!bs._chargeT) bs._chargeT = 1.5;
    if (!bs._charging) bs._charging = false;

    // Check wall collision while charging → stun!
    if (bs._charging) {
      const nx=e.x+Math.cos(bs.runAngle)*550*dt;
      const ny=e.y+Math.sin(bs.runAngle)*550*dt;
      const hitWall = nx<aL||nx>aR||ny<aT||ny>aB;
      if (hitWall) {
        // STUN!
        bs._charging = false;
        stunEnemy(e, 3.0);
        fxList.push({type:'text',x:e.x,y:e.y-60,text:'💫 ドン！スタン！',life:2,color:'#ffff44',vy:-20,big:true});
        fxList.push({type:'ring',x:e.x,y:e.y,r:0,maxR:100,life:0.6,color:'#884400'});
        e.x = Math.max(aL, Math.min(aR, nx));
        e.y = Math.max(aT, Math.min(aB, ny));
      } else {
        e.x = nx; e.y = ny;
      }
      return;
    }

    // Circling movement (non-charge)
    if (!bs._circling) { bs._circling=true; bs._circleAngle=Math.random()*Math.PI*2; }
    bs._circleAngle += dt * (1.8 + bs.phase*0.4);
    const targetX = arenaX + Math.cos(bs._circleAngle)*(arenaHW*0.55);
    const targetY = arenaY + Math.sin(bs._circleAngle)*(arenaHH*0.55);
    const tdx=targetX-e.x, tdy=targetY-e.y, td=Math.sqrt(tdx*tdx+tdy*tdy)||1;
    const circleSpd = (200+bs.phase*50)*dt;
    e.x += (tdx/td)*circleSpd;
    e.y += (tdy/td)*circleSpd;

    // Charge countdown
    bs._chargeT -= dt;
    if (bs._chargeT <= 0) {
      bs._chargeT = 2.2 - bs.phase*0.3;
      bs._charging = true;
      bs.runAngle = Math.atan2(pdy, pdx);  // STRAIGHT at player
      fxList.push({type:'text',x:e.x,y:e.y-60,text:'🐷 突進！！',life:1,color:'#ff4400',vy:-20,big:true});
      fxList.push({type:'ring',x:e.x,y:e.y,r:0,maxR:60,life:0.4,color:'#ff4400'});
    }
    return;
  }

  // Crab general: fast sideways movement
  if (e.type === 'crabgeneral') {
    if (!bs._crabAngle) bs._crabAngle = Math.atan2(pdy,pdx)+Math.PI/2;
    bs._crabAngle += dt*1.2;
    const spd=(e.spd*60+100)*dt;
    e.x += Math.cos(bs._crabAngle)*spd;
    e.y += Math.sin(bs._crabAngle)*spd*0.5;
    // Drift toward player
    e.x += (pdx/pdist)*spd*0.3;
    e.y += (pdy/pdist)*spd*0.3;
    return;
  }

  // Ironbull: charge-based movement (like ironpig)
  if (e.type === 'ironbull') {
    if (!arenaActive) { activateArena(e.x,e.y,'field'); }
    const aL=arenaX-arenaHW+e.r+15, aR=arenaX+arenaHW-e.r-15;
    const aT=arenaY-arenaHH+e.r+15, aB=arenaY+arenaHH-e.r-15;
    if(!bs._ibCharging) bs._ibCharging=false;
    if(!bs._ibChargeT) bs._ibChargeT=2.0;
    if(bs.stun>0) return;

    if(bs._ibCharging){
      // Charging
      const nx=e.x+Math.cos(bs.runAngle)*520*dt;
      const ny=e.y+Math.sin(bs.runAngle)*520*dt;
      const hitWall=nx<aL||nx>aR||ny<aT||ny>aB;
      if(hitWall){
        bs._ibCharging=false;
        // Wall bounce - reverse and charge again (phase2) or stop
        if(bs.phase===2){
          const wallA=Math.atan2(ny-arenaY,nx-arenaX);
          bs.runAngle=wallA+Math.PI+(Math.random()-0.5)*0.3;
          bs._ibChargeT=0.6;
        }
        e.x=Math.max(aL,Math.min(aR,nx)); e.y=Math.max(aT,Math.min(aB,ny));
      } else {
        e.x=nx; e.y=ny;
      }
      return;
    }
    // Circling
    if(!bs._ibCircleAngle) bs._ibCircleAngle=Math.random()*Math.PI*2;
    bs._ibCircleAngle+=dt*(1.2+bs.phase*0.3);
    const tx2=arenaX+Math.cos(bs._ibCircleAngle)*(arenaHW*0.5);
    const ty2=arenaY+Math.sin(bs._ibCircleAngle)*(arenaHH*0.5);
    const td=Math.sqrt((tx2-e.x)**2+(ty2-e.y)**2)||1;
    e.x+=(tx2-e.x)/td*(180+bs.phase*40)*dt;
    e.y+=(ty2-e.y)/td*(180+bs.phase*40)*dt;
    // Charge timer
    bs._ibChargeT-=dt;
    if(bs._ibChargeT<=0){
      bs._ibChargeT=2.0-bs.phase*0.3;
      bs._ibCharging=true;
      bs.runAngle=Math.atan2(pdy,pdx);
      fxList.push({type:'text',x:e.x,y:e.y-60,text:'🚜 突進！！',life:0.8,color:'#884400',vy:-20,big:true});
      fxList.push({type:'ring',x:e.x,y:e.y,r:0,maxR:60,life:0.35,color:'#884400'});
    }
    return;
  }

  // Mastermirror: not moveable normally – only warps
  if(e.type==='mastermirror'&&mirrorShards.length>0){return;}
}

// ─── override takeDmg for special bosses ───
function bossSpecialTakeDmg(e, amount, iframes, fromX, fromY) {
  const bs = getBossState(e);
  // Ironpig: only take damage when stunned
  if (e.type === 'ironpig') {
    if (!bs._stunDamageable && bs.stun <= 0) {
      // Show deflect
      fxList.push({type:'text',x:e.x,y:e.y-50,text:'💨 効かない！',life:0.8,color:'#aaaaaa',vy:-15,big:false});
      return false;
    }
  }
  // Mastermirror: only when stunned
  if(e.type==='mastermirror'&&mirrorShards.length>0){fxList.push({type:'text',x:e.x,y:e.y-50,text:'🪞 鏡が盾！',life:0.5,color:'#cc88ff',vy:-10,big:false});return false;}
  return null; // proceed normally
}



// ■ BEAM SYSTEM
let activeBeams=[],lightningSword=null,yetiBreath=[],mirrorShards=[];
function spawnBeam(sx,sy,angle,length,color,width,life,bid){activeBeams.push({sx,sy,angle,length,color,width:width||18,life:life||0.7,maxLife:life||0.7,bid:bid||'',t:0});}
function _bwh(h,a){try{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${0|r+(255-r)*a},${0|g+(255-g)*a},${0|b+(255-b)*a})`;}catch(e){return'#fff';}}
function updateBeams(dt){for(let i=activeBeams.length-1;i>=0;i--){const b=activeBeams[i];b.life-=dt;b.t+=dt;if(b.life<=0){activeBeams.splice(i,1);continue;}if(player&&player.invincible<=0){const dx=player.x-b.sx,dy=player.y-b.sy,proj=dx*Math.cos(b.angle)+dy*Math.sin(b.angle);if(proj>=0&&proj<=b.length&&Math.abs(-dx*Math.sin(b.angle)+dy*Math.cos(b.angle))<b.width*0.55+16){player.hp-=0.9*dt*60;player.invincible=0.05;player.flashLife=0.06;}}}}
function drawBeams(){for(const b of activeBeams){const alpha=Math.min(1,b.life/b.maxLife*3);if(alpha<=0)continue;const ssx=b.sx-cam.x,ssy=b.sy-cam.y,ex=b.sx+Math.cos(b.angle)*b.length-cam.x,ey=b.sy+Math.sin(b.angle)*b.length-cam.y;ctx.save();ctx.globalAlpha=Math.min(1,alpha*0.9);ctx.lineCap='round';ctx.shadowBlur=35;ctx.shadowColor=b.color;ctx.strokeStyle=b.color;ctx.lineWidth=b.width;ctx.beginPath();ctx.moveTo(ssx,ssy);ctx.lineTo(ex,ey);ctx.stroke();ctx.shadowBlur=14;ctx.strokeStyle=_bwh(b.color,0.45);ctx.lineWidth=b.width*0.42;ctx.beginPath();ctx.moveTo(ssx,ssy);ctx.lineTo(ex,ey);ctx.stroke();ctx.shadowBlur=4;ctx.strokeStyle='rgba(255,255,255,0.88)';ctx.lineWidth=Math.max(1.5,b.width*0.14);ctx.beginPath();ctx.moveTo(ssx,ssy);ctx.lineTo(ex,ey);ctx.stroke();const seg=Math.floor(b.length/45);for(let pi=0;pi<seg;pi++){const pt=((pi/seg)+b.t*2.5)%1;ctx.globalAlpha=alpha*0.65;ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(ssx+Math.cos(b.angle)*pt*b.length,ssy+Math.sin(b.angle)*pt*b.length,b.width*0.2,0,Math.PI*2);ctx.fill();}ctx.restore();}}
function spawnDragonLaser(angle,wx,wy){['#ff4444','#ff8844','#ffee44','#44ff44','#44ffff','#4488ff','#cc44ff'].forEach((col,ci)=>{activeBeams.push({sx:wx,sy:wy,angle:angle+(ci-3)*0.012,length:1600,color:col,width:7+Math.abs(ci-3)*5,life:1.5,maxLife:1.5,bid:'dragon',t:0});});}
function spawnLightningSword(wx,wy){lightningSword={x:wx,y:wy,life:2.2,maxLife:2.2,swingDone:false};}
function updateLightningSword(dt){if(!lightningSword)return;lightningSword.life-=dt;if(lightningSword.life<=0){lightningSword=null;return;}const prog=1-lightningSword.life/lightningSword.maxLife;if(prog>0.5&&!lightningSword.swingDone){lightningSword.swingDone=true;if(player&&player.invincible<=0){const dx=player.x-lightningSword.x,dy=player.y-lightningSword.y;if(Math.abs(dy)<160&&Math.abs(dx)<390){player.hp-=90;player.invincible=0.6;player.flashLife=0.3;fxList.push({type:'text',x:player.x,y:player.y-60,text:'\u26a1 \u96f7\u306e\u5927\u5263\uff01',life:1.5,color:'#aaddff',vy:-25,big:true});}}for(let ri=0;ri<4;ri++)fxList.push({type:'ring',x:lightningSword.x,y:lightningSword.y,r:ri*60,maxR:420+ri*40,life:0.8,color:ri%2?'#aaddff':'#4455ff'});}}
function drawLightningSword() {
  if (!lightningSword) return;
  const prog = 1 - lightningSword.life / lightningSword.maxLife;
  const sx = lightningSword.x - cam.x, sy = lightningSword.y - cam.y;
  const alpha = Math.min(1, (lightningSword.life / lightningSword.maxLife) * 2);
  ctx.save(); ctx.globalAlpha = alpha;

  if (prog < 0.45) {
    // Charge phase: electricity gathers above boss
    const cp = prog / 0.45;
    ctx.shadowBlur = 20 + cp * 30; ctx.shadowColor = '#aaddff';
    ctx.translate(sx, sy);
    // Lightning gathering effect
    for (let i = 0; i < 10; i++) {
      const la = Math.random() * Math.PI * 2, lr = 50 + Math.random() * 80;
      ctx.strokeStyle = i % 2 ? '#8899ff' : '#aaddff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(Math.cos(la) * lr, -100 - cp * 60);
      ctx.lineTo(0, -100); ctx.stroke();
    }
    // Sword silhouette forming
    ctx.globalAlpha = alpha * cp * 0.5;
    ctx.fillStyle = 'rgba(136,153,255,0.5)';
    ctx.fillRect(-10, -100 - cp * 250, 20, cp * 250);
    // Energy ball
    ctx.globalAlpha = alpha * cp;
    ctx.fillStyle = `rgba(136,153,255,${cp * 0.8})`;
    ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(0, -100 - cp * 60, 15 + cp * 20, 0, Math.PI * 2); ctx.fill();
  } else {
    // Swing phase: sword swings from upper area downward
    const sp = (prog - 0.45) / 0.55;
    // Sword swings from raised position (-120 degrees) to down (+30 degrees)
    const swAngle = -Math.PI * 0.75 + sp * Math.PI * 1.1;
    const swLen = 380, swW = 16;

    ctx.translate(sx, sy);
    ctx.rotate(swAngle);

    ctx.shadowBlur = 30; ctx.shadowColor = '#aaddff';

    // Swing trail (arc behind blade)
    ctx.globalAlpha = alpha * (1 - sp) * 0.35;
    ctx.fillStyle = 'rgba(100,140,255,0.25)';
    ctx.beginPath();
    ctx.arc(0, 0, swLen * 0.7, -Math.PI * 0.75, swAngle - 0.05, false);
    ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

    ctx.globalAlpha = alpha;
    // Blade gradient
    const bladeGrad = ctx.createLinearGradient(0, 0, 0, -swLen);
    bladeGrad.addColorStop(0, 'rgba(200,230,255,0.95)');
    bladeGrad.addColorStop(0.3, 'rgba(150,200,255,0.9)');
    bladeGrad.addColorStop(0.8, 'rgba(100,150,255,0.7)');
    bladeGrad.addColorStop(1, 'rgba(80,100,255,0)');
    ctx.fillStyle = bladeGrad;
    ctx.beginPath();
    ctx.moveTo(-swW / 2, 25); ctx.lineTo(swW / 2, 25);
    ctx.lineTo(swW * 0.15, -swLen); ctx.lineTo(-swW * 0.15, -swLen);
    ctx.closePath(); ctx.fill();

    // Crossguard
    ctx.fillStyle = 'rgba(180,210,255,0.85)';
    ctx.fillRect(-30, 18, 60, 14);

    // White core
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(-2.5, 25, 5, -swLen * 0.75);

    // Electric sparks on blade
    ctx.globalAlpha = alpha * 0.85;
    for (let i = 0; i < 7; i++) {
      const by = -Math.random() * swLen * 0.9;
      ctx.fillStyle = 'rgba(200,230,255,0.9)';
      ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc((Math.random() - 0.5) * swW * 0.8, by, 3 + Math.random() * 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function spawnYetiBreath(bx,by,angle,phase){
  const cnt=phase===2?32:20;
  for(let i=0;i<cnt;i++){
    const sp=(Math.random()-0.5)*0.70;  // wider spread to match hitbox
    const spd=190+Math.random()*110;
    const sz=18+Math.random()*22;       // much larger particles
    yetiBreath.push({x:bx,y:by,vx:Math.cos(angle+sp)*spd,vy:Math.sin(angle+sp)*spd,
      life:0.9+Math.random()*0.5,maxLife:1.4,size:sz});
  }
}
function updateYetiBreath(dt){
  for(let i=yetiBreath.length-1;i>=0;i--){
    const p=yetiBreath[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt;
    if(p.life<=0){yetiBreath.splice(i,1);continue;}
    // Hitbox matches visual: use p.size directly
    if(player&&player.invincible<=0){
      const dx=p.x-(player.x-cam.x),dy=p.y-(player.y-cam.y);
      if(Math.sqrt(dx*dx+dy*dy)<p.size+14){
        player.hp-=0.28; player.invincible=0.05;
        player._blizzardTimer=(player._blizzardTimer||0)+0.3;
      }
    }
  }
}
function drawYetiBreath(){
  for(const p of yetiBreath){
    ctx.save();
    ctx.globalAlpha=(p.life/p.maxLife)*0.75;
    const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
    gr.addColorStop(0,'rgba(220,245,255,0.95)');
    gr.addColorStop(0.4,'rgba(140,210,255,0.65)');
    gr.addColorStop(0.75,'rgba(100,180,240,0.3)');
    gr.addColorStop(1,'rgba(160,220,255,0)');
    ctx.fillStyle=gr;
    ctx.shadowBlur=10; ctx.shadowColor='rgba(160,220,255,0.6)';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function spawnMirrorShards(wx,wy,count){mirrorShards=[];for(let i=0;i<count;i++){const a=(i/count)*Math.PI*2;mirrorShards.push({x:wx+Math.cos(a)*180,y:wy+Math.sin(a)*180,angle:a,hp:130,maxHp:130,alive:true,shootTimer:1.2+i*0.6});}}
function updateMirrorShards(dt, bossE) {
  if(!bossE) return;
  for(const sh of mirrorShards){
    if(!sh.alive) continue;
    sh.shootTimer-=dt;
    if(sh.shootTimer<=0 && player){
      sh.shootTimer=2.0;
      const ba=Math.atan2(player.y-sh.y,player.x-sh.x);
      for(let i=0;i<3;i++){
        const a2=ba+(i-1)*0.28;
        projs.push({x:sh.x,y:sh.y,vx:Math.cos(a2)*155,vy:Math.sin(a2)*155,
          dmg:bossE.dmg*0.35,size:9,life:3.5,maxLife:3.5,pierce:0,
          type:'lightning',hitSet:new Set(),fromBoss:true});
      }
    }
    // Check projectile hits (including area weapons — allow all player projs to hit mirrors)
    for(const p of projs){
      if(p.fromBoss) continue;        // boss projectiles don't break mirrors
      if(p.hitSet.has(sh)) continue;  // already hit this mirror this frame
      const dist2=Math.sqrt((p.x-sh.x)**2+(p.y-sh.y)**2);
      if(dist2 < p.size+26){
        sh.hp -= p.dmg;
        p.hitSet.add(sh);
        fxList.push({type:'ring',x:sh.x,y:sh.y,r:0,maxR:45,life:0.3,color:'#cc88ff'});
        if(sh.hp<=0){
          sh.alive=false;
          fxList.push({type:'text',x:sh.x,y:sh.y-40,text:'🪞 破壊！',life:1.5,color:'#cc88ff',vy:-18,big:false});
        }
        break;
      }
    }
    // Also accept area damage from orbit/aura weapons (they damage via rings, not projs)
    if(sh.alive && player){
      // Check active weapons area damage — orbit ring
      for(const aw of (activeWeapons||[])){
        if(aw.type==='orbitRing'||aw.type==='auraRing'){
          const dx=sh.x-aw.x, dy=sh.y-aw.y;
          if(Math.sqrt(dx*dx+dy*dy)<(aw.r||40)+26 && !aw._mirrorHitSet){
            aw._mirrorHitSet=new Set();
          }
          if(aw._mirrorHitSet && !aw._mirrorHitSet.has(sh)){
            aw._mirrorHitSet.add(sh);
            sh.hp -= (aw.dmg||5);
            fxList.push({type:'ring',x:sh.x,y:sh.y,r:0,maxR:30,life:0.2,color:'#cc88ff'});
            if(sh.hp<=0){
              sh.alive=false;
              fxList.push({type:'text',x:sh.x,y:sh.y-40,text:'🪞 破壊！',life:1.5,color:'#cc88ff',vy:-18,big:false});
            }
          }
        }
      }
    }
  }
  const alive=mirrorShards.filter(s=>s.alive).length;
  if(alive===0 && mirrorShards.length>0 && !bossE._shardStunCD){
    mirrorShards=[];
    bossE._shardStunCD=true;
    stunEnemy(bossE,3.5);
    fxList.push({type:'text',x:bossE.x,y:bossE.y-80,text:'🪞 全鏡破壊！スタン！',life:3,color:'#ffcc00',vy:-20,big:true});
    setTimeout(()=>{if(bossE)bossE._shardStunCD=false;},5000);
  }
}
function drawMirrorShards(){for(const sh of mirrorShards){if(!sh.alive)continue;const sx=sh.x-cam.x,sy=sh.y-cam.y,hpR=sh.hp/sh.maxHp;ctx.save();ctx.translate(sx,sy);ctx.rotate(sh.angle+gameTime*0.6);ctx.shadowBlur=14;ctx.shadowColor='#aa88ff';ctx.fillStyle=`rgba(180,150,255,${0.3+hpR*0.45})`;ctx.strokeStyle=hpR>0.5?'#cc88ff':'#ff8866';ctx.lineWidth=2.2;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-13,-30,26,60,3);else ctx.rect(-13,-30,26,60);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(-9,-26,7,52);ctx.restore();ctx.save();const bw=32;ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(sx-bw/2,sy+34,bw,5);ctx.fillStyle=hpR>0.5?'#88ff88':'#ff8844';ctx.fillRect(sx-bw/2,sy+34,bw*hpR,5);ctx.restore();}}
