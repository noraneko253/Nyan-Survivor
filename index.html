    const ty = target ? target.y + randRange(-30, 30) : player.y + randRange(-150, 150);
    const count = 1 + Math.floor(w.level / 2);
    for (let i = 0; i < count; i++) {
      puddles.push({
        x: tx + randRange(-40, 40) * i, y: ty + randRange(-40, 40) * i,
        r: (45 + w.level * 8) * rng,
        dmg: (2.5 + w.level * 0.5) * dm,
        life: 2.5 + w.level * 0.3,
        tickTimer: 0
      });
    }
  }
}

// ---- TORNADO ----
function updateTornado(w, dt, dm, rm, rng) {
  const cd = Math.max(1.5, (5.0 - w.level * 0.5) * rm);
  if (w.timer <= 0) {
    w.timer = cd;
    const a = Math.random() * Math.PI * 2;
    tornados.push({
      x: player.x + Math.cos(a) * 100,
      y: player.y + Math.sin(a) * 100,
      vx: Math.cos(a + Math.PI / 2) * 60, vy: Math.sin(a + Math.PI / 2) * 60,
      r: (55 + w.level * 10) * rng,
      dmg: (8 + w.level * 2) * dm,
      life: 4.0 + w.level * 0.5,
      tickTimer: 0, angle: 0
    });
  }
}

// Update puddles and tornados
function updateSpecialWeapons(dt) {
  // Puddles
  for (let i = puddles.length - 1; i >= 0; i--) {
    const p = puddles[i];
    p.life -= dt;
    p.tickTimer -= dt;
    if (p.tickTimer <= 0) {
      p.tickTimer = 0.4;
      for (const e of enemies) {
        if (dist(p.x, p.y, e.x, e.y) < p.r + e.r)
          e.takeDmg(p.dmg, 0.05, p.x, p.y);
      }
    }
    if (p.life <= 0) puddles.splice(i, 1);
  }
  // Tornados
  for (let i = tornados.length - 1; i >= 0; i--) {
    const t = tornados[i];
    t.x += t.vx * dt; t.y += t.vy * dt;
    t.angle += 5 * dt;
    t.vx *= (1 - dt * 0.3); t.vy *= (1 - dt * 0.3);
    t.life -= dt;
    t.tickTimer -= dt;
    if (t.tickTimer <= 0) {
      t.tickTimer = 0.25;
      for (const e of enemies) {
        const d = dist(t.x, t.y, e.x, e.y);
        if (d < t.r + e.r) {
          e.takeDmg(t.dmg, 0.05, t.x, t.y);
          // Slight pull toward tornado center
          const dx = t.x - e.x, dy = t.y - e.y;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          if(!e.boss){e.knockX -= (dx/len)*6; e.knockY -= (dy/len)*6;}
        }
      }
    }
    if (t.life <= 0) tornados.splice(i, 1);
  }
}

// ===== PROJECTILES =====
function spawnProj(x, y, vx, vy, dmg, size, life, pierce, type) {
  projs.push({ x, y, vx, vy, dmg, size, life, maxLife: life, pierce: pierce || 0, type, hitSet: new Set() });
}

function updateProjs(dt) {
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];

    // Boomerang curve-back logic - distance-based, never expires
    if (p.type === 'boomerang' || p.type === 'megapaw') {
      const distFromStart = dist(p.startX, p.startY, p.x, p.y);
      if (!p.returning && distFromStart >= p.maxDist) {
        p.returning = true;
        p.hitSetReturn = new Set(); p.hitSet = p.hitSetReturn;
      }
      // Always steer back toward player once returning
      if (p.returning) {
        const dx = player.x - p.x, dy = player.y - p.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const turnStrength = 2200;
        p.vx += (dx / d) * turnStrength * dt;
        p.vy += (dy / d) * turnStrength * dt;
        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const maxSpd = 560;
        if (spd > maxSpd) { p.vx *= maxSpd / spd; p.vy *= maxSpd / spd; }
        if (d < 22) { projs.splice(i, 1); continue; }
      }
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) {
      if (p.type === 'fireball') explodeFireball(p);
      projs.splice(i, 1);
      continue;
    }

    let removeProj = false;
    // ── Player projectiles hit enemies; boss projectiles SKIP enemies ──
    if (!p.fromBoss) {
      for (const e of enemies) {
        if (p.hitSet.has(e)) continue;
        if (dist(p.x, p.y, e.x, e.y) < p.size + e.r) {
          const hit = e.takeDmg(p.dmg, 0.08, p.x, p.y);
          if (hit) {
            p.hitSet.add(e);
            if (p.type === 'ice') e.slowTimer = (e.slowTimer || 0) + 1.5;
            if (p.type === 'fireball') { explodeFireball(p); removeProj = true; break; }
            if (p.pierce <= 0 || p.hitSet.size > p.pierce) { removeProj = true; break; }
          }
        }
      }
    }
    if (removeProj) { projs.splice(i, 1); continue; }

    // ── Boss projectile hits player ──
    if (p.fromBoss && player && player.invincible <= 0) {
      const pdx = p.x - player.x, pdy = p.y - player.y;
      if (Math.sqrt(pdx*pdx+pdy*pdy) < p.size + 18) {
        const _dr = player._dmgReduct || 1;
        player.hp -= p.dmg * _dr;
        player.invincible = 0.4;
        player.flashLife = 0.18;
        const pkl = Math.sqrt(pdx*pdx+pdy*pdy)||1;
        player.knockX = -(pdx/pkl)*120;
        player.knockY = -(pdy/pkl)*120;
        fxList.push({type:'ring',x:player.x,y:player.y,r:0,maxR:40,life:0.25,color:'#ff4444'});
        projs.splice(i, 1); continue;
      }
    }
  }
}

function explodeFireball(p) {
  if (!p.explodeR) return;
  fxList.push({ type: 'explosion', x: p.x, y: p.y, r: 0, maxR: p.explodeR, life: 0.5, color: '#ff8822' });
  for (const e of enemies) {
    if (!p.hitSet.has(e) && dist(p.x, p.y, e.x, e.y) < p.explodeR + e.r)
      e.takeDmg(p.explodeDmg, 0.2, p.x, p.y);
  }
}

// ===== ENEMIES UPDATE =====
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.invincible > 0) e.invincible -= dt;
    if (e.flashLife > 0) e.flashLife -= dt;
    if (e.slowTimer > 0) e.slowTimer -= dt;

    // ── Shadow clone: simple ghost-like enemy, dies quickly ──────────────
    if (e._isClone) {
      e.hp -= dt * 8; // slowly decays
      if (e.hp <= 0) { enemies.splice(i, 1); continue; }
      // Simple move toward player like a ghost
      const _cx = player.x - e.x, _cy = player.y - e.y;
      const _cd = Math.sqrt(_cx*_cx+_cy*_cy)||1;
      e.x += (_cx/_cd)*e.spd*dt*60;
      e.y += (_cy/_cd)*e.spd*dt*60;
      // Damage player on contact
      if(player && player.invincible<=0 && _cd < e.r+18){
        player.hp -= e.dmg*0.015; player.invincible=0.1; player.flashLife=0.05;
      }
      continue;
    }

    // ── 浮遊する古書: 止まって弾を飛ばす ──
    if (e.type === 'ancientbook') {
      e._shootTimer = (e._shootTimer || 0) - dt;
      if (e._shootTimer <= 0 && player) {
        e._shootTimer = 2.8 + Math.random() * 0.8;
        // Slow projectile toward player
        const abA = Math.atan2(player.y - e.y, player.x - e.x);
        const abSpd = 90 + Math.random() * 30;
        enemyBullets.push({
          x: e.x, y: e.y,
          vx: Math.cos(abA) * abSpd,
          vy: Math.sin(abA) * abSpd,
          dmg: e.dmg * 0.55,
          size: 8, life: 4.5, maxLife: 4.5,
          color: '#9944ff', glowColor: '#cc88ff',
        });
        fxList.push({ type: 'ring', x: e.x, y: e.y, r: 0, maxR: 28, life: 0.3, color: '#9944ff' });
      }
    }

    // Knockback
    if (e.knockX || e.knockY) {
      e.x += e.knockX * dt * 3.5;
      e.y += e.knockY * dt * 3.5;
      e.knockX *= (1 - dt * 9);
      e.knockY *= (1 - dt * 9);
      if (Math.abs(e.knockX) < 0.1) e.knockX = 0;
      if (Math.abs(e.knockY) < 0.1) e.knockY = 0;
    }

    // Move toward player
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const spdMod = e.slowTimer > 0 ? 0.45 : 1;
    // Boss-specific movement override (ironpig, crabgeneral, etc.)
    if (e.boss) {
      updateBossMovement(e, dt);
      // Boss-type movement:
      // ironpig, crabgeneral: fully handled by updateBossMovement
      // ironbull: partially handled (spinning only)
      // ALL other bosses: gentle drift toward player, slow (attack AI handles aggression)
      const _bt = e.type;
      const _selfMoved = ['ironpig','crabgeneral'];
      const _noMove = ['mastermirror']; // static
      if (_selfMoved.includes(_bt)) {
        // position already set in updateBossMovement – do nothing
      } else if (_noMove.includes(_bt)) {
        // stays still (handles own warping in attack AI)
      } else if (_bt === 'ironbull') {
        // handled partially in updateBossMovement
        if (e.knockX || e.knockY) {
          e.x += e.knockX * dt;
          e.y += e.knockY * dt;
          e.knockX *= (1 - dt * 5);
          e.knockY *= (1 - dt * 5);
        }
      } else {
        // All other bosses: only VERY slow drift (0.3x speed), no charging
        // They position themselves via executeBossAttack knockX/Y
        const gentleSpd = e.spd * spdMod * dt * 60 * 0.25;
        e.x += (dx / d) * gentleSpd;
        e.y += (dy / d) * gentleSpd;
      }
    } else {
      e.x += (dx / d) * e.spd * spdMod * dt * 60;
      e.y += (dy / d) * e.spd * spdMod * dt * 60;
    }

    // Separation (skip bats, limit check range, cap iterations)
    if (e.type !== 'bat' && e.type !== 'slime') {
      const maxCheck = Math.min(i, 12);  // only check up to 12 nearby
      for (let j = i - 1; j >= Math.max(0, i - maxCheck); j--) {
        const o = enemies[j];
        const sep = e.r + o.r + 4;
        const sxd = e.x - o.x, syd = e.y - o.y;
        // Quick reject: skip if too far apart (max sep for largest enemy is ~50)
        if (Math.abs(sxd) > 55 || Math.abs(syd) > 55) continue;
        const sd = Math.sqrt(sxd * sxd + syd * syd);
        if (sd < sep && sd > 0.5) {
          const push = (sep - sd) / sep * 1.1;
          e.x += (sxd / sd) * push; e.y += (syd / sd) * push;
          o.x -= (sxd / sd) * push; o.y -= (syd / sd) * push;
        }
      }
    }

    // Damage player
    if (d < e.r + 18 && player.invincible <= 0) {
      player.hp -= e.dmg * dt * 2;
      player.invincible = 0.35;
      if (Math.random() < 0.5) playSFX('hurt');
      player.knockX = -(dx / d) * 120;
      player.knockY = -(dy / d) * 120;
    }

    // ── 敵プレイヤーめり込み防止：強制押し返し ────────────────────────────
    // 接触距離より近い場合、プレイヤーを強く押し返す（無敵中でも機能）
    const _overlapDist = e.r + 14; // プレイヤー半径14px想定
    if (d < _overlapDist && d > 0.01) {
      const _pushStrength = (_overlapDist - d) / _overlapDist;
      // プレイヤーを敵から押し離す
      const _px = -(dx / d) * _pushStrength * 180 * dt;
      const _py = -(dy / d) * _pushStrength * 180 * dt;
      player.x += _px; player.y += _py;
      // 同時に敵も少し後退させる（ボス以外）
      if (!e.boss) {
        e.x += (dx / d) * _pushStrength * 60 * dt;
        e.y += (dy / d) * _pushStrength * 60 * dt;
      }
    }

    // Death
    if (e.hp <= 0) {
      killCount++;
      // Earn coins
      // Coins greatly reduced — most enemies have a ~20-30% chance to drop 1 coin
      let coinVal = 0;
      if (e.boss) {
        coinVal = e.isFinalBoss ? 8 : 5; // boss drops
      } else {
        // Elite enemies: small guaranteed drop; commons: random chance
        const rawCoin = e.type==='lavagolem'?2:e.type==='soulreaper'?2:e.type==='hellhound'?1:e.type==='stonegolem'?1:e.type==='voidknight'?1:0;
        coinVal = rawCoin + (Math.random() < 0.22 ? 1 : 0);
      }
      if (coinVal > 0) {
        shopCoins += coinVal; sessionCoins += coinVal;
        if (e.boss) { saveGameData(); }
      }
      dropGems(e);
      if (e.boss) playSFX('bossapp');  // boss dies → big sound
      else if (Math.random() < 0.2) playSFX('enemydie');
      // Kill milestone messages
      const milestones = [10, 25, 50, 100, 200, 300, 500];
      if (milestones.includes(killCount)) {
        fxList.push({ type: 'text', x: player.x, y: player.y - 50,
          text: `💀 ${killCount}体撃破！`, life: 1.8, color: '#ffaa44', vy: -30, big: true });
      }
      fxList.push({ type: 'pop', x: e.x, y: e.y, r: e.r, life: 0.45, color: e.color });
      if (e.boss) {
        const _bossKillName = e.type==='boss' ? 'ぷりん殿下' : e.type==='hellboss' ? 'ヘルボス将軍' : (ENEMY_LORE[e.type]?.name || 'ボス');
        fxList.push({ type: 'text', x: e.x, y: e.y - 30, text: `👑 ${_bossKillName}を倒した！`, life: 2.5, color: '#ffcc00', vy: -30, big: true });
        if (e.type === 'boss') _achPurinDefeated = true;
        if (e.isFinalBoss) stageFinalBossDefeated = true;
        deactivateArena();
        const _midTypes = ['yeti','crabgeneral','mirrormage','ironpig','shadowwolf','boneknight','hellboss'];
        if (_midTypes.includes(e.type)) { _achMidBossDefeated = true; if(!_achMidBossTypes)_achMidBossTypes={}; _achMidBossTypes[e.type]=true; }
      fxList.push({ type: 'ring', x: e.x, y: e.y, r: 0, maxR: 160, life: 0.8, color: '#ffcc00' });
      fxList.push({ type: 'ring', x: e.x, y: e.y, r: 0, maxR: 200, life: 1.0, color: '#ff8800' });
      }
      enemies.splice(i, 1);
    }
  }
}


// ── Enemy Bullets (ancientbook etc.) ──
let enemyBullets = [];

function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { enemyBullets.splice(i, 1); continue; }
    // Hit player
    if (player && player.invincible <= 0) {
      const dx = player.x - b.x, dy = player.y - b.y;
      if (Math.sqrt(dx*dx+dy*dy) < b.size + 16) {
        player.hp -= b.dmg;
        player.invincible = 0.35; player.flashLife = 0.15;
        player.knockX = -(dx/Math.sqrt(dx*dx+dy*dy)||1)*80;
        player.knockY = -(dy/Math.sqrt(dx*dx+dy*dy)||1)*80;
        enemyBullets.splice(i, 1); continue;
      }
    }
  }
}

function drawEnemyBullets() {
  for (const b of enemyBullets) {
    const sx = b.x - cam.x, sy = b.y - cam.y;
    if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;
    const alpha = Math.min(1, b.life / b.maxLife * 3);
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.shadowBlur = 10; ctx.shadowColor = b.glowColor || b.color;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(sx, sy, b.size, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(sx - b.size*0.3, sy - b.size*0.3, b.size*0.3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ===== GEM DROP =====
function dropGems(e) {
  if (e.boss) {
    // ラスボスは宝箱を落とさない（エンディングに直行）
    if (e.isFinalBoss) return;
    // 通常ボスのみ宝箱を落とす
    chests.push({
      x: e.x, y: e.y,
      bobT: Math.random() * Math.PI * 2,
      sparkleT: 0,
      life: 30,
      open: false,
    });
    return;
  }
  const type = gemTypeForEnemy(e);
  const def = GEM_DEFS[type];
  // Always drop exactly 1 gem per non-boss enemy
  gems.push({
    x: e.x + randRange(-20, 20), y: e.y + randRange(-20, 20),
    type, def, life: 18 + Math.random() * 5
  });
}


// ===== CHESTS =====
function updateChests(dt) {
  for (let i = chests.length - 1; i >= 0; i--) {
    const ch = chests[i];
    ch.life -= dt;
    ch.sparkleT += dt;
    if (ch.life <= 0) { chests.splice(i, 1); continue; }
    // Pull toward player when close
    const d = dist(player.x, player.y, ch.x, ch.y);
    if (d < 60 && !ch.open) {
      const dx = player.x - ch.x, dy = player.y - ch.y;
      ch.x += dx * dt * 6; ch.y += dy * dt * 6;
    }
    if (d < 28 && !ch.open) {
      ch.open = true;
      // Pause game state → show chest reward screen
      chestChoices = { chest: ch, choices: pickChestRewards(3) };
      state = 'chest';
      playSFX('levelup');
      chests.splice(i, 1);
    }
  }
}

function pickChestRewards(n) {
  // Same pool as level-up but weighted toward weapons/evolutions
  const ownedWpns = new Set(activeWeapons.map(w => w.type));
  const evos = checkEvolutions();
  const wlvls = getWeaponLevelOptions();
  const statUpgrades = UPGRADES.filter(u => {
    if (u.id.startsWith('wpn')) {
      const wpnKey = u.id === 'wpnFire'?'fireball':u.id==='wpnIce'?'ice':u.id==='wpnBoom'?'boomerang':
        u.id==='wpnHoly'?'holywater':u.id==='wpnTorn'?'tornado':u.id==='wpnWhip'?'whip':
        u.id==='wpnLight'?'lightning':u.id==='wpnGarl'?'garlic':null;
      if (wpnKey && ownedWpns.has(wpnKey)) return false;
    }
    return true;
  });
  let pool = [];
  for (const e of evos) pool.push(e);
  for (const w of wlvls.sort(() => Math.random()-0.5)) { if (pool.length >= n) break; pool.push(w); }
  for (const s of statUpgrades.sort(() => Math.random()-0.5)) { if (pool.length >= n) break; pool.push(s); }
  return pool.slice(0, n);
}

function drawChests() {
  for (const ch of chests) {
    const sx = ch.x - cam.x, sy = ch.y - cam.y;
    if (sx < -60 || sx > W+60 || sy < -60 || sy > H+60) continue;
    const bob = Math.sin(ch.sparkleT * 2.5) * 5;
    // Glow aura
    const gGrd = ctx.createRadialGradient(sx, sy+bob, 0, sx, sy+bob, 38);
    gGrd.addColorStop(0, 'rgba(255,220,50,0.5)'); gGrd.addColorStop(1, 'rgba(255,180,0,0)');
    ctx.save(); ctx.globalAlpha = 0.6 + 0.3 * Math.sin(ch.sparkleT*4);
    ctx.fillStyle = gGrd; ctx.beginPath(); ctx.arc(sx, sy+bob, 38, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // Chest SVG
    const img = itemImgs['chest'];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.save();
      ctx.shadowBlur = 16; ctx.shadowColor = '#FFD700';
      ctx.drawImage(img, sx-22, sy+bob-22, 44, 40);
      ctx.restore();
    }
    // Sparkles
    for (let si=0; si<4; si++) {
      const sa = (si/4)*Math.PI*2 + ch.sparkleT*3;
      const sr = 28 + Math.sin(ch.sparkleT*5+si)*6;
      ctx.save(); ctx.globalAlpha = 0.8 * Math.abs(Math.sin(ch.sparkleT*3+si));
      ctx.fillStyle = '#FFFACD'; ctx.font = '10px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✦', sx+Math.cos(sa)*sr, sy+bob+Math.sin(sa)*sr*0.6);
      ctx.restore();
    }
    // "!" indicator
    ctx.save(); ctx.fillStyle='#ffffff'; ctx.font='bold 14px monospace';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.shadowBlur=8; ctx.shadowColor='#FFD700';
    ctx.fillText('！', sx, sy+bob-25);
    ctx.restore();
  }
}

function drawChestScreen() {
  // Show game behind dimmed
  drawBG(); drawPuddlesAndTornados(); drawGems(); drawWeapons(); drawEnemies(); drawPlayer();
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);

  // Title
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=30; ctx.shadowColor='#FFD700';
  ctx.fillStyle='#FFD700'; ctx.font='bold 36px monospace';
  ctx.fillText('🎁 宝箱をあけた！ 🎁', W/2, 72);
  ctx.fillStyle='#FFFACD'; ctx.font='16px monospace';
  ctx.fillText('ほうびをえらんでね！（経験値には関係ないよ）', W/2, 110);
  ctx.restore();

  // Open chest image centered
  const oImg = itemImgs['chest_open'];
  if (oImg && oImg.complete && oImg.naturalWidth > 0) {
    ctx.save(); ctx.shadowBlur=20; ctx.shadowColor='#FFD700';
    ctx.drawImage(oImg, W/2-30, 118, 60, 52); ctx.restore();
  }

  if (!chestChoices) return;
  const choices = chestChoices.choices;
  const count = choices.length;
  const cardW = 195, cardH = 220, gap = 16;
  const totalW = count*cardW + (count-1)*gap;
  const startX = W/2 - totalW/2;

  choices.forEach((u, i) => {
    const cx2 = startX + i*(cardW+gap), cy2 = 180;
    const isHovered = mousePos.x >= cx2 && mousePos.x < cx2+cardW && mousePos.y >= cy2 && mousePos.y < cy2+cardH;

    ctx.fillStyle='rgba(0,0,0,0.5)'; rr(ctx, cx2+4, cy2+4, cardW, cardH, 16); ctx.fill();
    const cg = ctx.createLinearGradient(cx2, cy2, cx2, cy2+cardH);
    cg.addColorStop(0, isHovered ? '#4a3500':'#2e2000');
    cg.addColorStop(1, isHovered ? '#3a2800':'#1e1400');
    ctx.fillStyle=cg; rr(ctx, cx2, cy2, cardW, cardH, 16); ctx.fill();
    ctx.strokeStyle = isHovered ? '#FFD700' : '#AA8800'; ctx.lineWidth=isHovered?2.5:1.5;
    rr(ctx, cx2, cy2, cardW, cardH, 16); ctx.stroke();

    // Icon
    const wImg2 = u.iconKey ? weaponIconImgs[u.iconKey] : null;
    if (wImg2 && wImg2.complete && wImg2.naturalWidth > 0) {
      ctx.drawImage(wImg2, cx2+cardW/2-22, cy2+26, 44, 44);
      ctx.fillStyle='#88ff44'; ctx.font='bold 12px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⬆ Lv.UP', cx2+cardW/2, cy2+78);
    } else {
      ctx.font='40px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(u.icon, cx2+cardW/2, cy2+52);
    }

    ctx.save(); ctx.shadowBlur=10; ctx.shadowColor='#FFD700';
    ctx.fillStyle=isHovered?'#FFD700':'#FFFACD'; ctx.font='bold 13px monospace';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(u.name, cx2+cardW/2, cy2+96); ctx.restore();

    ctx.fillStyle='#ccbb88'; ctx.font='11px monospace';
    ctx.fillText(u.desc, cx2+cardW/2, cy2+118);

    // Number badge
    ctx.save(); ctx.fillStyle='#FFD700'; ctx.font='bold 15px monospace';
    ctx.fillText('['+(i+1)+']', cx2+cardW/2, cy2+16); ctx.restore();
  });

  ctx.fillStyle='#887766'; ctx.font='12px monospace';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('1 / 2 / 3 キーかクリックでえらぼう！', W/2, H-16);
}

// ===== GEMS =====
function updateGems(dt) {
  const magR = player.magnetRange || 80;
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.life -= dt;
    if (g.life <= 0) { gems.splice(i, 1); continue; }
    const d = dist(player.x, player.y, g.x, g.y);
    if (d < magR) {
      const dx = player.x - g.x, dy = player.y - g.y;
      const pull = lerp(3, 12, 1 - d / magR);
      g.x += dx * dt * pull; g.y += dy * dt * pull;
    }
    if (d < 22) {
      if (g.def.exp > 0) {
        player.exp += g.def.exp;
        playSFX('gemcoll');
        fxList.push({ type: 'text', x: g.x, y: g.y, text: '+' + g.def.exp + ' EXP', life: 0.8, color: g.def.color, vy: -55 });
      }
      if (g.def.hp > 0) {
        player.hp = Math.min(player.hp + g.def.hp, player.maxHp);
        fxList.push({ type: 'text', x: g.x, y: g.y, text: '❤️ +'+ g.def.hp, life: 1.0, color: '#ff6699', vy: -55 });
      }
      gems.splice(i, 1);
      while (player.exp >= player.expNext) {
        player.exp -= player.expNext;
        player.level++;
        player.expNext = 60 + player.level * 42;
        if (!player._trialMode) levelUpPending++;
        fxList.push({ type: 'text', x: player.x, y: player.y - 50, text: '⭐ LEVEL UP!', life: 1.5, color: '#ffff44', vy: -45, big: true });
        playSFX('levelup');
      }
    }
  }
}

// ===== PLAYER UPDATE =====
function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (K['ArrowLeft'] || K['KeyA']) dx -= 1;
  if (K['ArrowRight'] || K['KeyD']) dx += 1;
  if (K['ArrowUp']   || K['KeyW']) dy -= 1;
  if (K['ArrowDown'] || K['KeyS']) dy += 1;

  if (touch.down) {
    const jdx = touch.curX - touch.startX, jdy = touch.curY - touch.startY;
    const jd = Math.sqrt(jdx * jdx + jdy * jdy);
    if (jd > 15) { dx = jdx / jd; dy = jdy / jd; }
  }

  const len = Math.sqrt(dx * dx + dy * dy);
  if (len > 0) { dx /= len; dy /= len; }

  player.knockX *= (1 - dt * 7);
  player.knockY *= (1 - dt * 7);
  const _spdFactor = 1 - Math.min(0.65, player._slowDebuff||0);
  const _confX = player._confused ? -dx : dx;
  const _confY = player._confused ? -dy : dy;
  player.x += (_confX * player.spd * 60 * _spdFactor + player.knockX) * dt;
  player.y += (_confY * player.spd * 60 * _spdFactor + player.knockY) * dt;

  if (dx !== 0) player.facing = dx > 0 ? 1 : -1;
  // Save normalized move direction for directional weapons
  if (dx !== 0 || dy !== 0) {
    player.moveDirX = dx;
    player.moveDirY = dy;
  }
  // Default: if not moving at all, keep last direction
  // Store full move angle for directional weapons (paw, etc.)
  if (dx !== 0 || dy !== 0) {
    player.moveAngle = Math.atan2(dy, dx);
  }
  // Default to facing direction if standing still
  if (player.moveAngle === undefined) player.moveAngle = player.facing > 0 ? 0 : Math.PI;
  if (player.invincible > 0) player.invincible -= dt;
  if (player.hp <= 0) {
    if (player._trialMode) {
      // Trial mode: return to boss select instead of gameover
      player._trialMode = false;
      _trialDefeated = false;
      _trialDefeatTimer = 0;
      enemies.length = 0;
      deactivateArena();
      state = 'bossTrialSelect';
      bossTrialState = 'bossSelect';
      fxList.push({type:'text',x:player.x,y:player.y-60,text:'💀 やられた…もう一度！',life:3,color:'#ff6688',vy:-20,big:true});
      playHomeBGM()
    } else {
      state = 'gameover';
    }
  }

  // Camera lerp
  const stgC = STAGES[selectedStage] || STAGES[0];
  if (stgC && stgC.isCorridor) {
    // 回廊：X固定（ふすま壁が担当）、Y方向のみスムーズ追従（揺れ防止）
    if (_corridorCenterX) cam.x = _corridorCenterX - W / 2;
    cam.y += (player.y - H / 2 - cam.y) * Math.min(dt * 7, 0.15);
    // 初回のみズームを0.78に設定（引きめの視点）
    if (!_corridorZoomSet) { cam.zoom = 0.78; _corridorZoomSet = true; }
  } else {
    cam.x += (player.x - W / 2 - cam.x) * dt * 9;
    cam.y += (player.y - H / 2 - cam.y) * dt * 9;
  }
}

let _corridorZoomSet = false;

// ===== FX UPDATE =====
function updateFX(dt) {
  // Cap fx list to prevent memory bloat (increased cap for boss telegraphs)
  if (fxList.length > 260) fxList.splice(0, fxList.length - 260);
  for (let i = fxList.length - 1; i >= 0; i--) {
    const f = fxList[i];
    // Abyss hole: pull + damage nearby enemies
    processBossSpecialFX(f, dt);
    if (f.type === 'abyssHole') {
      f.life -= dt;
      f.tickTimer = (f.tickTimer || 0) + dt;
      for (const e of enemies) {
        const dx2 = e.x - f.x, dy2 = e.y - f.y;
        const dd2 = Math.sqrt(dx2*dx2+dy2*dy2)||1;
        if (dd2 < 200) {
          const ps = f.pullForce * (1 - dd2/200) * dt;
          e.x -= (dx2/dd2)*ps; e.y -= (dy2/dd2)*ps;
        }
      }
      if (f.tickTimer >= 0.18) {
        f.tickTimer -= 0.18;
        for (const e of enemies) {
          if (Math.sqrt((e.x-f.x)**2+(e.y-f.y)**2) < 130)
            e.takeDmg(f.dmgPerSec * 0.18, 0.0, f.x, f.y);
        }
      }
      if (f.life <= 0) { fxList.splice(i,1); }
      continue;
    }
    // ── BEAM TELEGRAPH: count down then fire the real beam ──────────────────
    if (f.type === 'beamTelegraph') {
      f.timer -= dt;
      if (f.timer <= 0 && !f._fired) {
        f._fired = true;
        spawnBeam(f.x, f.y, f.angle, f.length, f.color, f.width, f.life2 || 0.8, f.bid);
      }
      f.life -= dt;
      if (f.life <= 0) fxList.splice(i, 1);
      continue;
    }
    // ── BURNING FLOOR: brief hitbox that fades quickly ───────────────────────
    if (f.type === 'burningFloor') {
      f.life -= dt;
      f.hitTimer = (f.hitTimer || 0) + dt;
      // Damage check only for first 0.6s (hitbox disappears after that)
      if (f.life > f.maxLife - 0.6 && f.hitTimer >= 0.12 && player) {
        f.hitTimer -= 0.12;
        const dx=player.x-f.x, dy=player.y-f.y;
        if (Math.sqrt(dx*dx+dy*dy) < f.r) {
          player.hp -= f.dmg;
          player.flashLife = 0.05;
        }
      }
      if (f.life <= 0) fxList.splice(i, 1);
      continue;
    }
    f.life -= dt;
    if (f.vy) f.y += f.vy * dt;
    if (f.type === 'ring' || f.type === 'explosion') f.r += (f.maxR - f.r) * dt * 5;
    if (f.life <= 0) fxList.splice(i, 1);
  }
}

// ===== HELPERS =====
function nearestEnemy(x, y, maxD) {
  let best = null, bd = maxD;
  for (const e of enemies) {
    const d = dist(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

// ===== LEVEL UP =====
function getWeaponLevelOptions() {
  const opts = [];
  // 合成済み武器IDセット（これらはレベルアップ選択肢から完全除外）
  const EVOLVED_WEAPONS = new Set(['holyorbit','frostlightning','firetornado','megapaw','shadowaura']);
  for (const w of activeWeapons) {
    if (w.level >= 5) continue;
    // 合成で消費した素材武器は除外
    if (evolvedFrom.has(w.type)) continue;
    // 合成後の進化武器自体もレベルアップ選択肢に出さない
    if (EVOLVED_WEAPONS.has(w.type)) continue;
    const descArr = WEAPON_LEVEL_DESC[w.type];
    if (!descArr) continue;
    const desc = descArr[w.level - 1];
    if (!desc) continue;
    opts.push({
      id: 'wlvl_' + w.type,
      name: (WEAPON_NAMES[w.type] || w.type) + '  Lv.' + (w.level + 1),
      icon: '⬆️',
      iconKey: w.type,
      desc: desc,
      apply: () => { w.level++; }
    });
  }
  return opts;
}

function pickUpgrades(n) {
  const ownedWpns = new Set(activeWeapons.map(w => w.type));
  // Count weapons (evolved count as 2)
  const wpnSlots = activeWeapons.reduce((sum, w) => {
    const isEvolved = ['holyorbit','frostlightning','firetornado','megapaw','shadowaura'].includes(w.type);
    return sum + (isEvolved ? 2 : 1);
  }, 0);
  const available = UPGRADES.filter(u => {
    // isAvail条件チェック（弾数UPなどの段階制御）
    if (u.isAvail && !u.isAvail(player)) return false;
    if (u.id === 'wpnFire'  && (ownedWpns.has('fireball') || evolvedFrom.has('fireball')))  return false;
    if (u.id === 'wpnIce'   && (ownedWpns.has('ice') || evolvedFrom.has('ice')))       return false;
    if (u.id === 'wpnBoom'  && (ownedWpns.has('boomerang') || evolvedFrom.has('boomerang'))) return false;
    if (u.id === 'wpnHoly'  && (ownedWpns.has('holywater') || evolvedFrom.has('holywater'))) return false;
    if (u.id === 'wpnTorn'  && (ownedWpns.has('tornado') || evolvedFrom.has('tornado')))   return false;
    if (u.id === 'wpnWhip'  && (ownedWpns.has('whip') || evolvedFrom.has('whip')))      return false;
    if (u.id === 'wpnLight' && (ownedWpns.has('lightning') || evolvedFrom.has('lightning'))) return false;
    if (u.id === 'wpnGarl'  && (ownedWpns.has('garlic') || evolvedFrom.has('garlic') || ownedWpns.has('shadowaura')))    return false;
    // wpnAura blocking is handled in cross-availability block above
    // ── 合成で消費した武器は再入手不可（orbit / shield も含む） ──
    if (u.id === 'wpnOrbit'  && evolvedFrom.has('orbit'))  return false;
    if (u.id === 'wpnShield' && evolvedFrom.has('shield')) return false;
    // ── Unique weapon cross-availability ──────────────────────────────────────
    // shiro(orbit) ↔ kutsushita(shield): each can pick the other's weapon for evolution
    // shiro(orbit) ↔ kuro(aura): can cross-pick for shadow/aura evolution
    // kuro(aura)   ↔ shiro(orbit): same
    const _charId = CHARS[selChar]?.id;
    // Orbit: own weapon for shiro, partner for kutsushita, cross for kuro
    if (u.id === 'wpnOrbit' && (ownedWpns.has('orbit') || evolvedFrom.has('orbit'))) {
      if (_charId !== 'kutsushita' && _charId !== 'kuro') return false;
    }
    if (u.id === 'wpnOrbit' && !ownedWpns.has('orbit') && !evolvedFrom.has('orbit')) {
      if (_charId !== 'shiro' && _charId !== 'kutsushita' && _charId !== 'kuro') return false;
    }
    // Shield: own weapon for kutsushita, partner for shiro
    if (u.id === 'wpnShield' && (ownedWpns.has('shield') || evolvedFrom.has('shield'))) {
      if (_charId !== 'shiro') return false;
    }
    if (u.id === 'wpnShield' && !ownedWpns.has('shield') && !evolvedFrom.has('shield')) {
      if (_charId !== 'kutsushita' && _charId !== 'shiro') return false;
    }
    // Aura: own weapon for kuro, cross for shiro (shadow evolution path)
    if (u.id === 'wpnAura' && (ownedWpns.has('aura') || evolvedFrom.has('aura') || ownedWpns.has('shadowaura'))) return false;
    if (u.id === 'wpnAura' && !ownedWpns.has('aura') && !evolvedFrom.has('aura')) {
      if (_charId !== 'kuro' && _charId !== 'shiro') return false;
    }
    // Block all new-weapon upgrades when weapon slots are full (max 5, evolved=2)
    const isNewWpn = ['wpnOrbit','wpnShield','wpnRapid','wpnTriple','wpnAura','wpnWhip',
                      'wpnLight','wpnGarl','wpnFire','wpnIce','wpnBoom','wpnHoly','wpnTorn'].includes(u.id);
    if (isNewWpn && wpnSlots >= 5) return false;
    return true;
  });
  // Combine: evolutions with 90%確率（ほぼ確定だが低確率で外れる）、その後レベルアップ・ステータス
  const evos = checkEvolutions();
  const wlvls = getWeaponLevelOptions();
  const statUpgrades = [...available].sort(() => Math.random() - 0.5);

  // ── Weighted selection ──────────────────────────────
  // All items base weight = 1.0; own/partner weapon = 1.6x
  const charCfg = CHARS[selChar] || {};
  const ownWpn = charCfg.wpn || '';
  const partnerWpn = charCfg.partnerWpn || '';

  function weightedPick(arr, getWeight) {
    const total = arr.reduce((s, x) => s + getWeight(x), 0);
    if (total <= 0) return null;
    let r = Math.random() * total;
    for (const x of arr) { r -= getWeight(x); if (r <= 0) return x; }
    return arr[arr.length - 1];
  }

  function wpnWeight(wl) {
    const t = wl.id.replace('wlvl_', '');
    return (t === ownWpn || t === partnerWpn) ? 1.6 : 1.0;
  }

  let pool = [];
  // Evolutions first (high priority)
  if (evos.length > 0 && Math.random() < 0.90) {
    pool.push(evos[Math.floor(Math.random() * evos.length)]);
  }
  // Fill remaining slots from weapon level-ups (weighted) then stats
  const wlvlRemaining = [...wlvls];
  while (pool.length < n && wlvlRemaining.length > 0) {
    const picked = weightedPick(wlvlRemaining, wpnWeight);
    if (!picked) break;
    wlvlRemaining.splice(wlvlRemaining.indexOf(picked), 1);
    if (!pool.find(p2 => p2.id === picked.id)) pool.push(picked);
  }
  const statRemaining = [...statUpgrades];
  while (pool.length < n && statRemaining.length > 0) {
    pool.push(statRemaining.shift());
  }
  return pool.slice(0, n);
}

function applyChestReward(u) {
  if (!u) return;
  const _getSlots = () => activeWeapons.reduce((s,w)=>s+(['holyorbit','frostlightning','firetornado','megapaw','shadowaura'].includes(w.type)?2:1),0);
  const gameCtx = { addWeapon: (type) => {
    if (_getSlots() < 5) activeWeapons.push(createWeapon(type));
    else fxList.push({type:'text',x:player.x,y:player.y-50,text:'⚠️ 武器スロット満杯！',life:2,color:'#ff8844',vy:-20,big:false});
  }};
  u.apply(player, gameCtx);
  chestChoices = null;
  state = 'playing';
  fxList.push({ type:'text', x:player.x, y:player.y-50, text:'🎁 宝箱ゲット！', life:1.8, color:'#FFD700', vy:-40, big:true });
}

function applyUpgrade(u) {
  if (!u) return;
  const gameCtx = { addWeapon: (type) => activeWeapons.push(createWeapon(type)) };

  }
}


// ===== BACKGROUND =====
function makeBgCanvas() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = 128; bgCanvas.height = 128;
  const bctx = bgCanvas.getContext('2d');
  const stg = STAGES[selectedStage] || STAGES[0];

  // ── 回廊マップ：木の廊下 + ふすま壁 ──
  if (stg.isCorridor) {
    // 木の床タイル（暗い飴色の板張り）
    const floorColors = ['#160c04','#1a0e06','#130804','#1e1008'];
    for (let row = 0; row < 8; row++) {
      const y2 = row * 16;
      const ci = row % floorColors.length;
      bctx.fillStyle = floorColors[ci];
      bctx.fillRect(0, y2, 128, 16);
      // 木目（細い横線）
      for (let gi = 0; gi < 3; gi++) {
        bctx.fillStyle = 'rgba(0,0,0,0.18)';
        bctx.fillRect(0, y2 + 4 + gi*4, 128, 1);
      }
      // 板の継ぎ目（縦線、交互オフセット）
      const offset = (row % 2 === 0) ? 0 : 42;
      for (let col = 0; col < 4; col++) {
        bctx.fillStyle = 'rgba(0,0,0,0.35)';
        bctx.fillRect(col*42 + offset, y2, 1, 16);
      }
      // 木の節（まれに）
      if (row % 3 === 1) {
        bctx.fillStyle = 'rgba(0,0,0,0.2)';
        bctx.beginPath();
        bctx.ellipse(20 + row*15, y2+8, 4, 2, 0, 0, Math.PI*2);
        bctx.fill();
      }
    }
    // 横の目地ライン
    bctx.fillStyle = 'rgba(0,0,0,0.4)';
    for (let row = 0; row < 8; row++) bctx.fillRect(0, row*16+15, 128, 1);
    return;
  }

  bctx.fillStyle = stg.bgColors[0]; bctx.fillRect(0, 0, 128, 128);
  for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 4; tx++) {
    if ((tx + ty) % 2 === 0) { bctx.fillStyle = stg.bgColors[1] || stg.bgColors[0]; bctx.fillRect(tx * 32, ty * 32, 32, 32); }
  }
  bctx.fillStyle = '#1e3d12';
  for (let i = 0; i < 25; i++) bctx.fillRect(Math.random() * 128 | 0, Math.random() * 128 | 0, 3, 3);
  // Flowers
  for (let fi = 0; fi < 10; fi++) {
    const fx = (Math.random() * 128) | 0, fy = (Math.random() * 128) | 0;
    const fc = Math.random();
    bctx.fillStyle = fc < 0.33 ? '#ffaaff' : fc < 0.66 ? '#ffffaa' : '#aaffcc';
    // petal cross
    bctx.fillRect(fx - 1, fy - 3, 2, 6);
    bctx.fillRect(fx - 3, fy - 1, 6, 2);
    bctx.fillStyle = '#ffff88';
    bctx.fillRect(fx - 1, fy - 1, 2, 2);
  }
  // Small rocks
  for (let ri = 0; ri < 6; ri++) {
    const rx = (Math.random() * 128) | 0, ry = (Math.random() * 128) | 0;
    bctx.fillStyle = '#556644';
    bctx.beginPath(); bctx.ellipse(rx, ry, 4, 3, Math.random() * Math.PI, 0, Math.PI * 2); bctx.fill();
  }
  // Grass blades
  for (let gi = 0; gi < 12; gi++) {
    const gx = (Math.random() * 128) | 0, gy = (Math.random() * 128) | 0;
    bctx.strokeStyle = Math.random() < 0.5 ? '#3a6e20' : '#4a8e28';
    bctx.lineWidth = 1;
    bctx.beginPath();
    bctx.moveTo(gx, gy); bctx.lineTo(gx + (Math.random()-0.5)*4, gy - 5 - Math.random()*4);
    bctx.stroke();
  }
}

function drawBG() {
  if (!bgCanvas) makeBgCanvas();
  const pat = ctx.createPattern(bgCanvas, 'repeat');
  const zoom = cam.zoom || 1.0;
  ctx.save();
  // ズーム時にキャンバス全体を覆うよう描画範囲を逆スケール拡張
  // ズームが小さいほど広い範囲を塗る必要がある
  const extra = zoom < 1.0 ? Math.ceil(W / zoom) + 256 : 256;
  const offX = -((cam.x % 128 + 128) % 128);
  const offY = -((cam.y % 128 + 128) % 128);
  ctx.translate(offX, offY);
  ctx.fillStyle = pat;
  ctx.fillRect(-extra, -extra, W + extra * 2 + 128, H + extra * 2 + 128);
  ctx.restore();
  // Stage-specific overlays
  const stg = STAGES[selectedStage];
  if (stg && stg.skyGrad) {
    const sg = ctx.createLinearGradient(0, 0, 0, H);
    stg.skyGrad.forEach((col, idx) => sg.addColorStop(idx/(stg.skyGrad.length-1), col));
    ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if (stg && stg.ambientParticle === 'rain') drawRain();
  if (stg && stg.ambientParticle === 'firefly') drawFireflies();
  if (stg && stg.ambientParticle === 'lava') drawLava();
  if (stg && stg.ambientParticle === 'snow') drawSnowParticles();
  if (stg && stg.ambientParticle === 'bubbles') drawBubbles();
  if (stg && stg.ambientParticle === 'sparks') {
    drawCorridorWalls();
    drawCorridorSparks();
    drawCorridorForkIndicators();
  }
}

function drawSnowParticles() {
  ctx.save(); ctx.globalAlpha = 0.55;
  for (let i = 0; i < 30; i++) {
    const sx = ((i*137 + gameTime*22 + cam.x*0.3) % (W+20)) - 10;
    const sy = ((i*83  + gameTime*35 + cam.y*0.3) % (H+20)) - 10;

// ── 回廊の壁（縦長の廊下）──────────────────────────────
// Corridor segment data: generated once per corridor visit
let _corridorSegments = null;
let _corridorSeed = 0;

function _genCorridorSegments() {
  // Generate a vertical corridor with varying widths
  const CORRIDOR_BASE_W = 160; // base corridor width in world units
  const segments = [];
  let worldY = -2000;
  while (worldY < 12000) {
    // Normal narrow section
    const narrowH = 200 + Math.random() * 200;
    segments.push({ y: worldY, h: narrowH, type: 'narrow', w: CORRIDOR_BASE_W });
    worldY += narrowH;
    // Occasional wider room
    if (Math.random() < 0.35) {
      const wideH = 150 + Math.random() * 100;
      const wideW = CORRIDOR_BASE_W + 80 + Math.random() * 80;
      segments.push({ y: worldY, h: wideH, type: 'wide', w: wideW });
      worldY += wideH;
    }
  }
  return segments;
}

function _getCorridorWallX(worldY) {
  if (!_corridorSegments) return { left: W/2 - 80, right: W/2 + 80, halfW: 80 };
  // Find which segment this Y is in
  for (const seg of _corridorSegments) {
    if (worldY >= seg.y && worldY < seg.y + seg.h) {
      const halfW = seg.w / 2;
      // Smooth transition at segment boundaries
      const progress = (worldY - seg.y) / seg.h;
      return { halfW };
    }
  }
  return { halfW: 80 };
}

function drawCorridorWalls() {
  const stg = STAGES[selectedStage] || STAGES[0];
  if (!stg.isCorridor) return;

  // ── 回廊の固定幅 ────────────────────────────────────────────────────
  const CORR_W = 200; // 廊下の幅（ワールド単位）
  // 廊下の中心X はゲーム開始時のプレイヤーX に固定
  if (!_corridorCenterX && player) _corridorCenterX = player.x;
  const cx = _corridorCenterX || 0;
  const leftWall  = cx - CORR_W / 2;  // 左壁のワールドX
  const rightWall = cx + CORR_W / 2;  // 右壁のワールドX

  // スクリーン座標
  const leftSX  = leftWall  - cam.x;   // 左壁の右端（スクリーン）
  const rightSX = rightWall - cam.x;   // 右壁の左端（スクリーン）

  // ── プレイヤーをX軸に固定 ───────────────────────────────────────────
  if (player) {
    const pad = player.r + 4;
    if (player.x < leftWall  + pad) { player.x = leftWall  + pad; player.knockX = 0; }
    if (player.x > rightWall - pad) { player.x = rightWall - pad; player.knockX = 0; }
    // カメラX も廊下中心を常に画面中央に
    cam.x = cx - W / 2;
  }

  // ── 壁の外側（真っ暗）───────────────────────────────────────────────
  ctx.save();
  ctx.fillStyle = '#060308';
  ctx.fillRect(0, 0, Math.max(0, leftSX), H);
  ctx.fillRect(rightSX, 0, W - rightSX, H);

  // ── ふすま壁テクスチャ（左）─────────────────────────────────────────
  _drawFusumaWall(0, leftSX, true);
  _drawFusumaWall(rightSX, W - rightSX, false);

  // ── 敵のX位置も廊下内に限定 ─────────────────────────────────────────
  for (const e of enemies) {
    if (!e.boss) {
      if (e.x < leftWall + e.r)  { e.x = leftWall + e.r;  e.knockX = 0; }
      if (e.x > rightWall - e.r) { e.x = rightWall - e.r; e.knockX = 0; }
    }
  }
  ctx.restore();
}

// ふすまの壁を描画（Screen X, 幅, 左右フラグ）
function _drawFusumaWall(sx, width, isLeft) {
  if (width <= 0) return;
  ctx.save();
  // 壁の基本色（古い屋敷のふすま：薄い黄みがかった白）
  const wallGrad = ctx.createLinearGradient(sx, 0, sx + width, 0);
  if (isLeft) {
    wallGrad.addColorStop(0, '#0a0608');
    wallGrad.addColorStop(0.6, '#1a1008');
    wallGrad.addColorStop(1, '#c8a870');
  } else {
    wallGrad.addColorStop(0, '#c8a870');
    wallGrad.addColorStop(0.4, '#1a1008');
    wallGrad.addColorStop(1, '#0a0608');
  }
  ctx.fillStyle = wallGrad;
  ctx.fillRect(sx, 0, width, H);

  // ふすまの幅（廊下側12px）
  const fusumaW = Math.min(width, 40);
  const fusumaX = isLeft ? sx + width - fusumaW : sx;

  // ふすまパネル（薄い白地に格子）
  const panelGrad = ctx.createLinearGradient(fusumaX, 0, fusumaX + fusumaW, 0);
  panelGrad.addColorStop(0, isLeft ? '#e8dfc0' : '#8a6830');
  panelGrad.addColorStop(1, isLeft ? '#8a6830' : '#e8dfc0');
  ctx.fillStyle = panelGrad;
  ctx.fillRect(fusumaX, 0, fusumaW, H);

  // ふすまの格子（細かいグリッド線）
  const gridSize = 20;
  ctx.strokeStyle = 'rgba(120,90,40,0.5)';
  ctx.lineWidth = 0.8;
  // 縦線
  for (let gx = fusumaX; gx <= fusumaX + fusumaW; gx += gridSize) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  // 横線
  const camOff = cam.y % gridSize;
  for (let gy = -camOff; gy <= H; gy += gridSize) {
    ctx.beginPath(); ctx.moveTo(fusumaX, gy); ctx.lineTo(fusumaX + fusumaW, gy); ctx.stroke();
  }

  // 壁際の柱（木の柱）
  const postW = 6;
  const postX = isLeft ? (sx + width - postW - fusumaW) : (sx + fusumaW);
  const postGrad = ctx.createLinearGradient(postX, 0, postX + postW, 0);
  postGrad.addColorStop(0, '#3a2008');
  postGrad.addColorStop(0.5,'#6a4818');
  postGrad.addColorStop(1, '#3a2008');
  ctx.fillStyle = postGrad;
  ctx.fillRect(postX, 0, postW, H);

  // 柱の横木（ランダム位置に節）
  ctx.fillStyle = '#2a1808';
  const camY = cam.y;
  for (let ni = 0; ni < 8; ni++) {
    const ny = ((ni * 137 - camY) % H + H) % H;
    ctx.fillRect(postX, ny, postW, 2);
  }

  // ろうそくの明かり（廊下との境目に橙色の光）
  const glowX = isLeft ? sx + width - 2 : sx + 1;
  const glowGrad = ctx.createLinearGradient(glowX - 18, 0, glowX, 0);
  if (!isLeft) { glowGrad.addColorStop(0, 'rgba(255,140,30,0.18)'); glowGrad.addColorStop(1, 'rgba(255,140,30,0)'); }
  else          { glowGrad.addColorStop(0, 'rgba(255,140,30,0)'); glowGrad.addColorStop(1, 'rgba(255,140,30,0.18)'); }
  ctx.fillStyle = glowGrad;
  ctx.fillRect(isLeft ? glowX - 18 : glowX, 0, 18, H);

  // 壁際のランタン（Y方向に流れる）
  const lanternSpacing = 200;
  for (let li = 0; li < 6; li++) {
    const ly = ((li * lanternSpacing - cam.y) % (lanternSpacing * 6) + lanternSpacing * 6) % (lanternSpacing * 6);
    if (ly < -20 || ly > H + 20) continue;
    const lx = isLeft ? sx + width - 8 : sx + 2;
    // ランタン本体
    ctx.fillStyle = '#cc8830';
    ctx.fillRect(lx - 4, ly, 8, 12);
    // 光の揺らぎ
    const flicker = 0.3 + 0.15 * Math.sin(gameTime * 5 + li * 1.3);
    ctx.save();
    ctx.globalAlpha = flicker;
    const lgrd = ctx.createRadialGradient(lx, ly + 6, 0, lx, ly + 6, 40);
    lgrd.addColorStop(0, 'rgba(255,200,80,0.7)');
    lgrd.addColorStop(1, 'rgba(255,140,20,0)');
    ctx.fillStyle = lgrd;
    ctx.beginPath(); ctx.arc(lx, ly + 6, 40, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

let _corridorCenterX = null;

// ── 回廊の迷路分岐システム ────────────────────────────────────────────────
let _corridorForks = [];
let _corridorNextForkY = 0;
let _corridorMazeRooms = [];

function _initCorridorForks() {
  _corridorForks = [];
  _corridorMazeRooms = [];
  _corridorNextForkY = 600;
  _corridorMazeRooms.push({ y: 0, type: 'straight' });
}

function updateCorridorForks(dt) {
  const stg = STAGES[selectedStage] || STAGES[0];
  if (!stg.isCorridor || !player) return;
  const cx = _corridorCenterX || player.x;

  if (player.y + 600 > _corridorNextForkY) {
    const forkY = _corridorNextForkY;
    const hasFork = Math.random() < 0.65;
    if (hasFork) {
      const chestSide = Math.random() < 0.5 ? -1 : 1;
      _corridorForks.push({ y: forkY, chestSide, chestSpawned: false, passed: false, shown: false });
      _corridorMazeRooms.push({ y: forkY, type: 'fork', cx });
    } else {
      _corridorMazeRooms.push({ y: forkY, type: 'straight', cx });
    }
    _corridorNextForkY += 480 + Math.random() * 600;
  }

  for (const fork of _corridorForks) {
    if (fork.passed) continue;
    const distY = fork.y - player.y;
    if (!fork.chestSpawned && distY < 280 && distY > -60) {
      fork.chestSpawned = true;
      chests.push({ x: cx + fork.chestSide * 74, y: fork.y, bobT: 0, sparkleT: 0, life: 60, open: false, _corridorFork: true });
      if (!fork.shown) {
        fork.shown = true;
        fxList.push({ type:'text', x:cx, y:fork.y - 50, text:'🗝 分かれ道！宝箱あり', life:3.5, color:'#ffdd66', vy:-14 });
      }
    }
    if (player.y > fork.y + 300) fork.passed = true;
  }
  _corridorForks = _corridorForks.filter(f => f.y > player.y - 1200);
}

function drawCorridorForkIndicators() {
  const stg = STAGES[selectedStage] || STAGES[0];
  if (!stg.isCorridor || !player) return;
  const cx = _corridorCenterX || player.x;
  for (const fork of _corridorForks) {
    if (fork.passed || !fork.chestSpawned) continue;
    const sy = fork.y - cam.y;
    const sxC = cx - cam.x;
    if (sy < -80 || sy > H + 80) continue;
    const glowX = sxC + fork.chestSide * 74;
    ctx.save();
    ctx.globalAlpha = 0.16 + 0.06 * Math.sin(gameTime * 4);
    const grd = ctx.createRadialGradient(glowX, sy, 0, glowX, sy, 50);
    grd.addColorStop(0, 'rgba(255,215,60,0.9)');
    grd.addColorStop(1, 'rgba(255,170,20,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(glowX, sy, 50, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(160,120,50,0.45)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(glowX, sy, 26, Math.PI, 0); ctx.stroke();
    ctx.restore();
  }
}

let fireflyPhases = Array.from({length:12},(_,i)=>i/12*Math.PI*2);
function drawFireflies() {
